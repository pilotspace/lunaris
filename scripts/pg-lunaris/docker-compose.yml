# Phase 14-01 (CI-01) — Local reproduction parity for the CI pg-lunaris
# service. Builds the same image the GHA workflow
# `.github/workflows/integration.yml` builds via
# `docker/build-push-action@v5`, so an operator can reproduce a failing
# CI run locally with:
#
#   docker compose -f scripts/pg-lunaris/docker-compose.yml up --build
#
# Tear-down (including the ephemeral data volume):
#
#   docker compose -f scripts/pg-lunaris/docker-compose.yml down -v
#
# Env-vars mirror the CI job exactly so a local `PG_URL` of
# `postgres://lunaris:lunaris@localhost:5432/lunaris` exercises the same
# code path as CI. See `docs/ci/postgres-integration.md` (landed in
# Plan 14-04) for the full reproduction recipe.

services:
  pg-lunaris:
    container_name: pg-lunaris
    build:
      context: .
      # Defaults match the Dockerfile ARGs (AGE_VERSION + PGMQ_VERSION).
      # Override locally by exporting AGE_VERSION / PGMQ_VERSION and
      # adding `args:` overrides here — but the CI uses Dockerfile
      # defaults, so do not drift.
    image: pg-lunaris:ci
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: lunaris
      POSTGRES_DB: lunaris
      POSTGRES_USER: lunaris
    volumes:
      # Named ephemeral volume — `docker compose down -v` wipes it
      # cleanly so repeated runs do not accumulate state and the
      # init-extensions.sql hook re-executes on every fresh boot.
      - pg-lunaris-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaris -d lunaris"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-lunaris-data:
