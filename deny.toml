# cargo-deny configuration — Phase 22 ship-to-product license / supply-chain
# vetting for the Lunaris workspace. Run via `cargo deny check` (CI gate
# wired into .github/workflows/ci.yml).
#
# Policy intent:
#   - Lunaris ships Apache-2.0; all transitive deps MUST be permissive-license
#     compatible (Apache-2.0 / MIT / BSD-3-Clause / Unicode-DFS-2016 / ISC /
#     Zlib).
#   - No copyleft (GPL / AGPL / LGPL) — would re-license downstream consumers.
#   - No yanked crates in the dep tree (`bans.deny` with yanked = "deny").
#   - No security advisories with unresolved fixes.

[graph]
# Skip dev-deps and build-deps from the license/ban surface — only
# runtime deps end up in published wheels / crates.
all-features = false
no-default-features = false
exclude-dev = true

[output]
feature-depth = 1

# ───────────────────────── advisories ─────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Block at YANK level — a yanked crate in a release would silently break
# downstream `cargo add lunaris-memory` (the umbrella's published name; the
# bare `lunaris` name on crates.io is an unrelated third-party project).
yanked = "deny"
# Ignore-list is reserved for transitive "unmaintained" advisories where
# the dependent is itself unforked upstream. Every entry MUST cite the
# upstream-blocker and a re-review date so this list doesn't silently
# accumulate.
#
# RATIONALE RE-VERIFIED 2026-08-21 (W2.12). The previous rationale for both
# entries was WRONG: it blamed `candle-core/gemm`, but candle was deleted in
# the v0.6 llama.cpp-only cutover and `gemm` is absent from Cargo.lock
# entirely (`grep -c 'name = "gemm' Cargo.lock` -> 0). Both advisories are
# still live; they just arrive by a different road, and both are now IN THE
# SHIPPED SURFACE, not dev-only. Verified by walking Cargo.lock's reverse
# edges, not by reading the old comment.
#
# NEXT RE-REVIEW: 2026-11-21, or at the next minor release, whichever is
# first. An entry without a re-review date is how this list rots.
ignore = [
    # RUSTSEC-2024-0436 — paste@1.0.15 is unmaintained.
    # Actual reach (Cargo.lock, 2026-08-21):
    #   paste <- tokenizers <- lunaris-ingest <- lunaris-memory / -retrieve
    #                                          <- lunaris-mcp / -server / -hook
    #   paste <- macro_rules_attribute <- tokenizers  (same root)
    # This IS in the shipped surface — `tokenizers` is a normal dependency of
    # lunaris-ingest (Cargo.toml:36), not a dev-dep. Accepted because `paste`
    # is a proc-macro crate with no runtime component and the advisory is
    # "unmaintained", not a vulnerability.
    # Blocker: huggingface/tokenizers still depends on paste 1.0.
    # Re-review: 2026-11-21, or when tokenizers drops paste.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained (not a vulnerability); proc-macro only; transitive via tokenizers <- lunaris-ingest; re-review 2026-11-21" },
    # RUSTSEC-2025-0119 — number_prefix@0.4.0 is unmaintained.
    # Actual reach (Cargo.lock, 2026-08-21):
    #   number_prefix <- indicatif <- lunaris-mcp   (DIRECT normal dep,
    #                                                lunaris-mcp/Cargo.toml:81)
    #   number_prefix <- indicatif <- hf-hub <- lunaris-bench (dev)
    # The old "not in shipped surface (dev-dep only)" claim is FALSE:
    # lunaris-mcp is a shipped binary and depends on indicatif directly for
    # the model stager's stderr progress bar. Accepted because the advisory is
    # "unmaintained", not a vulnerability, and the crate only formats byte
    # counts for a progress bar.
    # Blocker: indicatif still depends on number_prefix; the advisory notes
    # the maintainer has not responded to the unmaintained tag.
    # Re-review: 2026-11-21, or when indicatif drops number_prefix.
    { id = "RUSTSEC-2025-0119", reason = "unmaintained (not a vulnerability); byte-count formatting in a progress bar; transitive via indicatif <- lunaris-mcp (shipped) and <- hf-hub <- lunaris-bench (dev); re-review 2026-11-21" },
]

# ───────────────────────── licenses ─────────────────────────
[licenses]
# Permissive licenses we accept. Apache-2.0 + MIT is the dominant pair in
# the Rust async ecosystem; the rest cover specific common crates.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",          # file-level copyleft; safe for library use.
    "OpenSSL",          # for openssl-sys; isolated to that one transitive dep.
    "CC0-1.0",          # public-domain dedication
    "BSL-1.0",          # Boost — equivalent to MIT for redistribution
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.93
# Per-crate exceptions: only allow these explicit licenses for crates that
# would otherwise be rejected.
exceptions = []

# ───────────────────────── bans ─────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# Explicit deny-list for licenses that re-license downstream consumers.
# This is in [bans] (not [licenses]) so we get a clear "banned crate"
# error rather than a license-mismatch warning.
deny = []
# Tolerate a small number of duplicate-version warnings — the Rust async
# ecosystem regularly drifts on `syn`, `windows-sys`, etc. Skip these
# until they actually appear in a publishable surface.
skip = []
skip-tree = []

# ───────────────────────── sources ─────────────────────────
[sources]
# Only allow crates.io + this workspace's path deps. Git-revision deps
# are rejected — every published `lunaris-*` crate must resolve to a
# crates.io coordinate (path is fine inside the workspace).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Sibling-repo path deps (moondb, moon SDK) are allowed during development
# but the publish gate (`cargo publish --dry-run`) rejects them on its own.
allow-git = []
