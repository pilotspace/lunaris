# lunaris-rerank — `Reranker` trait + `NoopReranker` no-op seam.
#
# v0.4 N-03 cutover: this crate is now a trait-and-noop host (~300 LOC).
# The default cross-encoder backend moved to `lunaris-llamacpp`
# (candle + bge-reranker-v2-m3 FP32). The legacy `BgeRerankerV2M3` (candle)
# and `FastembedReranker` (ORT) backends are deleted along with their
# integration tests.
#
# Build:
#   cargo check -p lunaris-rerank
#   cargo test  -p lunaris-rerank --lib

[package]
name        = "lunaris-rerank"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Reranker trait + NoopReranker seam for Lunaris"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
lunaris-core   = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
