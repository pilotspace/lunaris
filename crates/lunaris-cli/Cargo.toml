[package]
name             = "lunaris-cli"
version          = { workspace = true }
edition          = { workspace = true }
rust-version     = { workspace = true }
license          = { workspace = true }
repository       = { workspace = true }
description      = "Human- and script-facing CLI for a running Lunaris memory store"
# NOT publishable, for the same structural reason as `lunaris-mcp` and
# `lunaris-hook`: this depends on `lunaris-memory-service` (publish = false),
# which carries an optional PATH dependency on `vendor/moon`. cargo strips the
# path on publish and demands a registry version, and the `moon` name on
# crates.io belongs to an unrelated third party — so no version can ever
# satisfy it. Distribution mirrors lunaris-mcp: npx / uvx / GitHub Release
# binaries. See README.md and docs/book/src/mcp/index.md, which already
# document the same caveat honestly for lunaris-mcp.
publish          = false

[[bin]]
name = "lunaris"
path = "src/main.rs"

[dependencies]
# The engine. `llamacpp` is hard-wired exactly as lunaris-mcp and lunaris-hook
# do it, so a plain `cargo build -p lunaris-cli` cannot silently produce the
# Tier-0 NoopEmbedder build (the trap that bites lunaris-server).
lunaris      = { workspace = true, features = ["llamacpp"] }
lunaris-core = { workspace = true }
# THE shared command surface. Every subcommand builds a `MemoryRequest` and
# hands it to `protocol::dispatch` — the identical function contextd runs and
# the mcp proxy falls back to. The CLI must never open storage or plan a recall
# on its own; that is what made three recall surfaces diverge before GA-1.
lunaris-memory-service = { workspace = true }

clap = { workspace = true, features = ["derive", "env"] }
# `fs` is for `lunaris try`'s model staging (streaming a GGUF to disk without
# blocking the runtime); everything else was already here for the socket leg.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

# ── `lunaris try` — zero-config trial path (W0.4) ─────────────────────────────
# Model staging for the trial: the front door cannot ask a stranger to fetch a
# 253 MB GGUF by hand. This is the SECOND copy of the staging logic in the
# workspace (the first is `lunaris-mcp/src/model_stager.rs`, which is
# `pub(crate)` and therefore unreachable from here). W0.7 promotes ONE copy into
# `lunaris-core`; when it lands, `src/stage.rs` deletes and this dep block goes
# with it. `crates/lunaris-cli/tests/stage_contract.rs` pins the two copies to
# the same URL + SHA-256 so they cannot drift in the meantime.
reqwest      = { workspace = true, features = ["stream"] }
sha2         = { workspace = true }
futures-util = "0.3"
# indicatif 0.17 — progress on STDERR. A silent 253 MB download reads as a hang,
# which is the single worst thing a first-run command can do. Same version as
# lunaris-mcp; not a workspace dep because only these two crates draw bars.
indicatif    = "0.17"
dirs         = { workspace = true }

[features]
default = []
# embedded-moon: `lunaris try` brings up an in-process Moon so a stranger needs
# no server, no container and no account. Forwards to the ONE launcher
# definition in lunaris-memory-service (never a private `dep:moon_server`), and
# is NEVER in `default` — the CLAUDE.md invariant exists because the moon server
# crate is a multi-minute compile that would otherwise land in every
# `cargo test --workspace` and CI clippy run. The published GitHub Release /
# npx / uvx artifact is built WITH this feature; a plain
# `cargo build -p lunaris-cli` is not. Guarded by tests/embedded_moon_manifest.rs.
embedded-moon = ["lunaris-memory-service/embedded-moon"]

[dev-dependencies]
lunaris-test-harness = { workspace = true }
tempfile             = "3"
