# lunaris-llm — shared LLM-backend abstraction for Lunaris.
#
# Hosts the dyn-compatible `LlmBackend` trait + `LlmConfig` (env + optional
# TOML file) consumed by `lunaris-extract`, `lunaris-verify`, and the
# turn-end reflect supervisor. Today this crate is scaffold-only: the
# `candle`, `ollama`, and `cloud-api` feature flags are declared so
# downstream forwarding compiles, but the move of CandleGemma3 / Ollama /
# CloudApi impls from the extract/verify crates lands in the *next* commit
# (per the agreed commit order — see `git log --grep lunaris-llm`).
#
# Build matrix (mirrors lunaris-extract):
#   cargo check -p lunaris-llm                                            # noop (no transport features)
#   cargo check -p lunaris-llm --features candle
#   cargo check -p lunaris-llm --features ollama
#   cargo check -p lunaris-llm --features cloud-api
#   cargo check -p lunaris-llm --features candle,ollama,cloud-api
#   cargo check -p lunaris-llm --features candle-quantized                # Q4 GGUF Gemma-3 (QuantizedCandleBackend)
#   cargo check -p lunaris-llm --features candle-quantized,metal          # + Metal device upgrade

[package]
name        = "lunaris-llm"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Pluggable LLM-backend abstraction shared by lunaris-extract and lunaris-verify"
repository.workspace = true
keywords    = ["agent", "memory", "llm"]
categories  = ["asynchronous"]

[package.metadata.docs.rs]
all-features = false
features = ["candle", "ollama", "cloud-api"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `default = []` — like lunaris-verify, this crate ships with no transport
# backends linked unless a consumer (or downstream user) explicitly opts in.
# Each consuming crate forwards exactly the transports it needs. NOTE: do
# NOT add a `default = ["candle"]` here without coordinating with both
# lunaris-extract (default candle) and lunaris-verify (default-OFF) — a
# silent default flip pulls candle into every workspace member.
default      = []
candle       = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:dirs", "dep:parking_lot"]
ollama       = ["dep:reqwest"]
cloud-api    = ["dep:reqwest"]
# Q4 GGUF Gemma-3 backend (`QuantizedCandleBackend`) via candle-transformers'
# `quantized_gemma3::ModelWeights`. Implies `candle` (same optional deps —
# candle-transformers already ships the quantized module, no new dependency
# lines needed). Forwarded by `lunaris-extract/extractor-gguf` -> umbrella
# `lunaris/extractor-gguf`. Mirrors the embedder/reranker
# `embedder-gguf`/`reranker-gguf` naming convention.
candle-quantized = ["candle"]
# Test-double utilities. Never compiled into production binaries.
# Consuming crates add `lunaris-llm = { workspace = true, features = ["faux"] }`
# to their `[dev-dependencies]` to get `FauxBackend`.
faux         = ["dep:parking_lot"]
# Device-upgrade ladder for the quantized backend (mirrors
# `lunaris-rerank-native`'s `metal`/`cuda` features + `device_select.rs`).
# Off by default — Cpu unless one of these is enabled. cuda is
# untested-on-target (same caveat as lunaris-rerank-native's device_select).
metal        = ["candle-quantized", "candle-core/metal", "candle-nn/metal"]
cuda         = ["candle-quantized", "candle-core/cuda", "candle-core/cudnn", "candle-nn/cuda"]

[dependencies]
lunaris-core   = { workspace = true }
async-trait    = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
toml           = { workspace = true }

# candle stack — gated. Mirrors lunaris-extract exactly so workspace-pinned
# 0.10 versions stay aligned across the LLM-using crates.
candle-core         = { workspace = true, optional = true }
candle-nn           = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers          = { workspace = true, optional = true }
dirs                = { workspace = true, optional = true }
# parking_lot::Mutex wraps the candle model handle (forward(&mut self) needs
# &mut). Lock is taken INSIDE spawn_blocking so the CLAUDE.md "never hold
# lock across .await" rule is upheld trivially.
parking_lot         = { workspace = true, optional = true }

# http stack — shared by `ollama` + `cloud-api`.
reqwest        = { workspace = true, optional = true }

# macOS Accelerate BLAS by default when the candle backend is enabled —
# mirror of `lunaris-embed-native`'s target-specific block (see that
# Cargo.toml for the full rationale). `optional = true` keeps these inert
# unless the `candle` feature activates `dep:candle-core`/`dep:candle-nn`;
# the target-scoped declarations then contribute the `accelerate` feature on
# macOS-target builds only. Guarded by
# `candle_quantized::tests::macos_default_build_has_accelerate_blas`.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["accelerate"] }
candle-nn   = { workspace = true, optional = true, features = ["accelerate"] }

# Apple Silicon Metal-by-default (runtime-probed) — mirror of
# `lunaris-embed-native`'s aarch64 block (see that Cargo.toml for the full
# rationale); `optional = true` keeps it inert without the `candle` feature.
# Guarded by
# `candle_quantized::tests::apple_silicon_default_build_selects_metal_at_runtime`.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }
candle-nn   = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
# FauxBackend (cfg(test)) needs parking_lot::Mutex. Listed here so that
# `cargo test -p lunaris-llm --lib` without --features faux still compiles
# the faux::tests module. The `faux` feature activates parking_lot for
# external consumers; this dev-dep covers the internal cfg(test) path.
parking_lot    = { workspace = true }
