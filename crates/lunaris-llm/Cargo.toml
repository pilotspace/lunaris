# lunaris-llm — shared LLM-backend abstraction for Lunaris.
#
# Hosts the dyn-compatible `LlmBackend` trait + `LlmConfig` (env + optional
# TOML file) consumed by `lunaris-extract`, `lunaris-verify`, and the
# turn-end reflect supervisor. Since the llama.cpp-only cutover (2026-07,
# Phase C) the extractor/verifier LLM slots are REMOTE-ONLY: the transports
# here are `ollama` (native /api/chat) and `cloud-api` (Anthropic / OpenAI /
# Gemini / MiniMax / any OpenAI-compatible URL). The in-process candle
# backends were deleted — local inference lives in `lunaris-llamacpp`
# (embedder + reranker only).
#
# Build matrix:
#   cargo check -p lunaris-llm                             # noop (no transport features)
#   cargo check -p lunaris-llm --features ollama
#   cargo check -p lunaris-llm --features cloud-api
#   cargo check -p lunaris-llm --features ollama,cloud-api

[package]
name        = "lunaris-llm"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Pluggable LLM-backend abstraction shared by lunaris-extract and lunaris-verify"
readme       = "README.md"
repository.workspace = true
keywords    = ["agent", "memory", "llm"]
categories  = ["asynchronous"]

[package.metadata.docs.rs]
all-features = false
features = ["ollama", "cloud-api"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `default = []` — this crate ships with no transport backends linked unless
# a consumer (or downstream user) explicitly opts in. Each consuming crate
# forwards exactly the transports it needs.
default      = []
ollama       = ["dep:reqwest"]
cloud-api    = ["dep:reqwest"]
# Test-double utilities. Never compiled into production binaries.
# Consuming crates add `lunaris-llm = { workspace = true, features = ["faux"] }`
# to their `[dev-dependencies]` to get `FauxBackend`.
faux         = ["dep:parking_lot"]

[dependencies]
lunaris-core   = { workspace = true }
async-trait    = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
toml           = { workspace = true }

# `FauxBackend` state is wrapped in parking_lot::Mutex (faux feature only).
parking_lot         = { workspace = true, optional = true }

# http stack — shared by `ollama` + `cloud-api`.
reqwest        = { workspace = true, optional = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
# FauxBackend (cfg(test)) needs parking_lot::Mutex. Listed here so that
# `cargo test -p lunaris-llm --lib` without --features faux still compiles
# the faux::tests module. The `faux` feature activates parking_lot for
# external consumers; this dev-dep covers the internal cfg(test) path.
parking_lot    = { workspace = true }
