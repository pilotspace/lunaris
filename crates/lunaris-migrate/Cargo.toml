[package]
name        = "lunaris-migrate"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "One-way operator exit ramp: copy Lunaris primitives off the SQLite/Postgres backends into Moon before 0.7.0 deletes them"

# NOT publishable, and deliberately so. `lunaris-storage-moon` depends on the
# `moondb` SDK by PATH (`vendor/moon/sdk/rust`), which crates.io rejects, so
# this binary can never be `cargo install`-ed from the registry. It ships as a
# release artifact of the LAST version that still compiles all three backends
# (0.6.x) and is deleted from the workspace together with its sources in 0.7.0.
# See `docs/migration/0.6-to-0.7.md` §"How this tool survives 0.7.0".
publish = false

[dependencies]
lunaris-core             = { workspace = true }
# The three backends this tool bridges. Source: embedded (SQLite) / postgres.
# Destination: moon. All read/write goes through `StoragePort` — no backend
# private API is touched, which is why the tool inherits the Moon connect-time
# multi-shard guard and server-version handshake for free.
lunaris-storage-moon     = { workspace = true }
lunaris-storage-embedded = { workspace = true }
lunaris-storage-postgres = { workspace = true }

anyhow       = { workspace = true }
async-trait  = { workspace = true }
bytes        = { workspace = true }
clap         = { workspace = true }
futures      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
url          = { workspace = true }

[dev-dependencies]
# Ephemeral child-process Moon for the sqlite -> Moon integration proof.
lunaris-test-harness = { path = "../lunaris-test-harness" }
tempfile             = "3"
ulid                 = { workspace = true }

[[bin]]
name = "lunaris-migrate"
path = "src/main.rs"
