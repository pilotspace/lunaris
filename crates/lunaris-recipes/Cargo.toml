# lunaris-recipes — Phase 9 Plan 09-01 composable primitives crate.
#
# Hosts the 4 first-class Lunaris primitives that every vertical wrapper in
# Phases 10 + 11 composes on top of:
#   - MessageStream    (ACT-R recency-weighted message recall)
#   - DocumentCorpus   (RRF-fused Vector + Keyword RAG)    [Wave 2 Plan 09-02]
#   - TemporalQuery    (typestate time-travel combinator)  [Wave 2 Plan 09-04]
#   - WorkingMemory    (scope-prefixed scratchpad + Consolidator promotion)
#                                                          [Wave 2 Plan 09-03]
#
# Dep shape mirrors `crates/lunaris-consolidate/Cargo.toml` (path = "..") for
# internal crates — the workspace root `[workspace.dependencies]` block holds
# only EXTERNAL crates (tokio, serde, thiserror, …), so internal deps MUST use
# explicit path entries, not `{ workspace = true }`.
#
# Feature gates `moon-it` + `pg-it` mirror Phase 4 Plan 04-03 + Phase 5 Plan
# 05-02 `probe_backend` discipline: parity tests under `tests/` SKIP cleanly
# when env URL is unset, so `cargo test -p lunaris-recipes` stays zero-config.

[package]
name        = "lunaris-recipes"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish              = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris = { workspace = true }
lunaris-core = { workspace = true }
lunaris-retrieve = { workspace = true }
lunaris-consolidate = { workspace = true }
lunaris-storage-moon = { workspace = true, optional = true }
lunaris-storage-postgres = { workspace = true, optional = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
parking_lot = { workspace = true }
ulid        = { workspace = true }
# Phase 9.1 Plan 01 Task 3 — StreamExt::next for WorkingMemory::consolidate's
# bounded drain of __lunaris_consolidate__. No new transitive deps (already
# available via lunaris-consolidate + lunaris-core).
futures     = { workspace = true }
# W2-L1 — CodeFeatureCard uses tracing::warn! for lenient branch degradation.
tracing     = { workspace = true }

[dev-dependencies]
anyhow              = { workspace = true }
tokio               = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
lunaris-conformance = { workspace = true }
# Phase 9.1 Plan 01 Task 3 — `tests/working_memory_consolidate.rs` builds
# a `TestConsolidator` fixture that constructs `FactId::from_triple` args
# using `lunaris_extract::EntityId`. Test-only; no production surface impact.
lunaris-extract = { workspace = true }
async-trait         = { workspace = true }
bytes               = { workspace = true }
futures             = { workspace = true }
parking_lot         = { workspace = true }

[features]
default = []
# Integration-test flags — parity tests SKIP cleanly when env URL is unset
# (mirrors Phase 4 Plan 04-03 + Plan 05-02 probe_backend discipline).
moon-it = ["dep:lunaris-storage-moon"]
pg-it   = ["dep:lunaris-storage-postgres"]
