# lunaris-recipes — Phase 9 Plan 09-01 composable primitives crate.
#
# Hosts the 4 first-class Lunaris primitives that every vertical wrapper in
# Phases 10 + 11 composes on top of:
#   - MessageStream    (ACT-R recency-weighted message recall)
#   - DocumentCorpus   (RRF-fused Vector + Keyword RAG)    [Wave 2 Plan 09-02]
#   - TemporalQuery    (typestate time-travel combinator)  [Wave 2 Plan 09-04]
#   - WorkingMemory    (scope-prefixed scratchpad + Consolidator promotion)
#                                                          [Wave 2 Plan 09-03]
#
# Dep shape mirrors `crates/lunaris-consolidate/Cargo.toml` (path = "..") for
# internal crates — the workspace root `[workspace.dependencies]` block holds
# only EXTERNAL crates (tokio, serde, thiserror, …), so internal deps MUST use
# explicit path entries, not `{ workspace = true }`.

[package]
name        = "lunaris-recipes"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish              = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# F21 — DocumentCorpus reads the reserved valid-time key into Episode::t_ref.
chrono              = { workspace = true }
lunaris = { workspace = true }
lunaris-core = { workspace = true }
lunaris-retrieve = { workspace = true }
lunaris-consolidate = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
parking_lot = { workspace = true }
ulid        = { workspace = true }
# Phase 9.1 Plan 01 Task 3 — StreamExt::next for WorkingMemory::consolidate's
# bounded drain of __lunaris_consolidate__. No new transitive deps (already
# available via lunaris-consolidate + lunaris-core).
futures     = { workspace = true }
# W2-L1 — CodeFeatureCard uses tracing::warn! for lenient branch degradation.
tracing     = { workspace = true }

[dev-dependencies]
anyhow              = { workspace = true }
tokio               = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
lunaris-conformance = { workspace = true }
# Phase 9.1 Plan 01 Task 3 — `tests/working_memory_consolidate.rs` builds
# a `TestConsolidator` fixture that constructs `FactId::from_triple` args
# using `lunaris_extract::EntityId`. Test-only; no production surface impact.
lunaris-extract = { workspace = true }
async-trait         = { workspace = true }
bytes               = { workspace = true }
futures             = { workspace = true }
parking_lot         = { workspace = true }

[features]
default = []
# No integration-test features. F36 — this crate carried a `moon-it` feature
# that gated ZERO code. Its three integration files each define their own
# in-file mock `StoragePort` and none reads a backend URL, so there was nothing
# for the feature to switch on; all it did was mark `lunaris-storage-moon`
# `optional`. It did not even save the build: `cargo tree -p lunaris-recipes
# -e normal` shows `lunaris-storage-moon` arriving anyway through `lunaris` and
# `lunaris-retrieve` with the feature OFF.
#
# integration.yml ran `-p lunaris-recipes --features moon-it` in the
# Moon-having job regardless, with a fresh-Moon reset of its own before it, so
# the step name and the flag both promised live coverage this crate cannot
# provide. Both are gone. `cargo test --workspace --all-targets` in ci.yml runs
# these tests, which is the only place they were ever really running.
# (`pg-it` was removed earlier, in 0.7.0, with `lunaris-storage-postgres`.)
