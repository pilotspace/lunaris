# lunaris-ingest — markdown chunker + batched ingest pipeline (chunk → embed → atomic_write).
# Closes INGEST-01..04 of the Phase 2 hot path.
#
#   cargo test -p lunaris-ingest                    # unit + integration tests
#
[package]
name        = "lunaris-ingest"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Atomic ingest pipeline for the Lunaris agent memory engine"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[dependencies]
lunaris-core = { workspace = true }
# Wave 2.5B: lunaris-storage-moon removed — keyspace helpers moved to lunaris-core
async-trait    = { workspace = true }
bytes          = { workspace = true }
pulldown-cmark = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }
chrono         = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
parking_lot    = { workspace = true }
futures        = { workspace = true }
