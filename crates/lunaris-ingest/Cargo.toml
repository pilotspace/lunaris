# lunaris-ingest — markdown chunker + batched ingest pipeline (chunk → embed → atomic_write).
# Closes INGEST-01..04 of the Phase 2 hot path.
#
#   cargo test -p lunaris-ingest                    # unit + integration tests
#
[package]
name        = "lunaris-ingest"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Atomic ingest pipeline for the Lunaris agent memory engine"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris-core = { workspace = true }
# Wave 2.5B: lunaris-storage-moon removed — keyspace helpers moved to lunaris-core
async-trait    = { workspace = true }
bytes          = { workspace = true }
pulldown-cmark = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }
chrono         = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokenizers     = { workspace = true }
unicode-segmentation = { workspace = true }
blake3         = { workspace = true }

# Phase 29 Plan 02: LLM summariser (optional — gated behind llm-summarizer feature).
[dependencies.lunaris-llm]
workspace = true
optional = true

# W3 (moon-v051-perf-exploit): optional dep for the live-Moon embedding
# double-store proof (`tests/c_live_moon_embedding_kv_size.rs`). Mirrors the
# `lunaris-recipes` `moon-it` pattern: `optional = true` + `dep:` feature so
# `cargo test -p lunaris-ingest` (default features) never compiles the Moon
# client at all.
[dependencies.lunaris-storage-moon]
workspace = true
optional = true

[features]
# llm-summarizer: enables LlmSummarizer wrapping Arc<dyn LlmBackend>.
# Default build does NOT require LLM weights.
llm-summarizer = ["lunaris-llm"]
# moon-it: enables tests/c_live_moon_embedding_kv_size.rs against a real Moon
# at MOON_URL (default moon://localhost:7803 for this test — see the file
# header). NOT part of `default`.
moon-it = ["dep:lunaris-storage-moon"]

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
parking_lot    = { workspace = true }
futures        = { workspace = true }
# FauxBackend for llm-summarizer feature tests.
lunaris-llm    = { workspace = true, features = ["faux"] }
# 0.7.0 prerequisite — ephemeral child-process Moon fixtures (see the crate docs
# in crates/lunaris-test-harness) so tests stop opening `memory://` directly.
# Dev-only; the cycle back through `lunaris` runs via dev-deps, which Cargo allows.
lunaris-test-harness = { workspace = true }
