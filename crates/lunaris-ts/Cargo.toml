[package]
name    = "lunaris-ts"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true

[lib]
# napi-rs 3.x requires `cdylib` so Node's `process.dlopen` can load the
# resulting `.node` binary. The `rlib` is kept so `cargo test --lib` still
# compiles against the Rust test harness (`conformance::tests` under the
# `bindings-it` feature live there).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rust surface being bound. `default-features = false` keeps the cdylib's
# feature set explicit — the SDK adds `llamacpp` via its own default
# feature below (Tier-0 builds use `--no-default-features`).
lunaris             = { path = "../lunaris", default-features = false, features = ["ollama"], package = "lunaris-memory" }
lunaris-core        = { path = "../lunaris-core" }
lunaris-rerank        = { path = "../lunaris-rerank", default-features = false }
# llama.cpp-only cutover — `EmbedderConfig.llamacpp()` / `RerankerConfig.
# llamacpp()` construct the GGUF backends directly. Optional: Tier-0 builds
# use `--no-default-features` and get fail-loudly stubs instead.
lunaris-llamacpp      = { path = "../lunaris-llamacpp", optional = true }
lunaris-recipes     = { path = "../lunaris-recipes" }
lunaris-retrieve    = { path = "../lunaris-retrieve", default-features = false }
# Conformance fixtures — only pulled in under the `bindings-it` feature.
lunaris-conformance = { workspace = true, optional = true }
# napi-rs 3.x + NAPI-8 ABI pin (ROADMAP Phase 8 risk-register row 4).
napi                = { workspace = true }
napi-derive         = { workspace = true }
# Upstream Rust deps reused via workspace.
async-trait         = { workspace = true }
chrono              = { workspace = true }
tokio               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
futures             = { workspace = true }
bytes               = { workspace = true }
tracing             = { workspace = true }
thiserror           = { workspace = true }

[build-dependencies]
napi-build          = { workspace = true }

[features]
# `llamacpp` in default: the shipped .node binary embeds the llama.cpp
# runtime (cutover decision — llama.cpp for all devices). Tier-0 builds opt
# out via `napi build --no-default-features`.
default = ["llamacpp"]
# MUST forward "lunaris/llamacpp": the umbrella crate is imported with
# `default-features = false`, and in a standalone `napi build` nothing
# else enables it — `Lunaris::open()` then silently resolves NoopEmbedder
# (zero vectors). Workspace builds mask this via feature unification, so
# only the package-scoped build-graph test catches it (found 2026-07-16).
llamacpp = ["dep:lunaris-llamacpp", "lunaris-llamacpp/llamacpp", "lunaris/llamacpp"]
# Tier-0 remote embedder (`LUNARIS_EMBEDDER_OPENAI_URL` /
# `LUNARIS_EMBEDDER_OLLAMA_URL`). Opt-in, never in `default`: the shipped
# `.node` runs llama.cpp locally. Enable for air-gapped / no-C++-toolchain
# builds (`napi build --no-default-features --features embed-remote`) and
# for the hermetic SDK tests, which point Lunaris at a stub
# OpenAI-compatible `/v1/embeddings` server instead of running inference.
embed-remote = ["lunaris/embed-remote"]
# Plan 08-03 BLOCKER 3+4 resolution — conformance helpers
# (`conformanceFixtureEpisodes`, `scanKvPrefix`) compile only under this
# feature. Production npm packages do NOT enable it. The Plan 08-01
# parity-check walker explicitly excludes any file named `conformance.rs`
# via the explicit three-path enumeration in `codegen_managed_paths`.
#
# Revision iteration 2 (locked in 08-CONTEXT.md): per-driver backend parity
# does not require deterministic clocks or a zero-embedder. The earlier
# `lunaris/bindings-it` + `lunaris-embed/mock-embedder` feature chain is
# dropped; the only capability the conformance helpers need is access to the
# canonical `lunaris_conformance::fixtures::{SEED, EPISODE_COUNT, FixtureCorpus}`
# constants.
bindings-it = ["dep:lunaris-conformance"]

# GPU offload for the llama.cpp runtime — enabled per-target by the npm
# prebuild matrix (Phase D).
metal = ["llamacpp", "lunaris-llamacpp/metal", "lunaris/metal"]
cuda  = ["llamacpp", "lunaris-llamacpp/cuda", "lunaris/cuda"]
vulkan = ["llamacpp", "lunaris-llamacpp/vulkan", "lunaris/vulkan"]

[package.metadata.docs.rs]
# lunaris-ts is a cdylib — docs.rs doesn't build napi-rs extension modules,
# but `cargo doc --no-deps` on the `rlib` side still works.
all-features = false
no-default-features = true
