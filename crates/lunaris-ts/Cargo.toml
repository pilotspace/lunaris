[package]
name    = "lunaris-ts"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true

[lib]
# napi-rs 3.x requires `cdylib` so Node's `process.dlopen` can load the
# resulting `.node` binary. The `rlib` is kept so `cargo test --lib` still
# compiles against the Rust test harness (`conformance::tests` under the
# `bindings-it` feature live there).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rust surface being bound. `default-features = false` opts out of the
# `candle` default on the umbrella crate so the Node cdylib does NOT
# pull the 500 MB candle+tokenizers dep tree or require embedding-gemma
# weights to be present at runtime — same Rule 1 fix Plan 08-02 applied
# to lunaris-py. Production deploys that want the real candle embedder
# enable the feature at `napi build` time.
lunaris             = { path = "../lunaris", default-features = false, features = ["ollama"], package = "lunaris-memory" }
lunaris-core        = { path = "../lunaris-core" }
# v0.4 N-03 — lunaris-embed retired; SDK config rewrites in commit 6 will
# replace fastembed/ollama factories with native()/native_quantized().
lunaris-rerank        = { path = "../lunaris-rerank", default-features = false }
lunaris-embed-native  = { path = "../lunaris-embed-native", default-features = false }
lunaris-rerank-native = { path = "../lunaris-rerank-native", default-features = false }
# v0.4 N-03 — `EmbedderConfig.native(...)` / `RerankerConfig.native(...)` pass
# `candle_core::Device::Cpu` into the native opts structs.
candle-core           = { workspace = true }
lunaris-recipes     = { path = "../lunaris-recipes" }
lunaris-retrieve    = { path = "../lunaris-retrieve", default-features = false }
# Conformance fixtures — only pulled in under the `bindings-it` feature.
lunaris-conformance = { workspace = true, optional = true }
# napi-rs 3.x + NAPI-8 ABI pin (ROADMAP Phase 8 risk-register row 4).
napi                = { workspace = true }
napi-derive         = { workspace = true }
# Upstream Rust deps reused via workspace.
async-trait         = { workspace = true }
chrono              = { workspace = true }
tokio               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
futures             = { workspace = true }
bytes               = { workspace = true }
tracing             = { workspace = true }
thiserror           = { workspace = true }

[build-dependencies]
napi-build          = { workspace = true }

[features]
default = []
# Plan 08-03 BLOCKER 3+4 resolution — conformance helpers
# (`conformanceFixtureEpisodes`, `scanKvPrefix`) compile only under this
# feature. Production npm packages do NOT enable it. The Plan 08-01
# parity-check walker explicitly excludes any file named `conformance.rs`
# via the explicit three-path enumeration in `codegen_managed_paths`.
#
# Revision iteration 2 (locked in 08-CONTEXT.md): per-driver backend parity
# does not require deterministic clocks or a zero-embedder. The earlier
# `lunaris/bindings-it` + `lunaris-embed/mock-embedder` feature chain is
# dropped; the only capability the conformance helpers need is access to the
# canonical `lunaris_conformance::fixtures::{SEED, EPISODE_COUNT, FixtureCorpus}`
# constants.
bindings-it = ["dep:lunaris-conformance"]

# v0.4 N-03 — fastembed/ORT EP forwards retired. The native crates run on
# candle (CPU; future hardware acceleration roadmap covered in O-02).

[package.metadata.docs.rs]
# lunaris-ts is a cdylib — docs.rs doesn't build napi-rs extension modules,
# but `cargo doc --no-deps` on the `rlib` side still works.
all-features = false
no-default-features = true
