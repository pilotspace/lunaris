[package]
name        = "lunaris"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
lunaris-core              = { path = "../lunaris-core" }
lunaris-storage-moon      = { path = "../lunaris-storage-moon" }
lunaris-storage-postgres  = { path = "../lunaris-storage-postgres" }
lunaris-embed             = { path = "../lunaris-embed", default-features = false }
lunaris-ingest            = { path = "../lunaris-ingest" }
lunaris-rerank            = { path = "../lunaris-rerank", default-features = false }
lunaris-retrieve          = { path = "../lunaris-retrieve" }
async-trait    = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }

[features]
default = ["candle"]
# Forwards the embedder + reranker backend choice to lunaris-embed +
# lunaris-rerank. Default = candle (real EmbeddingGemma 768d for embed +
# real bge-reranker-v2-m3 cross-encoder for rerank, both via candle 0.10).
# `ollama` swaps the embedder to the HTTP backend per the Plan 02-01
# latency-budget escape hatch.
candle  = ["lunaris-embed/candle", "lunaris-rerank/candle"]
ollama  = ["lunaris-embed/ollama"]
# Enable to run the integration tests that require a live Moon instance at moon://localhost:6390
moon-it = ["lunaris-storage-moon/moon-it"]
# Enable to run the integration tests that require a live Postgres+pgvector+age+pgmq at postgres://localhost/lunaris
pg-it   = ["lunaris-storage-postgres/pg-it"]
