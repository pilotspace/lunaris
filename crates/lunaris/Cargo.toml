[package]
name        = "lunaris-memory"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "Lunaris agent memory engine — umbrella crate (Apache-2.0 OR MIT)"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]

# Cargo's package-name vs library-name distinction: published as
# `lunaris-memory` on crates.io (the bare `lunaris` name is owned by an
# unrelated v0.1.0 video-editor project), but the import path stays
# `use lunaris::Lunaris;` so adopters' code is unaffected by the package
# rename. Downstream consumers do:
#
#   [dependencies]
#   lunaris-memory = "0.2.1"
#
#   // src/main.rs
#   use lunaris::Lunaris;
[package.metadata.docs.rs]
all-features = false
features = ["fastembed", "candle", "ollama", "cloud-api"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lunaris"

[dependencies]
lunaris-core              = { workspace = true }
lunaris-storage-moon      = { workspace = true }
lunaris-storage-postgres  = { workspace = true }
# Onboarding overhaul (phase 1): always-on so `memory://` works out of the box
# with zero external services. Pure SQLite — no heavy deps to gate behind a
# feature.
lunaris-storage-embedded  = { workspace = true }
lunaris-embed             = { workspace = true }
lunaris-extract           = { workspace = true }
lunaris-ingest            = { workspace = true }
lunaris-rerank            = { workspace = true }
lunaris-retrieve          = { workspace = true }
# Plan 04 — verifier + consolidator crates. default-features = false is
# inherited from workspace.dependencies so the candle / ollama / cloud-api
# stacks stay out of the umbrella build unless the matching feature is
# forwarded (see [features] below — W-5 AUGMENT forwards).
lunaris-verify            = { workspace = true }
lunaris-consolidate       = { workspace = true }
async-trait    = { workspace = true }
bytes          = { workspace = true }
chrono         = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
# Plan 05-05 OPS-08 — JSON-vs-pretty subscriber selector + EnvFilter init in
# `lunaris::logging::init()`. Public helper exported at the umbrella so embedded
# callers (and lunaris-server::main) can opt in with one call.
tracing-subscriber = { workspace = true }
# Plan 05-05 OPS-08 — TTY detection for production-vs-dev log mode selection
# (CONTEXT.md D-26: `!stdout().is_terminal()` is one of the two production
# triggers).
is-terminal    = { workspace = true }
ulid           = { workspace = true }
url            = { workspace = true }
# Phase 14.2 — ephemeral per-handle LRU boost cache.
lru            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }
# Plan 05-04 Task 3 — HeliosScratchpad dual-backend smoke test reuses
# build_md_doc_corpus + the deterministic ChaCha20 generator from lunaris-bench.
# anyhow gives the smoke test the Result<()> shape that the live runners use.
lunaris-bench  = { path = "../lunaris-bench" }
anyhow         = { workspace = true }
# Plan 12-04 HELIOS-06 — SIGKILL chaos test over the Helios tool flow.
# Consumes the chaos_helpers surface (fsck probe + InterruptSite taxonomy).
lunaris-conformance = { path = "../lunaris-conformance" }
# rand drives the deterministic per-iter (kill_site, kill_offset_ns) sampler.
rand           = { workspace = true }

# Plan 12-04 — `nix` (Unix SIGKILL delivery) gated to Unix targets so non-Unix
# builds skip the chaos test cleanly.
[target.'cfg(unix)'.dev-dependencies]
nix            = { workspace = true }

[features]
# Phase 22 default flip (2026-05-13): the umbrella ships ZERO embedder /
# reranker backends by default. `cargo build -p lunaris-memory` no longer
# pulls fastembed / candle / ORT / hf-hub. Operators opt into a real
# backend via `--features fastembed` (recommended), `--features candle`
# (air-gapped), or `--features ollama` (HTTP). Without any of those, the
# `Lunaris::open()` resolver lands on `NoopEmbedder` (zero vectors at
# `LUNARIS_EMBED_DIM`, default 768) with a one-shot `tracing::warn!` so
# operators see that vector recall is dead until they pick a backend or
# pass a custom one via `Lunaris::open_with_embedder`. See
# `docs/migration/0.2-to-0.3-optional-embedder.md` for the full migration
# matrix. The previous Phase 20-02 default (`["fastembed", "candle"]`)
# moved here as `recommended` for one-flag opt-in.
default     = []
# Convenience meta-feature: equivalent to the pre-Phase-22 default. Pulls
# both fastembed and candle so the env-var resolver in `Lunaris::open()`
# can pick either backend at runtime without a rebuild.
recommended = ["fastembed", "candle"]
# Phase 20-02 — forwards the fastembed backend to both lunaris-embed (real
# ONNX EmbeddingGemma 300M via fastembed-rs) and lunaris-rerank (real ONNX
# BGE-Reranker-V2-M3). Pairs with `LUNARIS_EMBEDDER_BACKEND=fastembed` /
# `LUNARIS_RERANKER_BACKEND=fastembed` (the post-flip defaults).
fastembed = ["lunaris-embed/fastembed", "lunaris-rerank/fastembed"]
# Forwards the embedder + reranker + extractor backend choice to lunaris-embed +
# lunaris-rerank + lunaris-extract. `candle` produces real EmbeddingGemma 768d
# for embed + real bge-reranker-v2-m3 cross-encoder for rerank + real Gemma-3
# 4B for extract, all via candle 0.10. After the Phase 20-02 flip, candle is
# kept in the default umbrella for opt-in via `LUNARIS_EMBEDDER_BACKEND=candle`
# / `LUNARIS_RERANKER_BACKEND=candle`. See docs/migration/0.1-to-0.2-fastembed-default.md.
# `ollama` swaps the embedder + extractor to HTTP backends per the Plan 02-01
# latency-budget escape hatch.
# `cloud-api` (Plan 03-03) gates the lunaris-extract Anthropic / OpenAI / Gemini
# provider-mux backend.
# W-5 — AUGMENT (never replace) prior feature forwards with lunaris-verify
# forwards for Plan 04. lunaris-consolidate has no backend feature flags per
# D-15 (no LLM backends; community summaries reuse Phase 3 Extractor), so it
# contributes nothing to these forwards.
candle    = ["lunaris-embed/candle", "lunaris-rerank/candle", "lunaris-extract/candle", "lunaris-verify/candle"]
ollama    = ["lunaris-embed/ollama", "lunaris-extract/ollama", "lunaris-verify/ollama"]
cloud-api = ["lunaris-extract/cloud-api", "lunaris-verify/cloud-api"]
# RFC 0006 — laptop-floor verifier (Gemma-3 270M) + legacy 27B opt-in.
# Forwards through to lunaris-verify so umbrella callers can enable either
# tier without depending on lunaris-verify directly.
verify-small = ["lunaris-verify/verify-small"]
verify-large = ["lunaris-verify/verify-large"]
# Plan 20-03 Task 2 — air-gapped operator escape hatch. Produces a build with
# ZERO fastembed / ort / hf-hub in the transitive dep tree, so operators on
# isolated networks (no HF Hub reachability, no ORT prebuilt download) can
# ship a lunaris binary that runs entirely on candle 0.10 + manually-staged
# model weights. Forwards the candle backend on embed + rerank + extract +
# verify (same set as `candle` above — kept as a distinct feature so the name
# documents intent at build sites: `--features candle-only` is operator-facing
# air-gap signalling, `--features candle` is the default umbrella).
# Operators MUST pre-populate `~/.cache/lunaris/models/{embedding-gemma-300m,
# bge-reranker-v2-m3,...}` before first `Lunaris::open()` — see
# docs/migration/0.1-to-0.2-fastembed-default.md §3 "Opt-out paths".
# Verification (normal/build edges only — dev-deps are bench/test-only and
# don't ship in the binary): `cargo tree -p lunaris --no-default-features
# --features candle-only --edges normal | grep -cE "fastembed|ort|hf-hub"`
# MUST return 0. NOTE: the default-edges tree shows `hf-hub` once via
# `lunaris-bench` dev-deps — that's bench scaffolding, not a binary leak.
candle-only = [
    "lunaris-embed/candle",
    "lunaris-rerank/candle",
    "lunaris-extract/candle",
    "lunaris-verify/candle",
]
# Enable to run the integration tests that require a live Moon instance at moon://localhost:6390
moon-it = ["lunaris-storage-moon/moon-it"]
# Enable to run the integration tests that require a live Postgres+pgvector+age+pgmq at postgres://localhost/lunaris
pg-it   = ["lunaris-storage-postgres/pg-it"]
