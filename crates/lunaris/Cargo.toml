[package]
name        = "lunaris-memory"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "Lunaris agent memory engine — umbrella crate (Apache-2.0)"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]

# Cargo's package-name vs library-name distinction: published as
# `lunaris-memory` on crates.io (the bare `lunaris` name is owned by an
# unrelated v0.1.0 video-editor project), but the import path stays
# `use lunaris::Lunaris;` so adopters' code is unaffected by the package
# rename. Downstream consumers do:
#
#   [dependencies]
#   lunaris-memory = "0.2.1"
#
#   // src/main.rs
#   use lunaris::Lunaris;
[package.metadata.docs.rs]
all-features = false
features = ["candle", "ollama", "cloud-api", "embed-remote", "embedder-gguf", "reranker-gguf"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lunaris"

[dependencies]
lunaris-core              = { workspace = true }
lunaris-storage-moon      = { workspace = true }
lunaris-storage-postgres  = { workspace = true }
# Onboarding overhaul (phase 1): always-on so `memory://` works out of the box
# with zero external services. Pure SQLite — no heavy deps to gate behind a
# feature.
lunaris-storage-embedded  = { workspace = true }
# v0.4 N-03 cutover — native candle embedder + reranker are the supported
# defaults. Always built (no feature gate): the umbrella's `Lunaris::open()`
# constructs `NativeEmbedder` + `NativeReranker` and falls back to the
# always-available `NoopEmbedder` / `NoopReranker` from `lunaris-core` /
# `lunaris-rerank` on cache miss. Operators opt into the Ollama HTTP escape
# hatch via the `embed-remote` feature below.
lunaris-embed-native      = { workspace = true }
lunaris-embed-remote      = { workspace = true, optional = true }
lunaris-extract           = { workspace = true }
lunaris-ingest            = { workspace = true }
lunaris-rerank            = { workspace = true }
lunaris-rerank-native     = { workspace = true }
lunaris-retrieve          = { workspace = true }
# Plan 04 — verifier + consolidator crates. default-features = false is
# inherited from workspace.dependencies so the candle / ollama / cloud-api
# stacks stay out of the umbrella build unless the matching feature is
# forwarded (see [features] below — W-5 AUGMENT forwards).
lunaris-verify            = { workspace = true }
lunaris-consolidate       = { workspace = true }
# v0.4 N-03 — `resolve_embedder()` / `resolve_reranker()` construct
# `lunaris_embed_native::NativeEmbedderOpts` and
# `lunaris_rerank_native::NativeRerankerOpts` which carry a `candle_core::Device`
# field. The native crates already pull candle transitively; this direct
# entry exposes the `Device::Cpu` constructor at the umbrella so the resolver
# does not need a separate re-export shim.
candle-core    = { workspace = true }
async-trait    = { workspace = true }
bytes          = { workspace = true }
chrono         = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
# Plan 05-05 OPS-08 — JSON-vs-pretty subscriber selector + EnvFilter init in
# `lunaris::logging::init()`. Public helper exported at the umbrella so embedded
# callers (and lunaris-server::main) can opt in with one call.
tracing-subscriber = { workspace = true }
# Plan 05-05 OPS-08 — TTY detection for production-vs-dev log mode selection
# (CONTEXT.md D-26: `!stdout().is_terminal()` is one of the two production
# triggers).
is-terminal    = { workspace = true }
ulid           = { workspace = true }
url            = { workspace = true }
# v0.4 N-03 — used by `resolve_embedder()` / `resolve_reranker()` to resolve
# `~/.cache/lunaris/models/{granite-embedding-311m-multilingual-r2,bge-reranker-v2-m3}/`
# as the canonical default load location for native model artifacts. Operator
# overrides via `LUNARIS_EMBEDDER_DIR` / `LUNARIS_RERANKER_DIR` bypass `dirs`.
dirs           = { workspace = true }
# Phase 14.2 — ephemeral per-handle LRU boost cache.
lru            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }
# Plan 05-04 Task 3 — HeliosScratchpad dual-backend smoke test reuses
# build_md_doc_corpus + the deterministic ChaCha20 generator from lunaris-bench.
# anyhow gives the smoke test the Result<()> shape that the live runners use.
lunaris-bench  = { path = "../lunaris-bench" }
anyhow         = { workspace = true }
# Plan 12-04 HELIOS-06 — SIGKILL chaos test over the Helios tool flow.
# Consumes the chaos_helpers surface (fsck probe + InterruptSite taxonomy).
lunaris-conformance = { path = "../lunaris-conformance" }
# rand drives the deterministic per-iter (kill_site, kill_offset_ns) sampler.
rand           = { workspace = true }

# Plan 12-04 — `nix` (Unix SIGKILL delivery) gated to Unix targets so non-Unix
# builds skip the chaos test cleanly.
[target.'cfg(unix)'.dev-dependencies]
nix            = { workspace = true }

[features]
# v0.4 N-03 cutover (2026-05-14): the umbrella now ships `NativeEmbedder` +
# `NativeReranker` (candle + granite-r2 + bge-reranker-v2-m3) as the supported
# default. No env-var backend swap. The retired pre-v0.4 features
# (`fastembed`, `ollama`, `candle-only`, `recommended`) are gone — operators
# who relied on them must follow `docs/migration/0.3-to-0.4-native-default.md`.
#
# The `candle` / `cloud-api` features below ONLY gate the **extractor +
# verifier** LLM backends (Gemma-3 4B / 270M / 27B + Anthropic/OpenAI/Gemini
# provider mux) — the embedder + reranker no longer depend on `candle` as a
# feature toggle (it's a permanent runtime dep on the native crates).
default     = []
# v0.4 N-03 — feature-gated Ollama HTTP escape hatch. Off by default. When
# set, `resolve_embedder()` honours `LUNARIS_EMBEDDER_OLLAMA_URL` and
# constructs `lunaris_embed_remote::OllamaEmbedder` instead of the native
# default. NOT the supported path; documented as "operator escape hatch."
embed-remote = ["dep:lunaris-embed-remote"]
# v0.4 N-03 — GGUF Q4_K_M quantized variants of the native embedder +
# reranker. Forwards to the `embedder-gguf` / `reranker-gguf` flags on the
# respective native crates. When set, `LUNARIS_EMBEDDER_GGUF` /
# `LUNARIS_RERANKER_GGUF` env-var overrides activate `NativeQuantizedEmbedder`
# / `NativeQuantizedReranker`. Without this flag the env vars are ignored.
embedder-gguf = ["lunaris-embed-native/embedder-gguf"]
reranker-gguf = ["lunaris-rerank-native/reranker-gguf"]
# Extractor + verifier LLM backends. `candle` produces real Gemma-3 4B for
# extract + Gemma-3 27B for verify (legacy); `cloud-api` enables the
# provider-mux backend; `verify-small` / `verify-large` pick the verifier
# tier per RFC 0006.
candle    = ["lunaris-extract/candle", "lunaris-verify/candle"]
cloud-api = ["lunaris-extract/cloud-api", "lunaris-verify/cloud-api"]
ollama    = ["lunaris-extract/ollama", "lunaris-verify/ollama"]
verify-small = ["lunaris-verify/verify-small"]
verify-large = ["lunaris-verify/verify-large"]
# Enable to run the integration tests that require a live Moon instance at moon://localhost:6380
moon-it = ["lunaris-storage-moon/moon-it"]
# Enable to run the integration tests that require a live Postgres+pgvector+age+pgmq at postgres://localhost/lunaris
pg-it   = ["lunaris-storage-postgres/pg-it"]
