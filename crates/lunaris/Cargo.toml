[package]
name        = "lunaris-memory"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "Lunaris agent memory engine — umbrella crate (Apache-2.0)"
repository.workspace = true
readme      = "README.md"
# `bi-temporal` is KEPT (reviewed W2.10, 2026-08-21) — it is accurate at the
# storage-model level, which is what a crates.io keyword denotes:
# `BiTemporal { valid, sys }` is a required field on every primitive, forget
# and supersession close intervals instead of destroying rows, and the
# temporal cut pushes into the substrate on the search and graph lanes
# (`FT.SEARCH AS_OF`, `GRAPH.QUERY VALID_AT`).
# What it does NOT mean: historical KV reads. `HISTORICAL_KV_READS = false`
# (crates/lunaris-storage-moon/src/as_of.rs) and an `as_of` older than the
# 1-hour AS_OF_LIVE_WINDOW_MS is refused as `NotSupported` -> HTTP 501,
# pinned by crates/lunaris-conformance/tests/run_as_of_moon_gap.rs.
# Prose MUST carry that scope; the keyword alone must never be the whole
# claim. If historical KV reads are ever the headline, wire Moon's
# TemporalKvIndex first, do not widen the wording.
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]

# Cargo's package-name vs library-name distinction: published as
# `lunaris-memory` on crates.io (the bare `lunaris` name is owned by an
# unrelated v0.1.0 video-editor project), but the import path stays
# `use lunaris::Lunaris;` so adopters' code is unaffected by the package
# rename. Downstream consumers do:
#
#   [dependencies]
#   lunaris-memory = "0.2.1"
#
#   // src/main.rs
#   use lunaris::Lunaris;
[package.metadata.docs.rs]
all-features = false
features = ["ollama", "cloud-api", "embed-remote"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lunaris"

[dependencies]
lunaris-core              = { workspace = true }
# 0.7.0 is Moon-only: `lunaris-storage-postgres` and
# `lunaris-storage-embedded` were deleted, and with them the `postgres://`,
# `sqlite:///path` and `memory://` URL schemes. See docs/migration/0.6-to-0.7.md.
lunaris-storage-moon      = { workspace = true }
lunaris-embed-remote      = { workspace = true, optional = true }
lunaris-extract           = { workspace = true }
lunaris-ingest            = { workspace = true }
lunaris-rerank            = { workspace = true }
# llama.cpp-only cutover — THE inference runtime: GGUF embedder + reranker
# served by an in-process llama.cpp runtime (one warm context per model on a
# worker thread). In `default`; opt out via `default-features = false` for
# the Tier-0 no-C++-toolchain build (Noop or remote embedder).
lunaris-llamacpp          = { workspace = true, optional = true }
lunaris-retrieve          = { workspace = true }
# Plan 04 — verifier + consolidator crates. default-features = false is
# inherited from workspace.dependencies so the candle / ollama / cloud-api
# stacks stay out of the umbrella build unless the matching feature is
# forwarded (see [features] below — W-5 AUGMENT forwards).
lunaris-verify            = { workspace = true }
lunaris-consolidate       = { workspace = true }
async-trait    = { workspace = true }
bytes          = { workspace = true }
chrono         = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
# Plan 05-05 OPS-08 — JSON-vs-pretty subscriber selector + EnvFilter init in
# `lunaris::logging::init()`. Public helper exported at the umbrella so embedded
# callers (and lunaris-server::main) can opt in with one call.
tracing-subscriber = { workspace = true }
# Plan 05-05 OPS-08 — TTY detection for production-vs-dev log mode selection
# (CONTEXT.md D-26: `!stdout().is_terminal()` is one of the two production
# triggers).
is-terminal    = { workspace = true }
ulid           = { workspace = true }
url            = { workspace = true }
# Used to resolve `~/.lunaris/models/` (staged GGUFs) and the legacy
# `~/.cache/lunaris/models/` tokenizer location for the BPE token counter.
# Operator overrides via LUNARIS_*_GGUF / LUNARIS_EMBEDDER_DIR bypass `dirs`.
dirs           = { workspace = true }
# Phase 14.2 — ephemeral per-handle LRU boost cache.
lru            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
parking_lot    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ulid           = { workspace = true }
# Plan 05-04 Task 3 — HeliosScratchpad dual-backend smoke test reuses
# build_md_doc_corpus + the deterministic ChaCha20 generator from lunaris-bench.
# anyhow gives the smoke test the Result<()> shape that the live runners use.
lunaris-bench  = { path = "../lunaris-bench" }
anyhow         = { workspace = true }
# Plan 12-04 HELIOS-06 — SIGKILL chaos test over the Helios tool flow.
# Consumes the chaos_helpers surface (fsck probe + InterruptSite taxonomy).
lunaris-conformance = { path = "../lunaris-conformance" }
# rand drives the deterministic per-iter (kill_site, kill_offset_ns) sampler.
rand           = { workspace = true }
# 0.7.0 prerequisite — ephemeral child-process Moon fixtures, so tests can stop
# opening `memory://` before the embedded backend is deleted. This closes a
# dev-dependency cycle (lunaris-test-harness depends on this crate); Cargo
# permits that, and rejects cycles only through NORMAL dependencies.
lunaris-test-harness = { workspace = true }

# Plan 12-04 — `nix` (Unix SIGKILL delivery) gated to Unix targets so non-Unix
# builds skip the chaos test cleanly.
[target.'cfg(unix)'.dev-dependencies]
nix            = { workspace = true }

[features]
# llama.cpp-only cutover Phase C (2026-07-10): llama.cpp is THE inference
# runtime (GGUF Q4_K_M embedder + Q5_K_M reranker), gated by the Phase B
# quality run — LongMemEval-S N=50 SUBSAMPLE J=96.0% / recall@10=98.0% vs
# candle baseline 94.0%/96.0% (same subsample) at ~4x less wall. The N=50
# prefix is an easy, mostly single-session-factual head of the dataset —
# "a sampling artifact, not the real number"
# (docs/benchmarks/v0.7-longmemeval-jscore-validation.md). The relative
# comparison stands; the absolutes are NOT a Lunaris quality claim.
# C3 deleted the candle native
# embedder/reranker crates; the extractor/verifier LLM slots are REMOTE-ONLY
# (C2c). Tier-0 (no local inference): `default-features = false` [+
# `embed-remote`].
default     = ["llamacpp"]
# Remote HTTP embedder backends (`LUNARIS_EMBEDDER_OPENAI_URL` /
# `LUNARIS_EMBEDDER_OLLAMA_URL`). The Tier-0 / air-gap path — no C++
# toolchain, no local weights.
embed-remote = ["dep:lunaris-embed-remote"]
# GPU offload for the llama.cpp runtime — enable the feature matching the
# build device (cutover decision 4: CPU default; per-target build-time GPU).
# Device selection stays a runtime probe; LUNARIS_DEVICE=cpu forces CPU on a
# GPU-enabled build.
metal          = ["llamacpp", "lunaris-llamacpp/metal"]
cuda           = ["llamacpp", "lunaris-llamacpp/cuda"]
vulkan         = ["llamacpp", "lunaris-llamacpp/vulkan"]
# Extractor + verifier LLM backends — REMOTE-ONLY since the llama.cpp
# cutover (Phase C2c deleted the in-process candle Gemma-3 backends).
# `cloud-api` enables the provider-mux backend (Anthropic / OpenAI / Gemini /
# MiniMax / OpenAI-compatible URL); `ollama` enables the native /api/chat
# transport.
cloud-api = ["lunaris-extract/cloud-api", "lunaris-verify/cloud-api"]
ollama    = ["lunaris-extract/ollama", "lunaris-verify/ollama"]
# THE inference runtime (in `default`): GGUF embedder + reranker via
# in-process llama.cpp. `resolve_embedder()` / `resolve_reranker()` resolve
# the artifact from `LUNARIS_EMBEDDER_GGUF` / `LUNARIS_RERANKER_GGUF`, else
# the `~/.lunaris/models/` staged defaults, falling through to the
# remote/Noop chain on missing artifacts.
llamacpp = ["dep:lunaris-llamacpp", "lunaris-llamacpp/llamacpp"]
# Enable to run the integration tests that require a live Moon instance at moon://localhost:6380
moon-it = ["lunaris-storage-moon/moon-it"]
# `pg-it` was removed in 0.7.0 with `lunaris-storage-postgres`.
