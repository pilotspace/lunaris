# lunaris-rerank-native — v0.4 native candle XLM-RoBERTa cross-encoder reranker.
#
# Milestone v0.4 — single-backend native reranker, mirroring the
# `lunaris-embed-native` pattern (N-01). This crate hosts a *new* reranker
# backend built directly on `candle-core` + `candle-nn` + the upstream
# `candle_transformers::models::xlm_roberta::XLMRobertaForSequenceClassification`,
# purpose-built for `BAAI/bge-reranker-v2-m3` (Apache-2.0, XLM-RoBERTa
# cross-encoder, 1024-d hidden, num_labels=1, sigmoid output ∈ [0, 1]).
#
# Coexists with `lunaris-rerank` during the transition; the v0.4 N-03 cutover
# will flip downstream callers to `NativeReranker`. Until then both compile
# side-by-side (the `Reranker` trait + `RerankCandidate` type are imported
# read-only from `lunaris-rerank`).
#
# Build matrix:
#   cargo check  -p lunaris-rerank-native
#   cargo test   -p lunaris-rerank-native --lib
#   cargo test   -p lunaris-rerank-native --features reranker-it --release \
#                --test numerical_equivalence

[package]
name         = "lunaris-rerank-native"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "Native candle-rs XLM-RoBERTa FP16 cross-encoder for BAAI/bge-reranker-v2-m3"

[dependencies]
lunaris-core        = { workspace = true }
# Trait + RerankCandidate live in lunaris-rerank; we import them read-only so
# `NativeReranker` plugs into the existing operator pipeline without a parallel
# trait hierarchy. `default-features = false` keeps the heavy fastembed/ort
# transitive surface out of the native crate's dep graph — only the trait
# + DTO + NoopReranker fallback compile through.
lunaris-rerank      = { workspace = true }
candle-core         = { workspace = true }
candle-nn           = { workspace = true }
candle-transformers = { workspace = true }
tokenizers          = { workspace = true }
tokio               = { workspace = true }
parking_lot         = { workspace = true }
thiserror           = { workspace = true }
anyhow              = { workspace = true }
tracing             = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
async-trait         = { workspace = true }
# NFC normalization on (query, doc) inputs — mirrors the embedder side's
# normalization contract so a cross-encoder pair encoded over NFD-form input
# (iOS/macOS clipboards routinely emit NFD) produces the same logits as the
# NFC-form input. Pinned to major version 0 (workspace policy: no new
# transitive vector/BM25 libs — this is unicode-only).
unicode-normalization = "0"

[dev-dependencies]
tokio               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
# Used by `tests/quantized_equivalence.rs` to SHA-256-verify the GGUF payload
# against the `BGE_RERANKER_GGUF_Q4_SHA256` pin before running the drift gate.
# Workspace dep — no new transitive surface.
sha2                = { workspace = true }

[features]
default      = []
# Gates the real-weights integration test under
# `tests/numerical_equivalence.rs`. Mirrors the convention in `lunaris-rerank`
# (`rerank-it`) and `lunaris-embed-native` (`embedder-it`).
reranker-it  = []
# Gates the Q4_K_M / GGUF quantized reranker (`NativeQuantizedReranker`) +
# `quantized_xlmr` module. Compile-time opt-in keeps the default crate
# surface unchanged for callers that only want the FP32 path. Only adds
# `candle-core::quantized::*` to the symbol surface — no new dependency
# lines required. Mirrors `lunaris-embed-native`'s `embedder-gguf`.
reranker-gguf = []

# ---------------------------------------------------------------------------
# O-01 hardware-acceleration backend features (v0.4 milestone)
# Mirrors `lunaris-embed-native`'s feature surface — see that crate's
# Cargo.toml for the full rationale.
# ---------------------------------------------------------------------------
cpu-accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cpu-mkl        = ["candle-core/mkl", "candle-nn/mkl"]
metal          = ["candle-core/metal", "candle-nn/metal"]
# **Untested on the O-01 author's host (macOS / Apple Silicon).** Verified
# in O-03's self-hosted CUDA runner gate.
cuda           = ["candle-core/cuda", "candle-core/cudnn", "candle-nn/cuda"]
cuda-fa2       = ["cuda", "candle-transformers/flash-attn"]
