[package]
name             = "lunaris-hook"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish          = true

description = "Lunaris hook adapter — proactive capture of Claude Code lifecycle events into agent memory"
readme      = "README.md"
keywords    = ["hook", "claude-code", "agent", "memory", "lunaris"]
categories  = ["command-line-utilities"]

[[bin]]
name = "lunaris-hook"
path = "src/main.rs"

[[bin]]
name = "lunaris-contextd"
path = "src/contextd.rs"

[dependencies]
# Lunaris engine — llama.cpp GGUF embedder+reranker (llama.cpp-only cutover,
# Phase C). The hook hot-path is content-only; embedding is deferred to first
# recall (HOOK-06 latency budget: p50 <= 50ms) — the GGUF loads lazily.
lunaris      = { workspace = true, features = ["llamacpp"] }
lunaris-core = { workspace = true }
lunaris-ingest = { workspace = true }
lunaris-retrieve = { workspace = true }
# Shared engine-op handlers — contextd's Memory(..) dispatch calls the SAME
# functions the lunaris-mcp direct-open fallback uses (single source of truth).
lunaris-memory-service = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Async runtime — current-thread only (CONTEXT.md decision; matches ScopedLunaris::ingest signature)
tokio = { workspace = true }

# Serde + errors
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
bytes      = { workspace = true }
futures    = { workspace = true }

# Observability — logs to stderr only (NEVER stdout)
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Scope derivation (shared with lunaris-mcp via lunaris-core::scope_resolver)
blake3 = { workspace = true }
dirs   = { workspace = true }

# git_anchor.rs — TTL cache lock (UNSAFE_POLICY: parking_lot over std::sync::*Lock)
parking_lot = { workspace = true }

# HOOK-05 — hex encoding of blake3 dedupe keys
hex = { workspace = true }

# t_ref parsing
chrono = { workspace = true }
ulid   = { workspace = true }

# HOOK-03 — path glob deny list for FilterPolicy
globset = { workspace = true }

# HOOK-04 — secret scrubber (built-in patterns + TOML overlay)
regex = { workspace = true }
toml  = { workspace = true }

# Inference watchdog (watchdog.rs) — Embedder/Reranker impls need the same
# #[async_trait] desugaring the traits are declared with.
async-trait = { workspace = true }

[features]
# embedded-moon: lunaris-contextd bundles an in-process Moon server (ONE
# unified processor) and advertises it via ~/.lunaris/contextd-moon.url.
# Forwards to the shared launcher in lunaris-memory-service. NEVER in
# default — the workspace build / CI clippy must not compile the moon
# server (CLAUDE.md invariant, mirrors lunaris-mcp).
embedded-moon = ["lunaris-memory-service/embedded-moon"]

[dev-dependencies]
tempfile                 = "3"
tokio                    = { workspace = true, features = ["process", "time", "io-util"] }
serde_json               = { workspace = true }
lunaris-core             = { workspace = true }
# hook-recall-graph-hybrid — recording-port shape pin + graph-ON fact seeding
async-trait              = { workspace = true }
lunaris-extract          = { workspace = true }
# HOOK-05 idempotency integration test
lunaris-storage-embedded = { workspace = true }
sqlx                     = { workspace = true }
