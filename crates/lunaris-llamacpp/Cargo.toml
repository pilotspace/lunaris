# lunaris-llamacpp — THE Lunaris inference runtime (llama.cpp-only cutover,
# Phase C; ADR 2026-07-10).
#
# `LlamaCppEmbedder` (granite-r2 Q4_K_M GGUF) + `LlamaCppReranker`
# (bge-reranker-v2-m3 Q5_K_M GGUF) behind the `llamacpp` feature, which the
# umbrella crate enables BY DEFAULT since C1. With the feature OFF this
# crate compiles as an empty shell — no C++ toolchain, no llama.cpp build —
# which is the Tier-0 (no-inference) build path.
#
# Why this crate exists at all: the §4b profiling matrix
# (docs/design/quantized-inference-extractor-reranker.md §4b-RESULTS)
# measured candle ~5x below llama.cpp's Metal ceiling for the embedder and
# found candle's quantized CPU matmuls bypass BLAS entirely; see
# docs/decisions/2026-07-10-llamacpp-inference-runtime.md for the full ADR
# (a deliberate PARTIAL reversal of the v0.4 N-03 candle-only cutover —
# in-process FFI, so the no-external-inference-process property holds).
#
# Build:
#   cargo check -p lunaris-llamacpp                        # empty shell, ~0s
#   cargo test  -p lunaris-llamacpp --features llamacpp    # builds llama.cpp (cmake + clang)

[package]
name         = "lunaris-llamacpp"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "In-process llama.cpp inference runtime for Lunaris (embedder + reranker)"
readme       = "README.md"

[dependencies]
lunaris-core = { workspace = true }
# Reranker output contract (`Reranker` trait + `RerankCandidate`) — light
# crate (trait + Noop impl), needed unconditionally so the trait impl
# compiles with the feature on; the feature-off shell doesn't reference it
# but the dep is cheap.
lunaris-rerank = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }

# The entire llama.cpp surface hangs off this optional dep. Exact-version
# pin: llama-cpp-2 tracks llama.cpp upstream aggressively; bump deliberately
# (same policy as the vendored Moon SHA).
llama-cpp-2 = { version = "=0.1.151", optional = true }
# The exact pin above does NOT constrain the sys sibling: llama-cpp-2 0.1.151
# declares `llama-cpp-sys-2 = "^0.1.151"` (verified against the crates.io API),
# so a resolve WITHOUT our committed lockfile takes the newest 0.1.x — 0.1.154
# today. Upstream ships the two in lockstep and only tests the matched pair, so
# wrapper .151 against sys .154 is a combination nobody validated. Our lockfile
# hid this: `cargo add lunaris-memory` resolves fresh and does not get it.
#
# Declared here purely to pin the transitive version. Nothing in this crate
# calls it directly, and it must stay optional + feature-tied so a
# `default-features = false` Tier-0 build still pulls no C++ toolchain.
llama-cpp-sys-2 = { version = "=0.1.151", optional = true }

[features]
default  = []
llamacpp = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
# GPU offload backends — enable the one matching the build device (cutover
# decision 4: CPU default, per-target build-time GPU). All compose with
# `llamacpp`; device selection stays a runtime probe + LUNARIS_DEVICE.
metal    = ["llamacpp", "llama-cpp-2/metal"]
cuda     = ["llamacpp", "llama-cpp-2/cuda"]
vulkan   = ["llamacpp", "llama-cpp-2/vulkan"]

[dev-dependencies]
# rerank smoke test constructs RerankCandidate { metadata: Value::Null }.
serde_json = { workspace = true }
