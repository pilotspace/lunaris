[package]
name             = "lunaris-memory-service"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish          = false

description = "Lunaris memory-engine tool handlers — transport-neutral, shared by lunaris-mcp (proxy + fallback) and lunaris-contextd (warm engine)"

[dependencies]
# Engine + core types. Transport-NEUTRAL: no rmcp here (the mcp boundary keeps
# the ToolError->rmcp::ErrorData conversion). Model staging is a CALLER concern.
lunaris          = { workspace = true, features = ["llamacpp"] }
lunaris-core     = { workspace = true }
lunaris-retrieve = { workspace = true }

tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

# scratchpad_consolidate + handover bound the ACT-R drain with a hard wall-clock
# timeout (tokio::time::timeout). rt/macros stay dev-only (tests).
tokio = { workspace = true, features = ["time"] }

# JSON Schema derives on the Params/Response DTOs (rmcp resolves these by crate
# name via the #[tool] macro in lunaris-mcp; pinned to match rmcp 1.7's schemars).
schemars = { version = "1.0", features = ["chrono04"] }

# DTO field parsing: RFC-3339 t_ref (ingest/record) + ULID (forget).
chrono = { workspace = true }
ulid   = { workspace = true }

# Optional: in-process Moon server for the `embedded-moon` feature (promoted
# here from lunaris-mcp so lunaris-contextd shares ONE launcher definition).
# Aliased as moon_server to avoid colliding with the workspace moondb→moon alias.
# The path dep (optional, feature-gated) would break `cargo publish`; this
# crate is publish = false so that is moot here.
moon_server = { path = "../../vendor/moon", package = "moon", default-features = false, features = ["runtime-tokio", "graph", "text-index"], optional = true }
# parking_lot::Mutex used by EmbeddedMoonGuard (embedded-moon feature).
parking_lot = { workspace = true, optional = true }
anyhow      = { workspace = true, optional = true }
dirs        = { workspace = true, optional = true }
# clap::Parser in scope for ServerConfig::parse_from([]) — the clap-defaults
# footgun workaround documented on launch_embedded_moon.
clap        = { workspace = true, features = ["derive"], optional = true }

[features]
# embedded-moon: bundle an in-process Moon server. NEVER in default — the
# workspace build / CI clippy must not compile the moon server (CLAUDE.md
# invariant, mirrors lunaris-mcp). Adds the tokio surface the launcher needs
# (TcpListener/TcpStream readiness probe + spawn).
embedded-moon = [
    "dep:moon_server",
    "dep:parking_lot",
    "dep:anyhow",
    "dep:dirs",
    "dep:clap",
    "tokio/net",
    "tokio/io-util",
    "tokio/rt",
]

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
lunaris-core = { workspace = true }
lunaris-consolidate = { workspace = true }
futures      = { workspace = true }
# status.rs test opens a real sqlite:// file to assert non-native-queue behaviour.
tempfile     = "3"
