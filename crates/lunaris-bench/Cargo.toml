[package]
name        = "lunaris-bench"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish     = false

# Plan 02-04 — Phase 2 latency budget enforcement.
# Bench-only crate: NO production code lives here. The library surface
# (`corpus.rs`, `fixtures.rs`) exists so the Criterion benches in `benches/`
# AND the budget-assertion test in `tests/` can share the deterministic
# 1M-fact corpus generator and the 12 KB markdown fixture.

[dependencies]
lunaris = { workspace = true, features = ["ollama"] }
lunaris-core = { workspace = true }
lunaris-storage-moon = { workspace = true }
lunaris-ingest = { workspace = true }
# Plan 03-04 — bench needs the Extractor trait + EntityId for the graph-on
# StubExtractor (D-03 isolates storage cost from real Gemma forward-pass).
# default-features = false keeps the candle / ollama / cloud-api stack out of
# the bench build (mirrors B-3 fix from Plan 03-02).
lunaris-extract = { workspace = true }
# Plan 16-03 — consolidator_tick bench exercises `ActRConsolidator::default()`
# directly (independent of the `Lunaris` handle's internal consolidator pipeline
# wiring in 16-01) so we depend on `lunaris-consolidate` explicitly. No extra
# features — the default build is NoopConsolidator + ActRConsolidator types.
lunaris-consolidate = { workspace = true }
# Phase 24 / RFC 0006 §4 — verifier divergence corpus generator + the
# binary that loads 27B + 270M to capture the divergence number on the
# reference rig. default-features = false keeps the candle / ollama
# stack out of the bench build unless the operator opts in via the
# `--features verify-small,verify-large` flag on the binary.
lunaris-verify = { workspace = true }
async-trait        = { workspace = true }
bytes              = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
ulid               = { workspace = true }
chrono             = { workspace = true }
rand               = { workspace = true }
rand_chacha        = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
url                = { workspace = true }
# Plan 05-06 — eval gauntlet binary (lunaris-evals) + harness suite.
# anyhow / clap power the binary; hf-hub / dirs power the dataset download +
# cache-directory resolution for LongMemEval / LoCoMo / WNUT-2017 harnesses.
anyhow             = { workspace = true }
clap               = { workspace = true }
hf-hub             = { workspace = true }
dirs               = { workspace = true }
# Plan 05-06 EVAL-04 memory harness (RSS sampling) needs a tracing-subscriber
# init in the binary entry per chaos.rs convention; reuses the existing
# tracing dep already in [dependencies] above.
tracing-subscriber = { workspace = true }

# O-01-F — per-device perf bench dependencies. Optional so the default
# `cargo bench` build doesn't pull candle weights resolution; activated by
# the `per-device-bench` feature (or any of the backend pass-through
# features `metal` / `cpu-accelerate` / `cpu-mkl` / `cuda` / `cuda-fa2`).
lunaris-embed-native  = { workspace = true, optional = true }
lunaris-rerank-native = { workspace = true, optional = true }
# Candle types (Device, etc.) needed by the per-device bench when the
# `per-device-bench` feature is on.
candle-core           = { workspace = true, optional = true }

# Plan 05-06 EVAL-04 Linux RSS sampling via procfs. cfg-gated per-OS so the
# Windows + macOS targets don't pull procfs (which only compiles on Linux).
# macOS uses `ps -o rss= -p <pid>` shell-out (no extra dep) per B-6 fix.
[target.'cfg(target_os = "linux")'.dependencies]
procfs             = { workspace = true }

[dev-dependencies]
criterion          = { workspace = true }
parking_lot        = { workspace = true }
futures            = { workspace = true }
async-trait        = { workspace = true }
bytes              = { workspace = true }
tokio              = { workspace = true, features = ["full", "test-util"] }
# Plan 04-03 — proptest harness for the chaos / crash-recovery property test
# (used downstream by `lunaris-conformance/tests/crash_recovery.rs` which depends
# on `lunaris-bench`).
proptest           = { workspace = true }

[features]
# Gate the live budget-assertion test behind a feature so the default
# `cargo test --workspace` skips it (it has no value without Criterion
# data on disk). CI runs `cargo test -p lunaris-bench --features budget-it`
# AFTER `cargo bench` populates `target/criterion/`.
default = []
budget-it = []
# N-04 D4 — release-binary-size CI gate. Off by default so plain
# `cargo test --workspace` doesn't fail on dev boxes that have never
# built `--release`. CI runs:
#   cargo build --release -p lunaris-server
#   cargo test -p lunaris-bench --features ci-perf-gates --test binary_size_gate
# (scripts/check-binary-size.sh wraps both.)
ci-perf-gates = []
# Phase 24 / RFC 0006 §4 — verifier divergence capture binary forwards.
# These match the lunaris-verify feature names; the binary's
# required-features gate references them in [[bin]].required-features.
verify-small = ["lunaris-verify/verify-small"]
verify-large = ["lunaris-verify/verify-large"]
# Local-dev passthrough so the eval gauntlet (lunaris-evals) can use the native
# Q4/Q5 GGUF embedder+reranker via LUNARIS_EMBEDDER_GGUF / LUNARIS_RERANKER_GGUF
# instead of the default Ollama/FP16 path. Not wired into CI defaults.
embedder-gguf = ["lunaris/embedder-gguf"]
reranker-gguf = ["lunaris/reranker-gguf"]

# ---------------------------------------------------------------------------
# O-01-F — per-device perf benches.
#
# Each feature pass-throughs to `lunaris-embed-native` + `lunaris-rerank-native`
# so `cargo bench --features metal` activates the Metal backend end-to-end
# from the bench harness. The `per_device.rs` bench is `#[cfg(feature =
# "per-device-bench")]`-gated so the default `cargo bench` workflow stays
# unchanged.
# ---------------------------------------------------------------------------
per-device-bench = ["dep:lunaris-embed-native", "dep:lunaris-rerank-native", "dep:candle-core"]
cpu-accelerate   = ["per-device-bench", "lunaris-embed-native/cpu-accelerate", "lunaris-rerank-native/cpu-accelerate"]
cpu-mkl          = ["per-device-bench", "lunaris-embed-native/cpu-mkl", "lunaris-rerank-native/cpu-mkl"]
metal            = ["per-device-bench", "lunaris-embed-native/metal", "lunaris-rerank-native/metal"]
cuda             = ["per-device-bench", "lunaris-embed-native/cuda", "lunaris-rerank-native/cuda"]
cuda-fa2         = ["cuda", "lunaris-embed-native/cuda-fa2", "lunaris-rerank-native/cuda-fa2"]

[[bench]]
name = "ingest_hot_path"
harness = false

# O-01-F — per-device perf gates for the hardware-target matrix in
# HARDWARE-OPTIMIZATION-ROADMAP §26-37. Gated on `per-device-bench` so the
# default `cargo bench` workflow stays unchanged; activate via:
#   cargo bench -p lunaris-bench --features metal          --bench per_device
#   cargo bench -p lunaris-bench --features cpu-accelerate --bench per_device
#   cargo bench -p lunaris-bench --features cuda           --bench per_device
[[bench]]
name = "per_device"
harness = false
required-features = ["per-device-bench"]

[[bench]]
name = "recall_hot_path"
harness = false

[[bench]]
name = "atomic_write_hot_path"
harness = false

# Plan 12-03 HELIOS-05 — p50 ≤ 20 ms tool-call overhead bench for the
# HeliosScratchpad v2 surface (Read:Write:Edit:Grep mix per helios-rfc §5.3).
# Measures on Moon + Postgres; emits evidence envelope alongside Criterion
# samples under target/criterion/helios_smoke/helios_p50_<label>/.
[[bench]]
name = "helios_p50"
harness = false

# Plan 16-03 CONSOL-V1-03 — Criterion bench for one full `ActRConsolidator`
# worker-tick (score → classify → promote/archive emission). Baseline saved at
# `--save-baseline v0.1.2` feeds the committed summary at
# `milestones/v0.1.2-CONSOL-BENCH.json`. Exercises Moon + Postgres via
# `MOON_URL` / `PG_URL` env vars (same skip discipline as `helios_p50.rs`).
[[bench]]
name = "consolidator_tick"
harness = false

# Plan 04-03 — chaos subprocess for the crash-recovery property test (D-23).
# Spawned via `std::process::Command` from
# `crates/lunaris-conformance/tests/crash_recovery.rs`, then SIGKILL'd
# mid-`atomic_write` to verify all-or-nothing semantics on Moon AND Postgres.
[[bin]]
name = "chaos"
path = "src/bin/chaos.rs"

# Plan 05-06 EVAL-01..09 — single-binary eval gauntlet entry point. clap-driven
# subcommands (longmemeval | locomo | er-f1 | memory | e2e | perf-delta | all);
# emits eval-results.json + a markdown summary; CI greps for "status":"FAIL"
# to fail merge per CONTEXT.md D-22.
[[bin]]
name = "lunaris-evals"
path = "src/bin/evals.rs"

# Plan 13-02 RELEASE-03 — Helios chat 10K-turn E2E harness. HUMAN-UAT-gated:
# the executor ships the binary; the operator runs it on a dev box with live
# Moon + Postgres, producing milestones/v0.1.1-EVAL-05-RESULTS.json. SLO gate
# is enforced IN the binary (hard-fail on recall p50 > 25 ms Moon / > 60 ms
# Postgres / promotion_rate < 0.05).
[[bin]]
name = "eval_05_helios_10k"
path = "src/bin/eval_05_helios_10k.rs"

# Phase 24 / RFC 0006 §4 — verifier divergence capture binary. Loads
# both Candle backends, runs compare_verifiers over the 100-item corpus,
# prints divergence_rate + PASS/FAIL. required-features = both Candle
# backends; a bare `cargo build -p lunaris-bench` skips this binary.
[[bin]]
name = "verifier-divergence"
path = "src/bin/verifier_divergence.rs"
required-features = ["verify-small", "verify-large"]

# O-03-A — perf-gate-check CI binary.
#
# Walks `target/criterion/**/change/estimates.json` after a
# `cargo bench -- --baseline v0.4-O01` run and exits non-zero if any
# bench's median timing regressed by more than the configured threshold
# (default 5%, per HARDWARE-OPTIMIZATION-ROADMAP O-03). Used by
# `.github/workflows/perf-gates.yml`; also unit-tested with synthetic
# JSON fixtures so the harness is verifiable without staged weights.
[[bin]]
name = "perf-gate-check"
path = "src/bin/perf_gate_check.rs"

# N-04 D5 — `stage-models` HF Hub stager. Downloads the granite-r2 +
# bge-reranker-v2-m3 safetensors into the operator's local cache; the
# canonical GGUF SHA-256s are printed alongside so operators staging
# quantized artifacts manually have a single source of truth.
# `--dry-run` short-circuits before any FS or network call so CI can
# verify the help text + repo names without egress.
[[bin]]
name = "stage-models"
path = "src/bin/stage_models.rs"
