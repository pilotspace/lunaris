[package]
name        = "lunaris-bench"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish     = false

# Plan 02-04 — Phase 2 latency budget enforcement.
# Bench-only crate: NO production code lives here. The library surface
# (`corpus.rs`, `fixtures.rs`) exists so the Criterion benches in `benches/`
# AND the budget-assertion test in `tests/` can share the deterministic
# 1M-fact corpus generator and the 12 KB markdown fixture.

[dependencies]
lunaris            = { path = "../lunaris", default-features = false, features = ["ollama"] }
lunaris-core       = { path = "../lunaris-core" }
lunaris-storage-moon = { path = "../lunaris-storage-moon" }
lunaris-ingest     = { path = "../lunaris-ingest" }
# Plan 03-04 — bench needs the Extractor trait + EntityId for the graph-on
# StubExtractor (D-03 isolates storage cost from real Gemma forward-pass).
# default-features = false keeps the candle / ollama / cloud-api stack out of
# the bench build (mirrors B-3 fix from Plan 03-02).
lunaris-extract    = { path = "../lunaris-extract", default-features = false }
async-trait        = { workspace = true }
bytes              = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
ulid               = { workspace = true }
chrono             = { workspace = true }
rand               = { workspace = true }
rand_chacha        = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
url                = { workspace = true }
# Plan 05-06 — eval gauntlet binary (lunaris-evals) + harness suite.
# anyhow / clap power the binary; hf-hub / dirs power the dataset download +
# cache-directory resolution for LongMemEval / LoCoMo / WNUT-2017 harnesses.
anyhow             = { workspace = true }
clap               = { workspace = true }
hf-hub             = { workspace = true }
dirs               = { workspace = true }
# Plan 05-06 EVAL-04 memory harness (RSS sampling) needs a tracing-subscriber
# init in the binary entry per chaos.rs convention; reuses the existing
# tracing dep already in [dependencies] above.
tracing-subscriber = { workspace = true }

# Plan 05-06 EVAL-04 Linux RSS sampling via procfs. cfg-gated per-OS so the
# Windows + macOS targets don't pull procfs (which only compiles on Linux).
# macOS uses `ps -o rss= -p <pid>` shell-out (no extra dep) per B-6 fix.
[target.'cfg(target_os = "linux")'.dependencies]
procfs             = { workspace = true }

[dev-dependencies]
criterion          = { workspace = true }
parking_lot        = { workspace = true }
futures            = { workspace = true }
async-trait        = { workspace = true }
bytes              = { workspace = true }
tokio              = { workspace = true, features = ["full", "test-util"] }
# Plan 04-03 — proptest harness for the chaos / crash-recovery property test
# (used downstream by `lunaris-conformance/tests/crash_recovery.rs` which depends
# on `lunaris-bench`).
proptest           = { workspace = true }

[features]
# Gate the live budget-assertion test behind a feature so the default
# `cargo test --workspace` skips it (it has no value without Criterion
# data on disk). CI runs `cargo test -p lunaris-bench --features budget-it`
# AFTER `cargo bench` populates `target/criterion/`.
default = []
budget-it = []

[[bench]]
name = "ingest_hot_path"
harness = false

[[bench]]
name = "recall_hot_path"
harness = false

[[bench]]
name = "atomic_write_hot_path"
harness = false

# Plan 04-03 — chaos subprocess for the crash-recovery property test (D-23).
# Spawned via `std::process::Command` from
# `crates/lunaris-conformance/tests/crash_recovery.rs`, then SIGKILL'd
# mid-`atomic_write` to verify all-or-nothing semantics on Moon AND Postgres.
[[bin]]
name = "chaos"
path = "src/bin/chaos.rs"

# Plan 05-06 EVAL-01..09 — single-binary eval gauntlet entry point. clap-driven
# subcommands (longmemeval | locomo | er-f1 | memory | e2e | perf-delta | all);
# emits eval-results.json + a markdown summary; CI greps for "status":"FAIL"
# to fail merge per CONTEXT.md D-22.
[[bin]]
name = "lunaris-evals"
path = "src/bin/evals.rs"
