[package]
name             = "lunaris-mcp"
version          = "0.4.0-wave-a"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
# lunaris-mcp ships as a prebuilt binary via mcp-prebuild.yml.
# The moon_server path dep (optional, feature-gated) would break `cargo publish`;
# set publish=false to prevent accidental crate publication.
publish          = false

description = "Lunaris memory engine — MCP server for Claude Code, Codex, and other MCP-native agents"
readme      = "README.md"
keywords    = ["mcp", "agent", "memory", "claude-code", "codex"]
categories  = ["command-line-utilities", "database"]

[[bin]]
name = "lunaris-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK — stdio transport only; default features (base64, macros, server)
# retained so Wave 2 #[tool_router]/#[tool_handler] macros work without churn.
# transport-io adds tokio::io::{stdin,stdout} + codec framing needed for stdio.
rmcp = { version = "1.7", features = ["transport-io"] }

# Lunaris engine — Q4_K_M GGUF embedder+reranker; lazy download to ~/.lunaris/models/.
# default-features = false on the workspace entry; we add only what we need here.
lunaris      = { workspace = true, features = ["embedder-gguf", "reranker-gguf"] }
lunaris-core = { workspace = true }
lunaris-retrieve = { workspace = true }

# CLI + observability
clap               = { workspace = true, features = ["derive", "env"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Async runtime — workspace pulls tokio with "full" already
tokio = { workspace = true }

# Serde + errors
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }

# Scope derivation (Wave 1.A) — blake3 + dirs already in workspace
blake3 = { workspace = true }
dirs   = { workspace = true }

# Wave 2.A — t_ref parsing in memory.ingest handler (RFC-3339 → DateTime<Utc>)
chrono = { workspace = true }

# Wave 2.C — ULID parsing in memory.forget episode_id path
ulid = { workspace = true }

# Wave 2.A — JSON Schema generation for rmcp #[tool] parameter types.
# Must be a direct dependency (proc-macro derives resolve by crate name, not
# by rmcp::schemars re-export). Version pinned to match rmcp 1.7's schemars dep.
schemars = { version = "1.0", features = ["chrono04"] }

# Wave 1.B — lazy GGUF model stager (indicatif progress on stderr, reqwest streaming)
# reqwest: workspace 0.13 (rustls+json already there); we add "stream" for
# bytes_stream() needed by the chunked download path.
reqwest      = { workspace = true, features = ["stream"] }
sha2         = { workspace = true }
futures-util = "0.3"
# indicatif 0.17 — progress bars on stderr; NOT in workspace (only lunaris-mcp
# needs it). ProgressDrawTarget::stderr() is the invariant — never stdout().
indicatif    = "0.17"

# Optional: in-process Moon server for the `embedded-moon` feature.
# Aliased as moon_server to avoid colliding with the workspace moondb→moon alias.
# default-features = false; we pull only what the embedded server path needs.
# NOT in `default = [...]` — must be opted in explicitly.
moon_server = { path = "../../vendor/moon", package = "moon", default-features = false, features = ["runtime-tokio", "graph", "text-index"], optional = true }

# parking_lot::Mutex used by EmbeddedMoonGuard (embedded-moon feature).
# Workspace version (0.12) — must be a direct dep since lunaris-mcp links it
# explicitly in embedded_moon.rs.  Optional so the default (no-feature) binary
# doesn't pull it in.
parking_lot = { workspace = true, optional = true }

[features]
# embedded-moon: bundle an in-process Moon server inside lunaris-mcp.
# Requires cmake/clang (aws-lc-rs) and a C compiler (mlua vendored Lua).
# Gated so CI builds without C toolchain still pass under the default feature set.
embedded-moon = ["dep:moon_server", "dep:parking_lot"]

[dev-dependencies]
# placeholder — Wave 2/3 integration tests add real deps
tempfile = "3"
# Wave 1.B — mock HTTP server for model stager tests (no real network in CI)
wiremock = "0.6"
# Wave 2.A — binary-spawn integration tests need tokio process + time features
tokio = { workspace = true, features = ["process", "time", "io-util"] }
# Wave 2.A — JSON-RPC message framing in integration tests
serde_json = { workspace = true }
# dvi — scratchpad_consolidate WIRED test seeds ConsolidateEvent directly via
# StoragePort::publish; needs ConsolidateEvent + CONSOLIDATE_TOPIC from
# lunaris-consolidate (lunaris re-exports the Consolidator trait but not the
# wire types).
lunaris-consolidate = { workspace = true }
lunaris-core = { workspace = true }
futures = { workspace = true }
