[package]
name             = "lunaris-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
# lunaris-mcp ships as a prebuilt binary via mcp-prebuild.yml.
# The embedded-moon feature pulls a vendor path dep (via lunaris-memory-service,
# itself publish=false) that would break `cargo publish`; set publish=false to
# prevent accidental crate publication.
publish          = false

description = "Lunaris memory engine — MCP server for Claude Code, Codex, and other MCP-native agents"
readme      = "README.md"
keywords    = ["mcp", "agent", "memory", "claude-code", "codex"]
categories  = ["command-line-utilities", "database"]

[[bin]]
name = "lunaris-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK — stdio transport only; default features (base64, macros, server)
# retained so Wave 2 #[tool_router]/#[tool_handler] macros work without churn.
# transport-io adds tokio::io::{stdin,stdout} + codec framing needed for stdio.
rmcp = { version = "1.7", features = ["transport-io"] }

# Lunaris engine — llama.cpp GGUF embedder+reranker (Q4_K_M / Q5_K_M) staged
# under ~/.lunaris/models/. default-features = false on the workspace entry;
# we add only what we need here.
lunaris      = { workspace = true, features = ["llamacpp"] }
lunaris-core = { workspace = true }
lunaris-retrieve = { workspace = true }
# Shared transport-neutral engine-op handlers (ingest/recall/forget/record_*/
# status) — one definition, called here and from lunaris-contextd.
lunaris-memory-service = { workspace = true }

# CLI + observability
clap               = { workspace = true, features = ["derive", "env"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Async runtime — workspace pulls tokio with "full" already
tokio = { workspace = true }

# Serde + errors
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }

# Scope derivation (Wave 1.A) — blake3 + dirs already in workspace
blake3 = { workspace = true }
dirs   = { workspace = true }

# proxy.rs — contextd store identity cell (UNSAFE_POLICY: parking_lot over
# std::sync::*Lock). Snapshot-and-drop only; never held across an await.
parking_lot = { workspace = true }

# Wave 2.A — t_ref parsing in memory.ingest handler (RFC-3339 → DateTime<Utc>)
chrono = { workspace = true }

# Wave 2.C — ULID parsing in memory.forget episode_id path
ulid = { workspace = true }

# Wave 2.A — JSON Schema generation for rmcp #[tool] parameter types.
# Must be a direct dependency (proc-macro derives resolve by crate name, not
# by rmcp::schemars re-export). Version pinned to match rmcp 1.7's schemars dep.
schemars = { version = "1.0", features = ["chrono04"] }

# Wave 1.B — lazy GGUF model stager (indicatif progress on stderr, reqwest streaming)
# reqwest: workspace 0.13 (rustls+json already there); we add "stream" for
# bytes_stream() needed by the chunked download path.
reqwest      = { workspace = true, features = ["stream"] }
sha2         = { workspace = true }
futures-util = "0.3"
# indicatif 0.17 — progress bars on stderr; NOT in workspace (only lunaris-mcp
# needs it). ProgressDrawTarget::stderr() is the invariant — never stdout().
indicatif    = "0.17"

[features]
# embedded-moon: bundle an in-process Moon server inside lunaris-mcp.
# The launcher lives in lunaris-memory-service::embedded_moon (ONE definition,
# shared with lunaris-contextd); this feature just forwards. Requires
# cmake/clang (aws-lc-rs) and a C compiler (mlua vendored Lua). NOT in
# `default = [...]` — CI builds without a C toolchain must still pass.
embedded-moon = ["lunaris-memory-service/embedded-moon"]

[dev-dependencies]
# placeholder — Wave 2/3 integration tests add real deps
tempfile = "3"
# Wave 1.B — mock HTTP server for model stager tests (no real network in CI)
wiremock = "0.6"
# Wave 2.A — binary-spawn integration tests need tokio process + time features
tokio = { workspace = true, features = ["process", "time", "io-util"] }
# Wave 2.A — JSON-RPC message framing in integration tests
serde_json = { workspace = true }
# dvi — scratchpad_consolidate WIRED test seeds ConsolidateEvent directly via
# StoragePort::publish; needs ConsolidateEvent + CONSOLIDATE_TOPIC from
# lunaris-consolidate (lunaris re-exports the Consolidator trait but not the
# wire types).
lunaris-consolidate = { workspace = true }
lunaris-core = { workspace = true }
futures = { workspace = true }
# server_boot.rs — reads the DISCOVERY-advertised Moon out-of-band to prove the
# server served against THAT store. Deliberately not via `Lunaris::open`: this
# readback must not depend on an embedder.
lunaris-storage-moon = { workspace = true }
# 0.7.0 prerequisite — ephemeral child-process Moon fixtures (see the crate docs
# in crates/lunaris-test-harness) so tests stop opening `memory://` directly.
# Dev-only; a dev-dependency cycle through `lunaris` that Cargo permits. NOTE
# this is NOT the `embedded-moon` feature — nothing here links the Moon server.
lunaris-test-harness = { workspace = true }
