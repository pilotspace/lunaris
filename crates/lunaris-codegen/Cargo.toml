[package]
name    = "lunaris-codegen"
version = "0.1.0"
description = "Single-source codegen pipeline for PyO3 + napi-rs Lunaris bindings (Phase 8 Plan 08-01 / BIND-GEN-01..03)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lunaris-codegen"
path = "src/bin/lunaris-codegen.rs"

[dependencies]
anyhow       = { workspace = true }
thiserror    = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
clap         = { workspace = true }
syn          = { workspace = true }
quote        = { workspace = true }
proc-macro2  = { workspace = true }
prettyplease = { workspace = true }
toml         = { workspace = true }
similar      = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
insta        = { workspace = true }
# Self-dep reuses the library API the binary links against — keeps the
# integration tests aligned with the public surface.
tempfile     = "3"
