# Lunaris binding surface — single source of truth.
#
# Phase 8 Plan 08-01 (BIND-GEN-01). Structured-table grammar locked by
# revision 1: every `ty` field is a TOML table `{ kind = "...", ... }`.
# See `src/ir.rs` for the IrTyRef variants.
#
# 15 method entries (plan 08-01 said "14" but the enumeration in
# `<interfaces>` lists 15; Rule 1 deviation — we emit all 15 enumerated
# items and the unit test expects the actual count. The two-method discrepancy
# is not a surface-contract risk: every method here corresponds to a real
# Rust inherent method on the v0.1.0 surface + Plan 08-00's `snapshot`).
#
# Receivers:
#   - "none"     — static constructor (Lunaris::open, Vector::new, ...)
#   - "ref_self" — `&self` method
#   - "owned"    — `self` consuming mutator (RetrievalBuilder chain)
#
# BLOCKER 1 resolution: Lunaris::snapshot returns Named { name = "Lsn" }.
# BLOCKER 3+4 resolution: parity-check walker ignores conformance.rs; this
# file does NOT enumerate conformance helpers.

schema_version = 1

[[module]]
name = "lunaris"
rust_crate_path = "::lunaris"

  [[module.type]]
  name = "Lunaris"
  kind = "opaque"
  source_file = "crates/lunaris/src/handle.rs"
  doc = "High-level memory-engine handle. Opens a storage backend by URL and drives ingest, recall, forget, and snapshot."

    [[module.type.methods]]
    name = "open"
    is_async = "yes"
    receiver = "none"
    params = [{ name = "url", ty = { kind = "str" } }]
    returns = { ty = { kind = "ref_self" }, fallible = true }
    doc = "Production constructor. Routes `url` through the scheme dispatcher to pick a StoragePort backend."

    [[module.type.methods]]
    name = "ingest"
    is_async = "yes"
    receiver = "ref_self"
    # Plan 08-02 Rule 1 refinement: `episode` is a typed Episode struct on
    # the Rust side (crates/lunaris-core/src/primitives.rs:16) — the codegen
    # must `depythonize::<Episode>` to match `Lunaris::ingest(Episode)`.
    # `kind = "named", name = "Episode"` tells `rust_owned_ty` to spell
    # `::lunaris::Episode` at the call site; `kind = "json"` would land
    # `serde_json::Value` and fail the arg-type check.
    params = [{ name = "episode", ty = { kind = "named", name = "Episode" } }]
    returns = { ty = { kind = "named", name = "Lsn" }, fallible = true }
    doc = "Ingest one Episode through the hot path (graph-OFF default) or the graph-extraction path (toggle ON)."

    [[module.type.methods]]
    name = "recall"
    is_async = "no"
    receiver = "ref_self"
    params = []
    returns = { ty = { kind = "named", name = "RetrievalBuilder" }, fallible = false }
    doc = "Build a RetrievalBuilder bound to this handle's storage / keyword / embedder / clock."

    [[module.type.methods]]
    name = "forget"
    is_async = "yes"
    receiver = "ref_self"
    # Plan 08-02 Rule 1 refinement: `req` is the typed ForgetRequest
    # (crates/lunaris/src/forget.rs:127). `ForgetRequest` now derives
    # Serialize + Deserialize (Plan 08-02 additive) so depythonize flows
    # through cleanly. `kind = "named", name = "ForgetRequest"` routes
    # `rust_owned_ty` to the correct `::lunaris::forget::ForgetRequest`
    # spelling used by the emitter call site.
    params = [{ name = "req", ty = { kind = "named", name = "ForgetRequest" } }]
    returns = { ty = { kind = "named", name = "ForgetReceipt" }, fallible = true }
    doc = "Single-entry-point erasure API (OPS-01/02/03/04). Soft-delete default; hard mode requires a confirmation token."

    [[module.type.methods]]
    name = "snapshot"
    is_async = "yes"
    receiver = "ref_self"
    params = []
    returns = { ty = { kind = "named", name = "Lsn" }, fallible = true }
    # BLOCKER 1 resolution: returns Lsn (Plan 08-00 landed exactly this
    # signature on crates/lunaris/src/snapshot.rs).
    doc = "Returns the current monotonic LSN — a cheap consistent snapshot marker. Implemented as no-op atomic_write(&[])."

  [[module.type]]
  name = "Vector"
  kind = "builder"
  source_file = "crates/lunaris-retrieve/src/operators/vector.rs"
  doc = "Vector-search DSL operator; root-level constructor for kNN retrieval."

    [[module.type.methods]]
    name = "new"
    is_async = "no"
    receiver = "none"
    params = [
      { name = "index", ty = { kind = "str" } },
      { name = "k",     ty = { kind = "usize" } },
    ]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Construct a Vector retriever over `index` with top-k fan-out."

  [[module.type]]
  name = "Keyword"
  kind = "builder"
  source_file = "crates/lunaris-retrieve/src/operators/keyword.rs"
  doc = "Keyword / BM25 DSL operator; root-level constructor for lexical retrieval."

    [[module.type.methods]]
    name = "bm25"
    is_async = "no"
    receiver = "none"
    params = [
      { name = "index", ty = { kind = "str" } },
      { name = "k",     ty = { kind = "usize" } },
    ]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Construct a BM25 keyword retriever over `index` with top-k fan-out."

  [[module.type]]
  name = "Graph"
  kind = "builder"
  source_file = "crates/lunaris-retrieve/src/operators/graph.rs"
  doc = "Graph-traversal DSL operator; anchors on a set of entity ids and expands N hops."

    [[module.type.methods]]
    name = "anchored"
    is_async = "no"
    receiver = "none"
    params = [
      { name = "entity_ids", ty = { kind = "vec", inner = { kind = "named", name = "EntityId" } } },
      { name = "hops",       ty = { kind = "usize" } },
    ]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Anchor on `entity_ids` and traverse up to `hops` edges out in the Lunaris graph."

  [[module.type]]
  name = "RetrievalBuilder"
  kind = "builder"
  source_file = "crates/lunaris-retrieve/src/builder.rs"
  doc = "Chainable retrieval plan builder. Terminal .execute() runs the plan through the hydrate stage."

    [[module.type.methods]]
    name = "and"
    is_async = "no"
    receiver = "owned"
    params = [{ name = "other", ty = { kind = "named", name = "RetrievalBuilder" } }]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Compose `other` in parallel with the current plan; unions the result set."

    [[module.type.methods]]
    name = "fuse_rrf"
    is_async = "no"
    receiver = "owned"
    params = [{ name = "k", ty = { kind = "usize" } }]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Fuse two parallel branches via reciprocal-rank fusion (client-side or Moon-native depending on capabilities)."

    [[module.type.methods]]
    name = "top"
    is_async = "no"
    receiver = "owned"
    params = [{ name = "n", ty = { kind = "usize" } }]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Keep only the top `n` hits after fusion."

    [[module.type.methods]]
    name = "filter"
    is_async = "no"
    receiver = "owned"
    params = [{ name = "pred", ty = { kind = "str" } }]
    returns = { ty = { kind = "ref_self" }, fallible = true }
    doc = "Attach a filter predicate (parsed via filter_str) to the query; fails on a malformed predicate string."

    [[module.type.methods]]
    name = "as_of"
    is_async = "no"
    receiver = "owned"
    params = [{ name = "hlc", ty = { kind = "named", name = "Hlc" } }]
    returns = { ty = { kind = "ref_self" }, fallible = false }
    doc = "Pin the query to an as-of-HLC time-travel view (SQL:2011 bi-temporal read)."

  [[module.type]]
  name = "GraphPipelineHandle"
  kind = "opaque"
  source_file = "crates/lunaris/src/graph_pipeline.rs"
  doc = "Runtime toggle for the graph-extraction pipeline (default OFF per blueprint §5.2). The toggle method is the canonical single-item entry in the binding surface."

    [[module.type.methods]]
    name = "toggle"
    is_async = "no"
    receiver = "ref_self"
    params = [{ name = "on", ty = { kind = "bool" } }]
    returns = { ty = { kind = "unit" }, fallible = false }
    doc = "Flip the pipeline ON or OFF. Idempotent. Emits `tracing::info!` only on real state transitions (D-12)."

  [[module.type]]
  name = "ConsolidatorPipelineHandle"
  kind = "opaque"
  source_file = "crates/lunaris/src/consolidator_pipeline.rs"
  doc = "Runtime toggle for the ACT-R consolidator worker (default OFF per blueprint §5.1). Mirrors GraphPipelineHandle's single-item toggle surface."

    [[module.type.methods]]
    name = "toggle"
    is_async = "no"
    receiver = "ref_self"
    params = [{ name = "on", ty = { kind = "bool" } }]
    returns = { ty = { kind = "unit" }, fallible = false }
    doc = "Flip the pipeline ON or OFF. Idempotent. Emits `tracing::info!` only on real state transitions (D-12)."

