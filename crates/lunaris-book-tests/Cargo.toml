[package]
name = "lunaris-book-tests"
version = "0.7.1"
edition = "2024"
publish = false
# Inherit the workspace Apache-2.0 licence. Without this cargo-deny's
# `licenses` check rejects the crate outright as `unlicensed` — a workspace
# member is part of the graph it audits even when it never ships.
license.workspace = true

# W4.18 — compile every Rust fence in docs/book through cargo's doctest path.
#
# `mdbook test` cannot do this. It forwards only `-L/--library-path`, and
# Rust 2018+ binds a crate name with `--extern`, so every fence fails with
# E0432 `unresolved import lunaris` no matter what it contains. Pulling the
# pages in with `#[doc = include_str!(..)]` hands them to rustdoc instead,
# which links against this crate's real dependency graph.
#
# That graph is the contract: a book example may use exactly the crates a
# reader would have. Every dependency below is one the fences already import,
# found by compiling and reading the unresolved names rather than guessed —
# `serde_json` alone accounted for 36 of the first run's errors.
[dependencies]
lunaris = { path = "../lunaris", package = "lunaris-memory" }
# The cookbook pages are recipe walkthroughs; 16 unresolved names were this.
lunaris-recipes = { workspace = true }
# `Scope`, `Hlc` and friends, which a few pages import directly rather than
# through the `lunaris` re-export.
lunaris-core = { workspace = true }
# `docs/operations/external-moon.md` quotes MIN_MOON_VERSION. Depending on the
# crate lets that fence ASSERT the real constant instead of shadowing it — a
# mirrored declaration type-checks forever while drifting from the thing it
# claims to show, which is the exact failure this harness exists to catch.
lunaris-storage-moon = { workspace = true }
# Named directly by `docs/guide.md` and `docs/helios-integration.md` fences.
# Without these the fences fail E0432/E0433 on the crate name — a harness
# artifact that says nothing about the docs, which is the exact failure mode
# that made `mdbook test` useless for this job.
lunaris-retrieve = { workspace = true }
lunaris-embed-remote = { workspace = true }
ulid = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Every fence that builds a metadata payload or shows a JSON response.
serde_json = { workspace = true }
# The quickstart and the guides use `?` in `main` and initialise tracing,
# exactly as a reader's binary would.
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `docs/helios-integration.md` documents `lunaris_bench::build_md_doc_corpus`
# as the bulk-corpus entry point, so the fence has to name the crate to
# compile. `default-features = false` is load-bearing: lunaris-bench's
# `llamacpp` feature forwards to the umbrella, and enabling it here would drag
# cmake + llama.cpp into a docs build that has no use for either. The crate's
# own default is already `[]` — this pins it against a future change.
lunaris-bench = { path = "../lunaris-bench", default-features = false }
