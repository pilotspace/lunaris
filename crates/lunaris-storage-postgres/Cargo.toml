[package]
name        = "lunaris-storage-postgres"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "Postgres + pgvector storage backend for Lunaris"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
# Integration tests:
#   cargo test -p lunaris-storage-postgres --lib                      # unit tests, no Postgres required
#   cargo test -p lunaris-storage-postgres --features pg-it           # round-trip vs live Postgres
# Live tests expect Postgres+pgvector+age+pgmq at PG_URL (default postgres://localhost/lunaris).
# Cross-backend identity test additionally requires MOON_URL.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris-core = { workspace = true }
async-trait              = { workspace = true }
bytes                    = { workspace = true }
futures                  = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
thiserror                = { workspace = true }
tokio                    = { workspace = true }
tracing                  = { workspace = true }
sqlx                     = { workspace = true, features = ["macros", "migrate"] }
parking_lot              = { workspace = true }
url                      = { workspace = true }
ulid                     = { workspace = true }
chrono                   = { workspace = true }

[dev-dependencies]
tokio                    = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Run integration tests against a live Postgres with vector + age + pgmq at PG_URL.
pg-it   = []
# Cross-backend identity assertions live in `lunaris-conformance` (which can
# depend on both backends) since `lunaris-storage-moon` carries a `moondb`
# path-dep that isn't on crates.io and would block publish for this crate.
