# lunaris-storage-moon — `MoonStorage` impl backed by Moon (Redis-compatible RESP).
#
# Integration tests:
#   cargo test -p lunaris-storage-moon --lib                   # unit tests, no Moon required
#   cargo test -p lunaris-storage-moon --features moon-it      # round-trip vs live Moon
# Live tests expect Moon at MOON_URL (default moon://localhost:6390).

[package]
name        = "lunaris-storage-moon"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
lunaris-core   = { path = "../lunaris-core" }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
# Phase 1.5 retrofit (STORE-09): replace direct `redis = { workspace = true }` with the
# typed `moon-client` SDK. `moon-client` brings `redis 1.1` transitively with the right
# features. The single documented HSCAN escape hatch in `kv.rs` accesses the underlying
# `redis::aio::MultiplexedConnection` via `MoonClient::inner_mut()` and uses the `redis`
# crate types pulled in transitively.
moon-client    = { workspace = true }
redis          = "1.1"
parking_lot    = { workspace = true }
url            = { workspace = true }
ulid           = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default      = []
# Enable to run the integration tests against a live Moon instance at moon://localhost:6390
moon-it      = []
