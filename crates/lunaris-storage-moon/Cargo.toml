# lunaris-storage-moon — `MoonStorage` impl backed by Moon (Redis-compatible RESP).
#
# Integration tests:
#   cargo test -p lunaris-storage-moon --lib                   # unit tests, no Moon required
#   MOON_URL=moon://127.0.0.1:6380 \
#     cargo test -p lunaris-storage-moon --features moon-it    # round-trip vs live Moon
# The `moon-it` tests dial MOON_URL (default moon://localhost:6380) and PANIC
# on connect if nothing is listening — set it explicitly at a live Moon.

[package]
name        = "lunaris-storage-moon"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "Moon (Redis-compatible) storage backend for the Lunaris agent memory engine"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris-core = { workspace = true }
async-trait    = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
# Phase 1.5 retrofit (STORE-09): direct `redis = { workspace = true }` was replaced
# with the typed `moon` SDK (formerly `moon-client`; renamed upstream). moon v0.1.x
# ships `redis 1.x` transitively with the right features. We additionally pin
# `redis = "1.1"` directly so the single documented HSCAN escape hatch in `kv.rs`
# (the only raw `redis::cmd` site permitted by Phase 1.5 constraints) can name the
# `redis::cmd` / `redis::Value` types it needs.
moon           = { workspace = true }
redis          = "1.1"
parking_lot    = { workspace = true }
url            = { workspace = true }
ulid           = { workspace = true }
# hex encoding for `<index>:<id_hex>` Moon hash keys per Fix 1b
# (avoids non-UTF8 bytes in Redis key names).
hex            = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Dev-dependency cycle (storage-moon --[dev]--> harness --> lunaris -->
# storage-moon), which Cargo explicitly permits — same precedent as
# crates/lunaris's own dev-dep on the harness. Used by dim_configurable.rs:
# the global-index dim guardrail tests each need a PRIVATE Moon (whichever
# dim connects first wins the shared instance, so the two tests can never
# both pass against one server).
lunaris-test-harness = { workspace = true }
# mq_stranded_recovery.rs builds the pre-fix wreckage by hand (MQ CREATE with
# the server-default MAXDELIVERY, then the pop that strands), which the typed
# client deliberately cannot express. Same version as the runtime dep.
redis          = { version = "1.1", features = ["aio", "tokio-comp"] }

[features]
default      = []
# Enable to run the integration tests against a live Moon instance at moon://localhost:6380
moon-it      = []
