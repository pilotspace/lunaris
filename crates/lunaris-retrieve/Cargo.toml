# lunaris-retrieve — Phase 2 retrieval DSL (RETRIEVE-01,02,04,05,07,09,10,13).
#
# Composable operators (Vector + Keyword(BM25)) + combinators (.and / .or / .then) +
# fuse_rrf + modifiers (top / filter / as_of) + hit hydration + query planner stub.
# The outermost surface is `tower::Service<Query, Response = Vec<Hit>>` so the
# whole retriever drops into `ServiceBuilder::new().rate_limit(..).timeout(..)`.

[package]
name        = "lunaris-retrieve"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

description = "Composable retrieval DSL (vector, keyword, graph) for the Lunaris agent memory engine"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris-core = { workspace = true }
# Plan 03-02: Graph operator takes `Vec<EntityId>` (D-13) — pull lunaris-extract
# in with default-features=false so the candle/ollama/cloud-api backend stack
# stays out of the retrieve crate. Only the EntityId DTO + its Display impl is
# needed; backends are gated behind their own features in lunaris-extract.
lunaris-extract = { workspace = true }
# Plan 02-03: Reranker trait + RerankCandidate live in lunaris-rerank. We pull
# it in with default-features=false so the retrieve crate doesn't transitively
# pull the full candle stack — only the umbrella `lunaris` crate forwards the
# `candle` feature when callers want the real BgeRerankerV2M3.
lunaris-rerank = { workspace = true }
# Phase 1.5 fuse_rrf Moon-native dispatch needs the typed `MoonStorage` handle +
# the moon SDK's TextSearchHit type for the hybrid_search return shape. Direct
# deps so the rustdoc links resolve and the type names stay in scope without
# requiring `pub use` re-exports from lunaris-storage-moon.
lunaris-storage-moon = { workspace = true }
moon                 = { workspace = true }
async-trait          = { workspace = true }
bytes                = { workspace = true }
futures              = { workspace = true }
# Plan 03-02: Graph operator hex-encodes EntityIds for the Cypher $ids parameter
# AND hex-decodes the returned m.id_hex column back into Vec<u8> for RawHit.id.
hex                  = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
thiserror            = { workspace = true }
tokio                = { workspace = true, features = ["sync", "macros"] }
tower                = { workspace = true }
tracing              = { workspace = true }
ulid                 = { workspace = true }
# Phase 14.2 — boost-cache post-hydrate rescorer in RetrievalBuilder::execute.
# parking_lot is already a workspace dep; lru provides the LruCache type.
parking_lot          = { workspace = true }
lru                  = { workspace = true }

[dev-dependencies]
tokio                = { workspace = true, features = ["macros", "rt-multi-thread"] }
parking_lot          = { workspace = true }
async-trait          = { workspace = true }
# N5/B2 tree_recall integration test: ingest a real document so the communities
# index is populated, then assert tree retrieval returns more chunks than flat.
lunaris-ingest       = { workspace = true }
lunaris-storage-moon = { workspace = true }
bytes                = { workspace = true }
futures              = { workspace = true }
serde_json           = { workspace = true }
ulid                 = { workspace = true }

[features]
default = []
