[package]
name    = "lunaris-py"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true

[lib]
# Python imports by module name "lunaris" (see pyproject.toml module-name =
# "lunaris.lunaris" — the inner ".lunaris" is THIS cdylib). `rlib` is kept so
# `cargo test --lib` still compiles against the Rust test harness.
#
# `doc = false` so `cargo doc --workspace --no-deps` doesn't collide with
# the umbrella `lunaris` crate's rustdoc output — the PyO3 cdylib's Rust
# surface is internal; readers consume it through the Python type stubs.
name       = "lunaris"
crate-type = ["cdylib", "rlib"]
doc        = false

[dependencies]
# Rust surface being bound. `default-features = false` keeps the cdylib's
# feature set explicit — the SDK adds `llamacpp` via its own default
# feature below (Tier-0 wheels build with `--no-default-features`).
lunaris             = { path = "../lunaris", default-features = false, features = ["ollama"], package = "lunaris-memory" }
lunaris-core        = { path = "../lunaris-core" }
lunaris-recipes     = { path = "../lunaris-recipes" }
lunaris-retrieve    = { path = "../lunaris-retrieve", default-features = false }
# Direct deps on the backend crates so the handwritten `EmbedderConfig` /
# `RerankerConfig` pyclasses can construct backends without forwarding
# feature flags through the umbrella `lunaris` crate.
lunaris-rerank        = { path = "../lunaris-rerank", default-features = false }
# llama.cpp-only cutover — `EmbedderConfig.llamacpp()` / `RerankerConfig.
# llamacpp()` construct the GGUF backends directly. Optional: Tier-0 wheels
# build with `--no-default-features` and get fail-loudly stubs instead.
lunaris-llamacpp      = { path = "../lunaris-llamacpp", optional = true }
# Conformance fixtures — only pulled in under the `bindings-it` feature.
lunaris-conformance = { workspace = true, optional = true }
# PyO3 + async runtime + pythonize — workspace-pinned versions per Plan 08-02.
pyo3                = { workspace = true }
pyo3-async-runtimes = { workspace = true }
pythonize           = { workspace = true }
# Phase 21 Plan 21-01 — `DimValidatingEmbedder` in `src/embedder_config.rs`
# implements the `Embedder` trait, which is `#[async_trait]`-decorated. The
# macro must be in scope at the impl site.
async-trait         = { workspace = true }
# Upstream Rust deps reused via workspace.
chrono              = { workspace = true }
tokio               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
futures             = { workspace = true }
bytes               = { workspace = true }
tracing             = { workspace = true }
thiserror           = { workspace = true }

[features]
# `llamacpp` in default: the shipped wheel embeds the llama.cpp runtime
# (cutover decision — llama.cpp for all devices). Tier-0 builds opt out via
# `maturin build --no-default-features`.
default = ["llamacpp"]
# MUST forward "lunaris/llamacpp": the umbrella crate is imported with
# `default-features = false`, and in a standalone `maturin` build nothing
# else enables it — `Lunaris::open()` then silently resolves NoopEmbedder
# (zero vectors). Workspace builds mask this via feature unification, so
# only the package-scoped build-graph test catches it (found 2026-07-16).
llamacpp = ["dep:lunaris-llamacpp", "lunaris-llamacpp/llamacpp", "lunaris/llamacpp"]
# Plan 08-02 BLOCKER 3+4 resolution — conformance helpers
# (`conformance_fixture_episodes`, `scan_kv_prefix`) compile only under this
# feature. Production PyPI wheels do NOT enable it. The Plan 08-01 parity-check
# walker excludes `crates/lunaris-py/src/conformance.rs` by construction so
# handwritten helpers never trigger codegen drift.
#
# Revision iteration 2 (locked in 08-CONTEXT.md): per-driver backend parity
# does not require deterministic clocks or a zero-embedder. The earlier
# `lunaris/bindings-it` + `lunaris-embed/mock-embedder` feature chain is
# dropped; the only capability the conformance helpers need is access to the
# canonical `lunaris_conformance::fixtures::{SEED, EPISODE_COUNT, FixtureCorpus}`
# constants.
bindings-it = ["dep:lunaris-conformance"]

# GPU offload for the llama.cpp runtime — enabled per-target by the wheel
# build matrix (Phase D).
metal = ["llamacpp", "lunaris-llamacpp/metal", "lunaris/metal"]
cuda  = ["llamacpp", "lunaris-llamacpp/cuda", "lunaris/cuda"]
vulkan = ["llamacpp", "lunaris-llamacpp/vulkan", "lunaris/vulkan"]

[package.metadata.docs.rs]
# lunaris-py is a cdylib — docs.rs doesn't build Python extension modules,
# but `cargo doc --no-deps` on the `rlib` side still works.
all-features = false
no-default-features = true
