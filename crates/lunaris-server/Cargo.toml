[package]
name        = "lunaris-server"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish     = false

# Plan 05-01 — MemoryProtocol HTTP+SSE server (PROTO-01..05 + DEPLOY-01/02/04 per CONTEXT.md D-01..D-09).
# Boots a `Lunaris::open(url)` handle and exposes the four MemoryProtocol verbs at
# /v1/{ingest,recall,forget,snapshot/:lsn} + /healthz. Plan 05-05 will add /metrics.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
lunaris = { workspace = true }
lunaris-core = { workspace = true }
lunaris-retrieve = { workspace = true }
# Memory Inspector browse — the at-rest `fact:` KV row is a `lunaris_extract::types::Fact`
# (NOT `lunaris_core::Fact`); browse/fact deserializes the real shape. Server is the top
# layer and `lunaris` already pulls this transitively, so no new external dependency.
lunaris-extract = { workspace = true }
axum                = { workspace = true }
tower               = { workspace = true }
tower-http          = { workspace = true }
tower-governor      = { workspace = true }
governor            = { workspace = true }
# Plan 05-05 OPS-06 — Prometheus text-format exporter for GET /metrics
# (CONTEXT.md D-25; 9-metric catalogue lives in src/metrics.rs).
prometheus          = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
clap                = { workspace = true, features = ["derive", "env"] }
tokio               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
is-terminal         = { workspace = true }
ulid                = { workspace = true }
url                 = { workspace = true }
chrono              = { workspace = true }
async-trait         = { workspace = true }
futures             = { workspace = true }
bytes               = { workspace = true }
parking_lot         = { workspace = true }
thiserror           = { workspace = true }
anyhow              = { workspace = true }

# W1.2 (2026-08-21) — the crate had NO `[features]` block at all.
#
# The workspace entry for `lunaris` sets `default-features = false` (root
# Cargo.toml), so `cargo build -p lunaris-server` resolved the umbrella WITHOUT
# `llamacpp`, silently produced a `NoopEmbedder` (every vector zero), and
# `/readyz` reported green. There was no `-p lunaris-server --features llamacpp`
# to reach for either — a builder had to know the `--features lunaris/llamacpp`
# spelling. The release rehearsal hit this live (docs/RELEASE.md).
#
# `default = ["llamacpp"]` — deliberate, and one step further than the sibling
# binaries. `lunaris-mcp`, `lunaris-hook`, `lunaris-cli` and
# `lunaris-memory-service` HARD-WIRE `features = ["llamacpp"]` on the dependency
# line, which fixes the trap but removes the Tier-0 build entirely. Routing it
# through a default feature keeps the safe thing automatic while leaving
# `--no-default-features` as an explicit, greppable opt-out for a
# no-inference / air-gapped deployment. Costs nothing in CI: the workspace
# already compiles llama.cpp for those siblings, so feature unification means
# `cargo test --workspace` builds exactly what it built before.
#
# Pinned by `crates/lunaris-core/tests/sdk_feature_forwarding.rs`.
[features]
default = ["llamacpp"]
llamacpp = ["lunaris/llamacpp"]
metal    = ["lunaris/metal"]
cuda     = ["lunaris/cuda"]
vulkan   = ["lunaris/vulkan"]

[dev-dependencies]
tokio              = { workspace = true, features = ["full", "test-util", "macros"] }

[[bin]]
name = "lunaris-server"
path = "src/main.rs"
