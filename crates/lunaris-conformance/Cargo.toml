[package]
name        = "lunaris-conformance"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
# NOT publishable. This is the cross-backend conformance harness, and it
# dev-depends on `lunaris-bench` (`publish = false`) with a real version req
# (`^0.6.0-rc.2` via the workspace manifest), so that dev-dep is KEPT in the
# published manifest and crates.io would reject the upload. It has never been
# uploaded (crates.io 404s) and is absent from crates-publish.yml's list, so
# the previous `publish = true` default was latent-only.
# Pinned by xtask/tests/publish_metadata_guard.rs.
publish     = false

[dependencies]
# Plan 05-02 — extends [dependencies] with the two backend constructors so the
# storage suite can directly instantiate `MoonStorage` / `PostgresStorage` from
# the thin entry tests, and adds reqwest + url for the Plan 05-03 protocol
# suite (the `protocol::*` module body lands in Plan 05-03; the dep is wired
# here so `cargo build -p lunaris-conformance` does not break between plans).
lunaris = { workspace = true }
lunaris-core = { workspace = true }
lunaris-ingest = { workspace = true }             # Phase 29 Plan 04 — raptor conformance suites
lunaris-storage-moon = { workspace = true }       # Plan 05-02 — the only backend since 0.7.0
async-trait              = { workspace = true }
tokio                    = { workspace = true }
futures                  = { workspace = true }                       # Plan 05-02 — scan_range stream walker
bytes                    = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
anyhow                   = { workspace = true }                       # Plan 05-02 — Result<()> shape for runners
ulid                     = { workspace = true }
rand                     = { workspace = true }
rand_chacha              = { workspace = true }
chrono                   = { workspace = true }
url                      = { workspace = true }                       # Plan 05-03 prep
# Plan 05-03 — protocol suite needs `stream` for `Response::bytes_stream()` (SSE
# walker on POST /v1/recall). The workspace `reqwest` dep declares only [json,
# rustls]; we additively turn on `stream` here without touching siblings.
reqwest                  = { workspace = true, features = ["stream"] }

[dev-dependencies]
# Plan 04-03 — chaos / crash-recovery property test (D-23 .. D-25).
# `lunaris-bench` provides both the `chaos` binary (spawned via
# `env!("CARGO_BIN_EXE_chaos")`) AND `build_chaos_corpus` (corpus helper).
lunaris-bench = { workspace = true }
proptest       = { workspace = true }
# 0.7.0 — `tests/run_raptor_parity.rs` used to gate its Moon arms on a `MOON_URL`
# env var CI never set, so they had never run; the harness powers them with a
# disposable child-process Moon instead. Dev-only, and a dev-dependency cycle
# through `lunaris` that Cargo permits.
lunaris-test-harness = { workspace = true }
# Plan 14-03's 4 EVAL-05 regression tests issued raw `sqlx` queries against the
# pg-lunaris pool. They were deleted in 0.7.0 with `lunaris-storage-postgres`,
# and the `sqlx` dev-dep with them — the workspace no longer carries a SQL
# driver at all.
# v0.4 N-03 — lunaris-embed + candle_embed_tokens_fallback test retired.
# The native embedder (granite-r2) has no slow-path BPE fallback to test
# against, so neither `lunaris-embed` nor `dirs` is needed here anymore.

# Plan 04-03 — `nix` is gated to Unix targets so Windows builds skip the
# crash_recovery test cleanly. CLAUDE.md `#![forbid(unsafe_code)]` is
# satisfied because nix's `kill` is a safe wrapper around `kill(2)`'s
# unsafe FFI (the test crate need not declare any `unsafe` blocks).
[target.'cfg(unix)'.dev-dependencies]
nix            = { workspace = true }

[features]
default = []
# Plan 04-03 D-25 — gates the property-based crash-recovery loop behind a
# feature so default `cargo test --workspace` skips it (50 iter × 2 backend
# × ~1s/iter = ~100s — too slow for fast-feedback unit-test runs). CI's
# integration-test job runs `cargo test -p lunaris-conformance --features
# chaos-it --test crash_recovery`. Without backends (MOON_URL / PG_URL
# unset) the proptest body short-circuits to Ok(()) per the Plan 02-04
# two-tier skip discipline so the gated invocation still exits 0.
chaos-it = []
# Plan 08-04 (revision iteration 2) — per-driver backend parity.
# Gates the `bindings/` module (golden-reference loader + NormalizedRows
# + assert_structural_eq + run_rust_driver_backend_parity) behind a feature
# so default `cargo test --workspace` does not pull in the per-driver parity
# test. Does NOT chain `lunaris/bindings-it` or `lunaris-embed/mock-embedder`
# — the golden reference compares structural shape, not byte-identical
# embeddings, so no determinism seam is required. The `base64` dep is NOT
# needed for revision 2 (no byte-exact assertion) so we intentionally omit
# `dep:base64` here.
bindings-it = []
# Plan 14-01 (CI-01): substrate-hardening gate. Empty feature (no deps
# chained) — a semantic marker for "this test needs a live Moon".
# The actual connection is via `MOON_URL` per the existing two-tier skip
# discipline (Plan 02-04). Its `pg-it` sibling died in 0.7.0 with
# `lunaris-storage-postgres`.
moon-it = []
# Plan 21-03 — gates the cross-SDK embedder parity test
# (`tests/sdk_embedder_parity.rs`) behind a feature so default
# `cargo test --workspace` does not pull it in. The test orchestrates
# `python` and `node` subprocesses against the lunaris-py + lunaris-ts SDKs
# and asserts byte-identical 768-d vectors on a fixed 100-input corpus.
# Heavyweight: requires both toolchains, a built lunaris-py wheel + lunaris-ts
# binding, and ~600 MB of fastembed ONNX cache. Invoke explicitly:
#
#   cargo test -p lunaris-conformance --features sdk-parity-it sdk_embedder_parity
sdk-parity-it = []
