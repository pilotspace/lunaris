# lunaris-extract — Phase 3 graph-pipeline extractor (default-OFF per blueprint §5.2).
#
# llama.cpp-only cutover (2026-07, Phase C): extraction is REMOTE-ONLY. The
# in-process candle Gemma-3 backend was deleted; the shipped backends are
# OllamaExtractor (HTTP /api/chat with `format` JSON-schema field) and
# CloudApiExtractor (Anthropic / OpenAI / Gemini / MiniMax / any
# OpenAI-compatible URL, selectable via LUNARIS_EXTRACT_PROVIDER env). Both
# implement the dyn-compatible `Extractor` trait so the umbrella
# `Lunaris::with_extractor` swap stays trait-object friendly. Zero-config is
# degraded mode (NoopExtractor — episodes/chunks/recall work, no graph).
#
# Build matrix:
#   cargo check -p lunaris-extract                                # noop only (default = [])
#   cargo check -p lunaris-extract --features ollama
#   cargo check -p lunaris-extract --features cloud-api
#   cargo check -p lunaris-extract --features ollama,cloud-api
#   cargo test  -p lunaris-extract --features extractor-it        # gated live-backend tests

[package]
name        = "lunaris-extract"
version.workspace = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

publish     = true
description = "LLM-backed entity, relation, and fact extractor for Lunaris"
repository.workspace = true
readme      = "README.md"
keywords    = ["agent", "memory", "llm", "bi-temporal", "vector-search"]
categories  = ["database", "asynchronous", "data-structures"]
[package.metadata.docs.rs]
all-features = false
features = ["ollama", "cloud-api"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Remote-only: no transport linked unless the consumer opts in. Each transport
# feature forwards the matching `lunaris-llm/<feature>`.
default      = []
ollama       = ["dep:reqwest", "lunaris-llm/ollama"]
cloud-api    = ["dep:reqwest", "lunaris-llm/cloud-api"]
# Gates live-backend integration tests (Ollama HTTP + cloud-api keys). SKIPs
# cleanly without env vars (mirrors `embedder-it` from lunaris-embed).
extractor-it = []
# Forwards the lunaris-llm faux feature so external consumers can enable
# FauxBackend via `lunaris-extract/faux` in their own dev-dependencies.
faux         = ["lunaris-llm/faux"]

[dependencies]
lunaris-core = { workspace = true }
# Phase 11 — unified LlmBackend trait. Consumed by `llm_extractor::LlmExtractor`,
# the backend-agnostic adapter. `default-features = false` so this crate stays
# the single source of truth for which transports are enabled — we forward via
# `features` above.
lunaris-llm = { workspace = true }
futures        = { workspace = true }
async-trait    = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }
# UNCONDITIONAL — DTOs serialize regardless of backend; EntityId hashes via blake3
# on every backend (D-06).
blake3         = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json     = { workspace = true }
hex            = { workspace = true }
ulid           = { workspace = true }
# http stack — shared by `ollama` and `cloud-api` features. serde + serde_json
# stay UNCONDITIONAL above (they are required for the trait DTOs regardless).
reqwest        = { workspace = true, optional = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Force the `faux` feature on during `cargo test` so test modules can use
# `FauxBackend` without every test binary having to pass `--features faux`.
lunaris-llm    = { workspace = true, features = ["faux"] }
# CachedExtractor contract tests need throwaway cache directories.
tempfile       = "3"
