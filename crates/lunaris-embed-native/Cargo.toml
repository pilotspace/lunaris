[package]
name         = "lunaris-embed-native"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "Native candle-rs ModernBERT FP16 embedder for IBM granite-embedding-311m-multilingual-r2"

# ---------------------------------------------------------------------------
# Milestone v0.4 — single-backend native embedder.
#
# This crate hosts a *new* embedder backend built directly on `candle-core` +
# `candle-nn` + `candle-transformers::models::modernbert`. It is purpose-built
# for `ibm-granite/granite-embedding-311m-multilingual-r2` (Apache-2.0,
# ModernBERT bi-encoder, 768-d output, mean-pool + L2-normalize).
#
# This crate does NOT replace `lunaris-embed` yet — that swap is a separate
# milestone task. Today both coexist; downstream callers opt in by selecting
# `NativeEmbedder` instead of `FastembedEmbedder`.
# ---------------------------------------------------------------------------

[dependencies]
lunaris-core        = { workspace = true }
candle-core         = { workspace = true }
candle-nn           = { workspace = true }
candle-transformers = { workspace = true }
tokenizers          = { workspace = true }
tokio               = { workspace = true }
parking_lot         = { workspace = true }
thiserror           = { workspace = true }
anyhow              = { workspace = true }
tracing             = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
async-trait         = { workspace = true }
# why: tokenizer.rs pre-normalizes inputs to NFC before encoding so callers
# passing NFD-encoded text (common from iOS/macOS sources) produce the same
# token stream — and therefore the same embedding — as NFC-encoded text. See
# `.planning/phases/N-01-step-1-modernbert-fp16/P1-VERIFICATION-RESULT.md`
# finding #1. Pinned to major version 0 (workspace policy: no new transitive
# vector/BM25 libs — this is unicode-only).
unicode-normalization = "0"
# O-01-B — `NativeEmbedder::open()` initializes the rayon thread pool at
# physical-core count (not logical). Both are in the candle transitive
# graph; we name them explicitly so this crate's BLAS init is self-contained.
num_cpus            = { workspace = true }
rayon               = { workspace = true }

[dev-dependencies]
tokio               = { workspace = true }
# Used by `tests/quantized_equivalence.rs` to SHA-256-verify the GGUF
# payload against the `GRANITE_R2_GGUF_Q4_SHA256` pin before running the
# drift gate. Workspace dep — no new transitive surface.
sha2                = { workspace = true }
# Workspace dep (already used by lunaris-server) — the capturing `Layer` for
# `tests/span_emission.rs` and the per-stage aggregator in
# `examples/profile_embed.rs`. Dev-only: never compiled into the library.
tracing-subscriber  = { workspace = true }

[features]
default       = []
# Gates the real-weights integration test under
# `tests/numerical_equivalence.rs`. Mirrors the convention in `lunaris-embed`
# so CI's existing `embedder-it` job picks it up uniformly:
#   `cargo test -p lunaris-embed-native --features embedder-it -- --nocapture`
embedder-it  = []
# Gates the Q4_K_M / GGUF quantized embedder (`NativeQuantizedEmbedder`)
# + `quantized_modernbert` module. Compile-time opt-in keeps the default
# crate surface unchanged for callers that only want the FP16 path.
# When this flag is on, `candle-core`'s `quantized` module is the only
# additional symbol surface — no new dependency lines required.
embedder-gguf = []

# ---------------------------------------------------------------------------
# O-01 hardware-acceleration backend features (v0.4 milestone)
#
# Each feature wires the corresponding candle accelerator. The model code
# (`modernbert.rs`, `embedder.rs`, `quantized_*.rs`) is `Device`-parameterized
# (see `tmp/O-01-COMPLIANCE-AUDIT.md`); features only activate the candle
# backend's compute path. Selection of `Device::new_metal(0)` / `new_cuda(0)`
# happens at *construction time* via `NativeEmbedderOpts.device`, not via
# `cfg` branches in model code.
#
# These flags are declared in O-01-A (audit landing) and wired by code in
# O-01-B (CPU BLAS + physical-core rayon init), O-01-C (Metal warm-up +
# default Device selection), and O-01-D (CUDA + FA2). Until those land, the
# feature flags are valid Cargo passthroughs but no Lunaris logic depends on
# them.
# ---------------------------------------------------------------------------

# Apple Accelerate framework (macOS CPU BLAS).
cpu-accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

# Intel MKL (Linux x86_64 CPU BLAS).
cpu-mkl = ["candle-core/mkl", "candle-nn/mkl"]

# Apple Silicon Metal GPU backend.
metal = ["candle-core/metal", "candle-nn/metal"]

# NVIDIA CUDA backend. **Untested on the O-01 author's host (macOS / Apple
# Silicon).** Verified in O-03's self-hosted CUDA runner gate.
cuda = ["candle-core/cuda", "candle-core/cudnn", "candle-nn/cuda"]

# FlashAttention 2 kernels on CUDA. May not compose with ModernBERT's
# alternating local/global attention; falls back to plain `cuda` if so.
# **Untested on the O-01 author's host.**
cuda-fa2 = ["cuda", "candle-transformers/flash-attn"]
