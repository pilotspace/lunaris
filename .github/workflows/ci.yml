name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # vendor/moon only — .planning is private (cross-repo auth) and must
      # NOT be pulled here. The moondb path dep (vendor/moon/sdk/rust) is
      # required for cargo to resolve the workspace graph at all.
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Full history + tags: cargo-semver-checks resolves
          # --baseline-rev against the local clone, and the default
          # fetch-depth:1 shallow clone carries no tags at all.
          fetch-depth: 0
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache BOTH target dirs: the Moon build step below lands in
          # vendor/moon/target via --manifest-path, and without it in the cache
          # every run pays a cold ~6 min release build of the Moon binary the
          # test harness needs.
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
      # NOT `cargo fmt --all`: --all also formats path deps OUTSIDE the
      # workspace members (documented cargo behavior), so the vendored
      # moondb SDK (vendor/moon/sdk/rust, excluded in [workspace] but
      # reachable as a path dep) would fail the check with diffs Lunaris
      # does not own. Scope to workspace members only.
      - run: cargo metadata --no-deps --format-version=1 | jq -r '.packages[].name' | sed 's/^/-p /' | xargs cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `lunaris-test-harness` fixtures spawn a disposable child-process Moon
      # per test. 0.7.0 deleted the in-process `memory://` backend they used to
      # degrade to, so a missing binary is now a panic, not a skip — which
      # means `cargo test --workspace` below CANNOT pass on a runner with no
      # `moon` on disk. Build it from the pinned submodule; the harness finds
      # `vendor/moon/target/release/moon` on its own default search path (no
      # MOON_TEST_BINARY needed).
      #
      # This is a release build of a second workspace and is the single most
      # expensive step in this job on a cold cache — Swatinem/rust-cache above
      # covers the lunaris target dir only, so vendor/moon is added to it.
      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon
      # lunaris-py / lunaris-ts are EXCLUDED: pyo3 ships with the
      # `extension-module` feature (workspace pin), which suppresses
      # libpython linkage — their `cargo test` harness binaries therefore
      # cannot link on any platform. Same for napi cdylib tests outside a
      # Node host. Their compile health is covered by the dedicated
      # `cargo check -p lunaris-py -p lunaris-ts` step below; their
      # runtime coverage is owned by conformance-bindings.yml, which is the
      # ONLY workflow that runs pytest or vitest.
      #
      # W2.8 — this comment used to name python-prebuild.yml and
      # ts-prebuild.yml as the owners. Verified counts in both:
      # `grep -c pytest .github/workflows/python-prebuild.yml` = 0,
      # `grep -c vitest .github/workflows/ts-prebuild.yml` = 0. Those two
      # workflows build wheels / .node artifacts; they run no tests. A comment
      # that misnames the owner of a coverage gap is how the gap stays open.
      - run: cargo test --workspace --all-targets --exclude lunaris-py --exclude lunaris-ts
      - run: cargo doc --workspace --no-deps
      # Plan 08-04 - confirm both binding crates type-check under DEFAULT
      # features on every PR. Production wheels / .node binaries are
      # built with default features only (no `bindings-it`); this step
      # catches regressions where the default build breaks because a
      # fix only landed for the feature-gated path.
      #
      # Uses `cargo check` (not `cargo build --release`) because PyO3's
      # `extension-module` feature produces a cdylib that requires
      # maturin's Python symbol resolution to link; raw `cargo build`
      # hits "symbol(s) not found for architecture arm64" at the linker
      # step on non-Linux runners. `cargo check` skips linking and still
      # catches compilation regressions. The multi-platform matrix is
      # owned by `python-prebuild.yml` + `ts-prebuild.yml` which invoke
      # `maturin build` + `napi build` correctly.
      - run: cargo check -p lunaris-py -p lunaris-ts --all-targets

      # llama.cpp cutover (C2c): verify is remote-only — keep the noop-default
      # + transport feature builds compiling on every PR.
      - run: cargo check -p lunaris-verify --no-default-features
      - run: cargo check -p lunaris-verify --features ollama,cloud-api

      # llama.cpp cutover (Phase D/E) — Tier-0 no-inference build. The
      # umbrella default is `llamacpp` (compiles llama.cpp, needs cmake +
      # C++); `--no-default-features` MUST keep compiling as the pure-Rust
      # small-device path (NoopEmbedder/NoopReranker + remote LLM slots).
      # This cell is the regression guard for "small devices still run
      # Lunaris" — if a change makes the umbrella unconditionally require
      # the llama.cpp C++ build, it fails here, not on an operator's box.
      - run: cargo check -p lunaris-memory --no-default-features
      - run: cargo check -p lunaris-memory --no-default-features --features ollama,cloud-api,embed-remote

      # Phase 20 — semver-checks gate. Runs cargo-semver-checks against
      # the previously-published v0.2.1 surface (NOT v0.2.0 — that tag
      # was never cut; releases jumped v0.1.2 -> v0.2.1) so any
      # accidental SemVer break (renamed pub item, removed variant,
      # narrowed type bound) fails CI before the next release cut. Only
      # runs on the publishable surface crates — lunaris-core + lunaris
      # are the load-bearing APIs; internal crates (lunaris-storage-*,
      # lunaris-bench, etc.) are version-bumped together so semver drift
      # inside them is documented in CHANGELOG and not gated here.
      #
      # Skip cleanly if cargo-binstall is unavailable on the runner
      # (semver-checks is advisory until the release pipeline lands;
      # the cargo install fallback keeps it useful on a stock runner).
      - name: cargo_semver_checks
        run: |
          set -e
          if ! command -v cargo-semver-checks >/dev/null 2>&1; then
            cargo install --locked cargo-semver-checks || {
              echo "::warning::cargo-semver-checks unavailable; skipping"
              exit 0
            }
          fi
          cargo semver-checks check-release \
            --package lunaris-core \
            --package lunaris \
            --baseline-rev v0.3.0 || {
            echo "::error::SemVer break detected vs v0.3.0 — bump major version or revert the break"
            exit 1
          }

      # Phase 22 publish-readiness gate — only runs against `lunaris-core`
      # (the leaf of the publishable dep graph). The 7 downstream
      # publishable crates would also dry-run cleanly but only AFTER
      # lunaris-core is actually on crates.io — the dry-run resolves
      # `version = "0.2.1"` for internal deps via the index, not the
      # local workspace, so an unpublished version errors out. The leaf
      # check catches the most-likely regression (missing files,
      # mismatched workspace version) without needing a live crates.io
      # publish in CI.
      - name: cargo_publish_dry_run_core
        run: cargo publish -p lunaris-core --dry-run --allow-dirty

      # Phase 22 supply-chain gate — cargo-deny enforces license policy
      # (Apache-2.0 / MIT / BSD permissive only), bans yanked crates,
      # blocks unknown git/registry sources, and surfaces RUSTSEC
      # advisories. Configured via deny.toml at the workspace root.
      # Ignore-list entries cite upstream-blocker + re-review condition.
      - name: cargo_deny
        run: |
          set -e
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny || {
              echo "::warning::cargo-deny unavailable; skipping"
              exit 0
            }
          fi
          cargo deny check

      # INGEST-04 invariant — single atomic_write per ingest path.
      # Strip line-comments first so doc references don't inflate the
      # count, then require exactly one real `storage.atomic_write` call
      # site in the ingest pipeline. Adding a second fan-out atomic write
      # silently breaks the "all-or-nothing" Core Value (CLAUDE.md §Core
      # Value) and is rejected here at the CI boundary.
      #
      # Security: static literal strings only; no untrusted input.
      - name: ingest_04_single_atomic_write
        run: |
          set -e
          count=$(grep -v '^\s*//' crates/lunaris-ingest/src/pipeline.rs | grep -c 'storage\.atomic_write' || true)
          if [ "$count" != "1" ]; then
            echo "::error::INGEST-04 violated: expected 1 storage.atomic_write call site in crates/lunaris-ingest/src/pipeline.rs, found $count"
            exit 1
          fi

      # W1.1 — ignored-test ratchet.
      #
      # `uat4_forget_honors_scope_target_contract` was parked behind
      # `#[ignore = "un-ignore after ScopedLunaris::forget migration lands
      # (Wave 1F / v0.3)"]`. Wave 1F landed in v0.3. The test stayed ignored
      # through 0.7.0, and the P0 it was written to catch — `/v1/forget`
      # answering 200 while deleting nothing for every real tenant — shipped
      # in four releases. Before this step, `grep -rn 'ignored'
      # .github/workflows/` returned NOTHING: no job looked at ignored tests
      # at all.
      #
      # A blanket `cargo test -- --ignored` is not the gate: every surviving
      # ignore in `crates/*/tests/` genuinely needs a live Moon, a GGUF, a
      # tokenizer, or a release binary that this job does not have, so it
      # would be permanently red. (The ones that only need a live Moon DO run
      # now — integration.yml passes `--include-ignored` to the
      # lunaris-storage-moon step.) What this step enforces instead is that
      # parking a test stays VISIBLE and REVIEWABLE:
      #
      #   1. every `#[ignore]` in an integration-test file must carry a
      #      reason string, and
      #   2. the total count is pinned, so a new one cannot be added without
      #      a deliberate bump that a reviewer sees in the diff.
      #
      # Raising EXPECTED_IGNORED is a decision, not a formality: say in the
      # PR body what the new ignore needs and what un-ignores it.
      #
      # Scope is `*/tests/*.rs` on purpose — in-crate `#[cfg(test)]` units sit
      # beside the code they cover, whereas an integration file can silently
      # park a whole contract. Comment lines are stripped first so prose ABOUT
      # `#[ignore]` does not count.
      #
      # Security: static literal strings only; no untrusted input.
      - name: ignored_test_ratchet
        run: |
          set -euo pipefail
          EXPECTED_IGNORED=13
          sites=$(find crates -path '*/tests/*' -name '*.rs' -print0 \
            | xargs -0 grep -hn '#\[ignore' \
            | grep -vE '^[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          count=$(printf '%s\n' "$sites" | grep -c '#\[ignore' || true)
          bare=$(printf '%s\n' "$sites" | grep -c '#\[ignore\]' || true)
          echo "ignored integration tests: $count (bare: $bare)"
          printf '%s\n' "$sites"
          if [ "$bare" != "0" ]; then
            echo "::error::a bare #[ignore] carries no reason and no expiry — write #[ignore = \"what it needs / what un-ignores it\"]"
            exit 1
          fi
          if [ "$count" != "$EXPECTED_IGNORED" ]; then
            echo "::error::ignored-test count is $count, ratchet expects $EXPECTED_IGNORED. Un-ignoring? Lower EXPECTED_IGNORED in ci.yml. Adding one? Raise it AND say in the PR what un-ignores it."
            exit 1
          fi

      # Plan 13-01 RELEASE-02 — audit envelope grep gate. Blocks
      # reintroduction of inline `serde_json::json!({"kind":"..."})`
      # envelopes in either worker crate. The canonical shape lives in
      # lunaris_core::audit::AuditEvent; all publishers must route through
      # lunaris_core::audit::publish_audit_event.
      #
      # Security: the `run:` block below uses static literal strings only.
      # No github.event.* or other untrusted input flows into the command.
      - name: audit_inline_envelope_grep_gate
        run: |
          set -e
          if grep -rnE 'serde_json::json!\s*\(\s*\{\s*"kind":\s*"(Forget|VerifierArbitration|ConsolidatorPromotion|ConsolidatorArchive)"' crates/lunaris-verify/src crates/lunaris-consolidate/src; then
            echo "::error::inline __lunaris_audit__ envelope detected — use lunaris_core::audit::publish_audit_event(AuditEvent::...)"
            exit 1
          fi

      # W2.8 — `cargo install lunaris-mcp` must never be published as an
      # instruction. `crates/lunaris-mcp` is `publish = false` (it links
      # `lunaris-memory-service`, which carries a `vendor/` path dep), so the
      # crate is not on crates.io and the command 404s for every reader who
      # copies it. The working form is
      # `cargo install --git https://github.com/pilotspace/lunaris lunaris-mcp`.
      #
      # The gate cannot be a plain `grep -q` for the string: the correct docs
      # NAME the broken command in order to warn about it ("plain `cargo
      # install lunaris-mcp` will fail"), and both `npx`/`uvx` postinstall
      # fallbacks carry the same warning as a code comment. So a match is only
      # a violation when NOTHING within +/-3 lines marks it as wrong. Prose
      # wraps, which is why the window is lines and not the single hit line.
      #
      # `docs/decisions/` and `docs/CHANGELOG-archive.md` are excluded on
      # purpose: an ADR and a shipped changelog record what was true on the day
      # they were written. Editing them to match today is falsifying a record,
      # not fixing a doc. `tmp/` is excluded because it is the repo's
      # gitignored scratch dir for `git commit -F tmp/<msg>.txt` bodies.
      #
      # The needle is assembled from two halves so this step's own diagnostic
      # messages do not contain the literal string and flag themselves — which
      # they did on the first draft, caught by re-running the gate against the
      # tree that contains it.
      #
      # Security: static literal strings only; no untrusted input.
      - name: no_prescriptive_cargo_install_lunaris_mcp
        run: |
          set -uo pipefail
          needle='cargo install lunaris-''mcp'
          fixed="cargo install --git https://github.com/pilotspace/lunaris lunaris-mcp"
          markers='NOT |not on crates\.io|does not work|will fail|always fails|never worked|publish = false|cannot be installed'
          violations=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            lo=$(( line > 3 ? line - 3 : 1 ))
            hi=$(( line + 3 ))
            if ! sed -n "${lo},${hi}p" "$file" | grep -qE "$markers"; then
              echo "::error file=${file},line=${line}::prescriptive '${needle}' — the crate is publish = false and that command 404s; use '${fixed}'"
              violations=$((violations + 1))
            fi
          done < <(grep -rn --binary-files=without-match \
            --exclude-dir=target --exclude-dir=vendor --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=tmp --exclude-dir=decisions --exclude=CHANGELOG-archive.md \
            -e "$needle" . || true)
          if [ "$violations" != "0" ]; then
            echo "::error::${violations} prescriptive site(s) — see the annotations above"
            exit 1
          fi
          echo "no prescriptive '${needle}' sites"

      # Plan 13-01 RELEASE-01 — lunaris-core leaf-purity gate. Fails the
      # build if any worker crate sneaks into lunaris-core's transitive
      # dependency graph. Keeps the AuditEvent types at the bottom of the
      # dep tree where every publisher can reach them.
      #
      # Security: static literal strings only; no untrusted input.
      - name: lunaris_core_leaf_purity
        run: |
          set -e
          if cargo tree -p lunaris-core --prefix none | grep -E 'lunaris-verify|lunaris-consolidate|^lunaris '; then
            echo "::error::lunaris-core must remain leaf-pure (no worker-crate or handle-crate deps)"
            exit 1
          fi

      # Plan 13-03 RELEASE-04 — version parity gate. Asserts the Rust
      # umbrella crate, the Python host (crates/lunaris-py/pyproject.toml
      # [project].version), and the TypeScript host
      # (crates/lunaris-ts/package.json .version) all agree. Blocks
      # Info #5 drift (mismatched SDK versions confusing
      # `pip install lunaris==X` vs `npm install lunaris@X` users).
      #
      # Rust source-of-truth: the resolved version of the `lunaris-memory`
      # umbrella crate via `cargo metadata` — crates now inherit
      # `version.workspace = true` from `[workspace.package]`, so grepping
      # the crate manifest yields the inheritance marker, not a number.
      # The pyproject grep tolerates aligned assignment spacing
      # (`version         = "..."`).
      #
      # Security: static literal strings only; no untrusted input.
      - name: version_parity_rust_python_typescript
        run: |
          set -e
          rust_ver=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "lunaris-memory") | .version')
          py_ver=$(grep -m1 -E '^version\s*=' crates/lunaris-py/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          ts_ver=$(jq -r '.version' crates/lunaris-ts/package.json)
          echo "Rust (crates/lunaris): $rust_ver"
          echo "Python (pyproject):    $py_ver"
          echo "TypeScript (package):  $ts_ver"
          if [[ "$rust_ver" != "$py_ver" || "$py_ver" != "$ts_ver" ]]; then
            echo "::error::version parity broken across Rust / Python / TypeScript SDKs (RELEASE-04)"
            exit 1
          fi

  # NOTE: the Plan 13-03 RELEASE-05 `submodule-tag-parity` job used to sit here.
  # It was gated `if: startsWith(github.ref, 'refs/tags/v')` inside a workflow
  # whose only triggers are `push: branches: [main]` and `pull_request` — so it
  # never executed once across five releases (issue #136). Anything added here
  # that needs to run on a tag must live in a workflow with a `tags:` trigger.

  # Phase 8 Plan 08-01 (BIND-GEN-02) — parity-check job.
  # Fails the PR when the committed binding snapshots drift from the
  # regenerated output. The walker is implemented in
  # `crates/lunaris-codegen/src/check.rs` and deliberately enumerates ONLY
  # the three codegen-managed snapshot paths under
  # `crates/lunaris-codegen/snapshots/` — handwritten `conformance.rs`
  # modules owned by Plans 08-02 / 08-03 / 08-04 are invisible to this
  # check by construction (BLOCKER 3+4 / T-08-01-05 carveout).
  #
  # All `run:` steps use static strings / literal paths only. No untrusted
  # user input (issue title / PR body / commit message / etc.) flows into
  # any command. See github.blog/security/vulnerability-research/
  # how-to-catch-github-actions-workflow-injections-before-attackers-do/.
  parity-check:
    name: parity-check
    runs-on: ubuntu-latest
    steps:
      # vendor/moon only — see the `check` job note. cargo run needs the
      # moondb path dep present to resolve the workspace graph.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate bindings into snapshots/
        run: cargo run -p lunaris-codegen -- --emit py --emit ts
      - name: Verify no drift (codegen-managed paths only)
        run: cargo run -p lunaris-codegen -- --check
      - name: Verify --dump-ir matches committed golden snapshot
        run: |
          cargo run -p lunaris-codegen -- --dump-ir > /tmp/lunaris-ir.json
          diff -u crates/lunaris-codegen/snapshots/rust_surface.json /tmp/lunaris-ir.json
      - name: Fail on uncommitted changes to codegen outputs
        run: |
          set -e
          if ! git diff --quiet \
              crates/lunaris-codegen/snapshots/generated_py.rs \
              crates/lunaris-codegen/snapshots/generated_ts.rs \
              crates/lunaris-codegen/snapshots/generated_ts.d.ts \
              crates/lunaris-codegen/snapshots/rust_surface.json; then
            echo "::error::Generated bindings drift from Rust surface — run 'cargo run -p lunaris-codegen -- --emit py --emit ts' locally and commit."
            git diff -- crates/lunaris-codegen/snapshots/
            exit 1
          fi

  # W1.5 — make the "built ≠ wired" discriminators actually execute.
  #
  # `crates/lunaris/tests/llamacpp_wired.rs` and the five
  # `crates/lunaris-llamacpp/tests/*.rs` files all open with
  #
  #     let Some(gguf) = staged(...) else { eprintln!("[skip] …"); return; };
  #
  # and no CI job staged a GGUF — only perf-gates.yml did, and that job is
  # label-gated off PRs. So nine skip sites reported success on every PR
  # without executing a line of the thing they exist to prove: that
  # `Lunaris::open`'s production resolution chain really serves the llama.cpp
  # backends rather than silently degrading to `NoopEmbedder`. A green check
  # that never ran is worse than a missing one — it reads as evidence.
  #
  # Two halves, and both are needed:
  #   1. stage the artifacts (cached on their SHA-256, so a warm run pays a
  #      cache restore instead of ~721 MB of download), and
  #   2. FAIL if any `[skip]` marker reaches the log. Staging can break
  #      silently — a moved HuggingFace URL, a poisoned cache — and without
  #      (2) the job would go right back to reporting success for nothing.
  #      This is the loudness half, and it covers every skip site that exists
  #      now or is added later without touching a line of Rust.
  #
  # Runner cost: a separate job so a cold GGUF download never blocks `check`,
  # and so the two run in parallel. GGUF URLs / SHAs are kept identical to
  # perf-gates.yml and crates/lunaris-mcp/src/model_stager.rs.
  #
  # Security: no `github.event.*` reaches any run: block; the two URLs are
  # static literals passed through env:.
  llamacpp-wired:
    name: llamacpp built-not-wired discriminators
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMBEDDER_GGUF_URL: https://huggingface.co/mykor/granite-embedding-311m-multilingual-r2-GGUF/resolve/main/granite-embedding-311M-multilingual-r2-Q4_K_M.gguf
      EMBEDDER_GGUF_SHA256: 58d27f63e69ccf7abce27bf6b35bb0edebc3a1c05ad4a3165acaba1cdca107c0
      RERANKER_GGUF_URL: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q5_K_M.gguf
      RERANKER_GGUF_SHA256: 1a212007526c7083627eed92b39dd4472e90ff1374a03fb068733378220813ef
      # The harness spawns a disposable Moon per test; 0.7.0 removed the
      # in-process fallback, so a missing binary is a panic, not a skip.
      MOON_TEST_BINARY: ${{ github.workspace }}/vendor/moon/target/release/moon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
          shared-key: llamacpp-wired

      - name: Cache GGUF artifacts
        id: gguf-cache
        uses: actions/cache@v4
        with:
          path: ~/.lunaris/models
          key: gguf-${{ env.EMBEDDER_GGUF_SHA256 }}-${{ env.RERANKER_GGUF_SHA256 }}

      - name: Stage GGUF artifacts (download + SHA-256 verify)
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.lunaris/models
          curl -sSfL --retry 3 "${EMBEDDER_GGUF_URL}" \
            -o ~/.lunaris/models/granite-embedding-311m-multilingual-r2.Q4_K_M.gguf
          curl -sSfL --retry 3 "${RERANKER_GGUF_URL}" \
            -o ~/.lunaris/models/bge-reranker-v2-m3.Q5_K_M.gguf
          cd ~/.lunaris/models
          sha256sum -c <<EOF
          ${EMBEDDER_GGUF_SHA256}  granite-embedding-311m-multilingual-r2.Q4_K_M.gguf
          ${RERANKER_GGUF_SHA256}  bge-reranker-v2-m3.Q5_K_M.gguf
          EOF

      - name: Assert artifacts staged
        run: |
          set -euo pipefail
          test -s ~/.lunaris/models/granite-embedding-311m-multilingual-r2.Q4_K_M.gguf
          test -s ~/.lunaris/models/bge-reranker-v2-m3.Q5_K_M.gguf

      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon

      # `--nocapture` is REQUIRED: the `[skip]` markers go to the test's
      # stderr, which libtest swallows for PASSING tests. Without it the
      # loudness check below would have nothing to read.
      - name: Run the llamacpp discriminators
        run: |
          set -euo pipefail
          cargo test -p lunaris-llamacpp --features llamacpp -- --nocapture 2>&1 | tee gguf-tests.log
          cargo test -p lunaris-memory --features llamacpp --test llamacpp_wired -- --nocapture 2>&1 | tee -a gguf-tests.log

      - name: Fail on a vacuous skip
        # The whole point of the job. A discriminator that did not execute must
        # be visibly distinct from one that passed — never silently green.
        run: |
          set -uo pipefail
          if grep -n '\[skip\]' gguf-tests.log; then
            echo "::error::a built-not-wired discriminator SKIPPED in CI — the GGUF staging step above did not reach it. A skipped discriminator proves nothing; fix the staging rather than accepting the green."
            exit 1
          fi
          echo "no [skip] markers — every discriminator executed"
