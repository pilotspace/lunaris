name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps
      # Plan 08-04 - confirm both binding crates type-check under DEFAULT
      # features on every PR. Production wheels / .node binaries are
      # built with default features only (no `bindings-it`); this step
      # catches regressions where the default build breaks because a
      # fix only landed for the feature-gated path.
      #
      # Uses `cargo check` (not `cargo build --release`) because PyO3's
      # `extension-module` feature produces a cdylib that requires
      # maturin's Python symbol resolution to link; raw `cargo build`
      # hits "symbol(s) not found for architecture arm64" at the linker
      # step on non-Linux runners. `cargo check` skips linking and still
      # catches compilation regressions. The multi-platform matrix is
      # owned by `python-prebuild.yml` + `ts-prebuild.yml` which invoke
      # `maturin build` + `napi build` correctly.
      - run: cargo check -p lunaris-py -p lunaris-ts --all-targets

      # INGEST-04 invariant — single atomic_write per ingest path.
      # Strip line-comments first so doc references don't inflate the
      # count, then require exactly one real `storage.atomic_write` call
      # site in the ingest pipeline. Adding a second fan-out atomic write
      # silently breaks the "all-or-nothing" Core Value (CLAUDE.md §Core
      # Value) and is rejected here at the CI boundary.
      #
      # Security: static literal strings only; no untrusted input.
      - name: ingest_04_single_atomic_write
        run: |
          set -e
          count=$(grep -v '^\s*//' crates/lunaris-ingest/src/pipeline.rs | grep -c 'storage\.atomic_write' || true)
          if [ "$count" != "1" ]; then
            echo "::error::INGEST-04 violated: expected 1 storage.atomic_write call site in crates/lunaris-ingest/src/pipeline.rs, found $count"
            exit 1
          fi

      # Plan 13-01 RELEASE-02 — audit envelope grep gate. Blocks
      # reintroduction of inline `serde_json::json!({"kind":"..."})`
      # envelopes in either worker crate. The canonical shape lives in
      # lunaris_core::audit::AuditEvent; all publishers must route through
      # lunaris_core::audit::publish_audit_event.
      #
      # Security: the `run:` block below uses static literal strings only.
      # No github.event.* or other untrusted input flows into the command.
      - name: audit_inline_envelope_grep_gate
        run: |
          set -e
          if grep -rnE 'serde_json::json!\s*\(\s*\{\s*"kind":\s*"(Forget|VerifierArbitration|ConsolidatorPromotion|ConsolidatorArchive)"' crates/lunaris-verify/src crates/lunaris-consolidate/src; then
            echo "::error::inline __lunaris_audit__ envelope detected — use lunaris_core::audit::publish_audit_event(AuditEvent::...)"
            exit 1
          fi

      # Plan 13-01 RELEASE-01 — lunaris-core leaf-purity gate. Fails the
      # build if any worker crate sneaks into lunaris-core's transitive
      # dependency graph. Keeps the AuditEvent types at the bottom of the
      # dep tree where every publisher can reach them.
      #
      # Security: static literal strings only; no untrusted input.
      - name: lunaris_core_leaf_purity
        run: |
          set -e
          if cargo tree -p lunaris-core --prefix none | grep -E 'lunaris-verify|lunaris-consolidate|^lunaris '; then
            echo "::error::lunaris-core must remain leaf-pure (no worker-crate or handle-crate deps)"
            exit 1
          fi

      # Plan 13-03 RELEASE-04 — version parity gate. Asserts the Rust
      # umbrella crate (crates/lunaris/Cargo.toml), the Python host
      # (crates/lunaris-py/pyproject.toml [project].version), and the
      # TypeScript host (crates/lunaris-ts/package.json .version) all
      # agree. Blocks Info #5 drift (mismatched SDK versions confusing
      # `pip install lunaris==X` vs `npm install lunaris@X` users).
      #
      # Rust source-of-truth: crates/lunaris/Cargo.toml. This repo has
      # no [workspace.package].version field — per-crate versions are
      # canonical. See Plan 13-03 SUMMARY "Deviations" for the full
      # rationale. The umbrella crate is what both host crates wrap,
      # so it is the correct comparison point.
      #
      # Security: static literal strings only; no untrusted input.
      - name: version_parity_rust_python_typescript
        run: |
          set -e
          rust_ver=$(grep '^version' crates/lunaris/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          py_ver=$(grep '^version = ' crates/lunaris-py/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          ts_ver=$(jq -r '.version' crates/lunaris-ts/package.json)
          echo "Rust (crates/lunaris): $rust_ver"
          echo "Python (pyproject):    $py_ver"
          echo "TypeScript (package):  $ts_ver"
          if [[ "$rust_ver" != "$py_ver" || "$py_ver" != "$ts_ver" ]]; then
            echo "::error::version parity broken across Rust / Python / TypeScript SDKs (RELEASE-04)"
            exit 1
          fi

  # Plan 13-03 RELEASE-05 — submodule tag parity gate.
  # Runs ONLY on tagged pushes (`refs/tags/v*`). Asserts the tag exists on
  # BOTH the parent-repo origin AND the .planning submodule's origin. Blocks
  # the orphaned-submodule-pointer failure mode (Phase 13 risk register row #5,
  # CONTEXT.md D9): operator tags parent but forgets to push the .planning
  # tag, leaving external consumers with a reference they cannot clone.
  #
  # Security note: `GITHUB_REF_NAME` is provided by the workflow runtime and
  # is the tag ref the push targets. It is safe to interpolate into the shell
  # via env (not via string-template injection). No user-controlled PR body
  # / commit message flows in.
  #
  # Submodule checkout: the default actions/checkout@v4 does NOT init
  # submodules. The submodule tag check needs .planning/ to be a valid git
  # working tree; `submodules: true` pulls it in at the pinned pointer.
  submodule-tag-parity:
    name: submodule-tag-parity (RELEASE-05)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Assert tag exists on parent AND .planning remotes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          echo "Checking tag $TAG exists on parent AND .planning submodule remotes"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "::error::$TAG not found on parent-repo origin (RELEASE-05)"
            exit 1
          fi
          if ! git -C .planning ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "::error::$TAG not found on .planning submodule origin (RELEASE-05) — operator forgot git -C .planning push origin $TAG"
            exit 1
          fi
          echo "OK: $TAG present on both remotes"

  # Phase 8 Plan 08-01 (BIND-GEN-02) — parity-check job.
  # Fails the PR when the committed binding snapshots drift from the
  # regenerated output. The walker is implemented in
  # `crates/lunaris-codegen/src/check.rs` and deliberately enumerates ONLY
  # the three codegen-managed snapshot paths under
  # `crates/lunaris-codegen/snapshots/` — handwritten `conformance.rs`
  # modules owned by Plans 08-02 / 08-03 / 08-04 are invisible to this
  # check by construction (BLOCKER 3+4 / T-08-01-05 carveout).
  #
  # All `run:` steps use static strings / literal paths only. No untrusted
  # user input (issue title / PR body / commit message / etc.) flows into
  # any command. See github.blog/security/vulnerability-research/
  # how-to-catch-github-actions-workflow-injections-before-attackers-do/.
  parity-check:
    name: parity-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate bindings into snapshots/
        run: cargo run -p lunaris-codegen -- --emit py --emit ts
      - name: Verify no drift (codegen-managed paths only)
        run: cargo run -p lunaris-codegen -- --check
      - name: Verify --dump-ir matches committed golden snapshot
        run: |
          cargo run -p lunaris-codegen -- --dump-ir > /tmp/lunaris-ir.json
          diff -u crates/lunaris-codegen/snapshots/rust_surface.json /tmp/lunaris-ir.json
      - name: Fail on uncommitted changes to codegen outputs
        run: |
          set -e
          if ! git diff --quiet \
              crates/lunaris-codegen/snapshots/generated_py.rs \
              crates/lunaris-codegen/snapshots/generated_ts.rs \
              crates/lunaris-codegen/snapshots/generated_ts.d.ts \
              crates/lunaris-codegen/snapshots/rust_surface.json; then
            echo "::error::Generated bindings drift from Rust surface — run 'cargo run -p lunaris-codegen -- --emit py --emit ts' locally and commit."
            git diff -- crates/lunaris-codegen/snapshots/
            exit 1
          fi
