name: python-prebuild

# Plan 08-04 — BIND-PY-05 multi-platform wheel matrix.
#
# Builds Python wheels for all 5 target triples via PyO3/maturin-action.
# `abi3-py311` means ONE wheel per triple covers Python 3.11 / 3.12 / 3.13,
# so the matrix dimension is just platform (not platform x Python-version).
#
# Triggers:
# - `pull_request` touching `crates/lunaris-py/**` or `crates/lunaris-codegen/**`
#   so every change that could affect the Python wheel is CI-validated on all
#   five platforms.
# - `push` to `main` when the same paths change - keeps main green.
# - `workflow_dispatch` for preview builds.
# - `push` with a `v*` tag - promotes wheels to GitHub Release assets.
#
# `fail-fast: false` - per ROADMAP Phase 8 risk-register row 2, a failing
# arch demotes to "source install supported" in release notes rather than
# blocking the milestone. All matrix rows produce independent artefacts.
#
# Production wheels are built with DEFAULT features only - no `bindings-it`.
# The conformance-bindings workflow owns the feature-gated build.
#
# All `run:` steps use static strings / literal paths / CI-controlled matrix
# values only. No untrusted user input (issue title / PR body / commit
# message) flows into any command. See github.blog/security/
# vulnerability-research/how-to-catch-github-actions-workflow-injections
# -before-attackers-do/.

on:
  pull_request:
    paths:
      - "crates/lunaris-py/**"
      - "crates/lunaris-codegen/**"
      - ".github/workflows/python-prebuild.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/lunaris-py/**"
      - "crates/lunaris-codegen/**"
      - ".github/workflows/python-prebuild.yml"
      - "Cargo.toml"
      - "Cargo.lock"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required for softprops/action-gh-release on tag push

jobs:
  build-wheels:
    name: wheel ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "manylinux_2_28"
          - os: ubuntu-24.04-arm # native ARM runner (free on public repos)
            target: aarch64-unknown-linux-gnu
            manylinux: "manylinux_2_28"
            # NOT ubuntu-latest + cross: the rust-cross
            # manylinux_2_28-cross:aarch64 image ships a GCC 7.5 cross
            # toolchain, and llama.cpp's NEON vld1q_*_x2/_x4 intrinsics
            # need GCC >= 9 ("invalid initializer" wall, run
            # 29107908949). Building natively picks the
            # quay.io/pypa/manylinux_2_28_aarch64 image (modern
            # gcc-toolset), same as the green x86_64 cell.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
            # llama.cpp uses std::filesystem (macOS 10.15+). maturin's
            # x86_64 default deployment target is 10.12 — the ggml
            # compile dies with "'path' is unavailable: introduced in
            # macOS 10.15" (Phase D dispatch run 29103327683). The wheel
            # platform tag moves to macosx_10_15_x86_64 accordingly.
            deployment-target: "10.15"
          - os: macos-14 # Apple Silicon runners
            target: aarch64-apple-darwin
            manylinux: "off"
            # ARM macOS floor is 11.0 anyway; set it explicitly so the
            # MACOSX_DEPLOYMENT_TARGET env below never receives an empty
            # string (clang: "cannot parse integer from empty string" —
            # run 29106550764 broke this previously-green cell that way).
            deployment-target: "11.0"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      # vendor/moon only — the moondb path dep (vendor/moon/sdk/rust) is
      # required for cargo to resolve the workspace graph. .planning is
      # private (cross-repo auth) and must NOT be pulled here.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-target cache key so cross-compilation runs don't poison the
          # native cache.
          key: ${{ matrix.target }}
      - name: Build wheel via maturin
        uses: PyO3/maturin-action@v1
        env:
          # Fallback must be a VALID version — empty string hard-fails
          # clang on macOS. Non-macOS toolchains ignore this var.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target || '11.0' }}
        with:
          command: build
          args: >-
            --release
            --out dist
            --target ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/lunaris-py
          # llama.cpp-only cutover (Phase D): the default `llamacpp`
          # feature compiles llama.cpp inside the manylinux container —
          # llama-cpp-sys-2 needs cmake AND libclang (bindgen). The
          # manylinux_2_28 image (AlmaLinux 8, dnf) and the aarch64
          # cross image (Debian-based, apt) ship neither guaranteed;
          # install whichever package manager is present. Proven
          # missing in dispatch run 29103327683 ("Unable to find
          # libclang" from bindgen 0.72).
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y clang-devel cmake
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y libclang-dev cmake
            fi
            # Cross cell only: bindgen drives HOST clang against TARGET
            # headers, so without the cross sysroot stdint.h resolution
            # dies with "bits/libc-header-start.h file not found" (run
            # 29106550764). The export persists — before-script-linux and
            # the maturin invocation run in one shell script.
            if command -v aarch64-unknown-linux-gnu-gcc >/dev/null 2>&1; then
              export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(aarch64-unknown-linux-gnu-gcc -print-sysroot)"
            fi
      - name: Upload wheel artefact
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-py-wheel-${{ matrix.target }}
          path: crates/lunaris-py/dist/*.whl
          # ROADMAP Phase 8 risk register row 2 - 30-day retention so any
          # fallback / re-release decisions have the exact artefact
          # available for download.
          retention-days: 30

  release:
    name: publish wheels to GitHub Release
    runs-on: ubuntu-latest
    needs: build-wheels
    # This workflow got LUCKY on v0.6.0-rc.1 — all five wheels built, so the
    # default `needs:` semantics never bit. They are the same trap that
    # skipped mcp-prebuild's entire release job on that same tag
    # (run 29399540377: 4/5 targets green, 0 tarballs attached). Without
    # `!cancelled()` a single failing arch attaches ZERO wheels, which
    # contradicts the `fail-fast: false` + "source install supported"
    # risk-register policy this workflow documents above.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download all wheel artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunaris-py-wheel-*
          path: dist
          merge-multiple: true
      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          # Allow partial uploads per risk-register row 2 - a missing arch
          # row should not block the release; release notes document
          # "source install supported" for any demoted target.
          fail_on_unmatched_files: false
      # Tag-gated PyPI publish of the `lunaris` SDK wheels. `--skip-existing`
      # makes the step idempotent so a release re-run (or a retag) never
      # 400s on an already-uploaded file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upload wheels to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        run: |
          pip install --quiet maturin
          maturin upload --non-interactive --skip-existing dist/*.whl
