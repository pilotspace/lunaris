name: ts-prebuild

# Plan 08-04 - BIND-TS-05 multi-platform napi-rs binary matrix.
#
# Builds `.node` binaries for all 5 target triples via @napi-rs/cli 3.x.
# napi-rs 3.x supports cross-compilation for aarch64 Linux / Windows ARM
# via the `--cross-compile` flag where applicable; all matrix rows use
# native runners where available to maximise reliability.
#
# Triggers mirror python-prebuild.yml:
# - `pull_request` touching lunaris-ts or lunaris-codegen
# - `push` to main on the same paths
# - `workflow_dispatch` for preview builds
# - `push` with `v*` tag - uploads prebuilt binaries to GitHub Release
#
# `fail-fast: false` per ROADMAP Phase 8 risk-register row 2 - failing
# arch demotes to "source install supported" rather than blocking.
#
# Production `.node` binaries built with DEFAULT features only - no
# `bindings-it`. The conformance-bindings workflow owns the feature-gated
# build.
#
# All `run:` steps use static strings / literal paths / CI-controlled
# matrix values only. No untrusted user input flows into any command.

on:
  pull_request:
    paths:
      - "crates/lunaris-ts/**"
      - "crates/lunaris-codegen/**"
      - ".github/workflows/ts-prebuild.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/lunaris-ts/**"
      - "crates/lunaris-codegen/**"
      - ".github/workflows/ts-prebuild.yml"
      - "Cargo.toml"
      - "Cargo.lock"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required for softprops/action-gh-release on tag push

jobs:
  build-napi:
    name: napi ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # vendor/moon only — the moondb path dep (vendor/moon/sdk/rust) is
      # required for cargo to resolve the workspace graph. .planning is
      # private (cross-repo auth) and must NOT be pulled here.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install npm deps
        run: npm ci --no-audit --no-fund
        working-directory: crates/lunaris-ts
      - name: Install cross-compilation toolchain (aarch64 Linux)
        if: matrix.cross == true && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # g++ cross REQUIRED since the llama.cpp-only cutover: the default
          # `llamacpp` feature compiles llama.cpp (C++ via cmake) — a
          # C-only cross toolchain dies at the first .cpp file.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # rust-toolchain.toml (channel "1.94") overrides the toolchain the
          # dtolnay action installed targets into (exact "1.94.1" — a
          # DIFFERENT rustup toolchain dir), so the cross std landed in the
          # wrong toolchain and cargo failed with E0463 "can't find crate
          # for `core`". Add the target to the ACTIVE (override-resolved)
          # toolchain.
          rustup target add aarch64-unknown-linux-gnu
          # No .cargo/config.toml in-repo: point cargo, cc-rs, and cmake-rs
          # at the cross linker / compilers / archiver for C and C++ deps
          # (aws-lc-sys, llama-cpp-sys-2). cmake-rs reads the same
          # CC_/CXX_<target> vars and forwards them as
          # -DCMAKE_{C,CXX}_COMPILER to the llama.cpp configure step.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - name: Build .node via napi
        run: npx napi build --platform --release --target ${{ matrix.target }}
        working-directory: crates/lunaris-ts
      - name: Upload .node artefact
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-ts-node-${{ matrix.target }}
          path: crates/lunaris-ts/*.node
          retention-days: 30

  release:
    name: publish .node binaries to GitHub Release
    runs-on: ubuntu-latest
    needs: build-napi
    # `!cancelled()` restores the intent of `fail-fast: false` above. Default
    # `needs:` semantics skip this job unless every matrix leg succeeded, so a
    # single failing arch would attach ZERO .node binaries to the release
    # instead of the four that built — the exact trap that cost the MCP
    # distribution on the v0.6.0-rc.1 tag (mcp-prebuild run 29399540377).
    # Attaching whatever built is the risk-register row 2 behaviour; the red
    # build-napi job is what makes the gap visible.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download all .node artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunaris-ts-node-*
          path: node-artefacts
          merge-multiple: true
      - name: Attach .node binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: node-artefacts/*.node
          # Partial uploads allowed per risk-register row 2.
          fail_on_unmatched_files: false

  # Tag-gated npm publish of the TS SDK. Publishes the five
  # @pilotspace/lunaris-<platform> binary packages FIRST, then the main
  # @pilotspace/lunaris package — order matters because the main package's
  # optionalDependencies resolve the platform packages at install time, so
  # they must already exist on the registry.
  #
  # This job deliberately keeps the DEFAULT `needs:` semantics (skip unless
  # every build-napi matrix leg succeeded). A partial binary set must never
  # be published: the missing platform's package would 404 as an OPTIONAL
  # dependency, npm would report a successful install, and the failure would
  # only surface at require() time. A red build-napi is loud on its own.
  #
  # Idempotency is achieved by asking the registry FIRST (`npm view`), not by
  # swallowing publish failures. Until 0.6.1 every publish was wrapped in
  # `|| echo "::warning::... (already published?)"`, which downgraded auth,
  # network and E404 failures to a warning. In the v0.6.0-rc.1 tag run
  # (29399540645) all six publishes returned `npm error code E404`
  # (PUT rejected — the token cannot write the @pilotspace scope) and the job
  # still reported success. Nothing landed on the registry and nobody noticed
  # for two months.
  publish-npm:
    name: publish @pilotspace/lunaris to npm
    runs-on: ubuntu-latest
    needs: build-napi
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download all .node artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunaris-ts-node-*
          path: node-artefacts
          merge-multiple: true
      - name: Install @napi-rs/cli (for create-npm-dirs)
        working-directory: crates/lunaris-ts
        run: npm install --no-audit --no-fund
      - name: Assemble platform packages
        working-directory: crates/lunaris-ts
        run: |
          set -euo pipefail
          ./node_modules/.bin/napi create-npm-dirs
          cp ../../node-artefacts/lunaris.darwin-arm64.node    npm/darwin-arm64/
          cp ../../node-artefacts/lunaris.darwin-x64.node      npm/darwin-x64/
          cp ../../node-artefacts/lunaris.linux-x64-gnu.node   npm/linux-x64-gnu/
          cp ../../node-artefacts/lunaris.linux-arm64-gnu.node npm/linux-arm64-gnu/
          cp ../../node-artefacts/lunaris.win32-x64-msvc.node  npm/win32-x64-msvc/
      - name: Publish platform packages, then main
        working-directory: crates/lunaris-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          # Pre-release versions (a semver pre-release component, e.g.
          # 0.6.0-rc.1) must NOT land on the 'latest' dist-tag or `npm i`
          # would default to an RC. Route them to 'next'; stable → 'latest'.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "publishing @pilotspace/lunaris@$VERSION under dist-tag '$DIST_TAG'"

          # optionalDependencies MUST request the version we are publishing
          # right now. scripts/bump-version.sh keeps the committed file in
          # sync; this rewrite is the belt-and-braces guard so a hand-edited
          # tree can never publish a main package whose platform deps 404
          # (silently, because they are optional). Single source of truth:
          # the .version field of this same file.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = p.version;
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          node -e 'console.log(JSON.stringify(require("./package.json").optionalDependencies))'

          # Idempotent WITHOUT swallowing failures: ask the registry, and only
          # skip when the exact version is provably already there. Everything
          # else — E404 (token cannot write this scope), E403, auth, network —
          # propagates and fails the job under `set -e`.
          publish_one() {
            pkg="$1"
            dir="$2"
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "skip: ${pkg}@${VERSION} is already on the registry"
              return 0
            fi
            ( cd "${dir}" && npm publish --access public --tag "${DIST_TAG}" )
          }

          for d in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            echo "--- @pilotspace/lunaris-$d ---"
            publish_one "@pilotspace/lunaris-$d" "npm/$d"
          done
          echo "--- @pilotspace/lunaris (main) ---"
          publish_one "@pilotspace/lunaris" "."

      # Independent proof that the publish actually landed. The step above can
      # only fail on a publish it attempted; this one fails on ANY of the six
      # packages being absent from the registry at $VERSION, whatever the
      # cause (silent skip, partial upload, wrong scope, wrong dist-tag).
      # It is the gate that would have caught the 0.5.0 regression on the day
      # it happened instead of two months later.
      - name: Verify all six packages resolve at this version
        working-directory: crates/lunaris-ts
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          missing=""
          for pkg in \
            "@pilotspace/lunaris-darwin-arm64" \
            "@pilotspace/lunaris-darwin-x64" \
            "@pilotspace/lunaris-linux-x64-gnu" \
            "@pilotspace/lunaris-linux-arm64-gnu" \
            "@pilotspace/lunaris-win32-x64-msvc" \
            "@pilotspace/lunaris"; do
            found=""
            # The npmjs packument root can lag a fresh publish by a few
            # seconds; retry before declaring a package missing so this gate
            # reports real absences, not replication lag.
            for attempt in 1 2 3 4 5 6; do
              if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
                found="yes"
                break
              fi
              echo "  ${pkg}@${VERSION} not visible yet (attempt ${attempt}/6)"
              sleep 10
            done
            if [ -n "${found}" ]; then
              echo "ok:      ${pkg}@${VERSION}"
            else
              echo "MISSING: ${pkg}@${VERSION}"
              missing="${missing} ${pkg}@${VERSION}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::npm publish incomplete — absent from the registry:${missing}"
            exit 1
          fi
          echo "all six @pilotspace/lunaris packages resolve at ${VERSION}"
