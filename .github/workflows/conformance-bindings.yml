name: conformance-bindings

# Per-driver backend parity gate.
#
# Builds both bindings WITH the `bindings-it` feature, then runs TWO
# independent per-driver parity tests (Rust / Python / TypeScript) against a
# live Moon. Each driver asserts its own rows against the committed golden
# reference at
# `crates/lunaris-conformance/fixtures/golden/bindings_fixture.json`.
#
# No cross-language byte-identity assertion anywhere — that was explicitly out
# of scope. The "AND" in the original success criterion joined BACKENDS within
# a SINGLE driver run, not LANGUAGES.
#
# ## 0.7.0: one backend, actually live
#
# The matrix used to be `[postgres, moon]`. The `postgres` row pointed BOTH
# `LUNARIS_MOON_URL` and `LUNARIS_POSTGRES_URL` at a `postgres:16` service to
# exercise the pg code path on both slots; the `moon` row was gated on a
# `secrets.MOON_IMAGE` that was never configured, so it neutral-skipped on
# every run. Slice B deleted `lunaris-storage-postgres`, which removes the only
# row that ran — so rather than leave a workflow that passes by skipping, Moon
# is now built from the pinned `vendor/moon` submodule (same recipe as
# integration.yml) and the parity tests run against it for real.
#
# All `run:` steps use static strings / literal paths / CI-controlled values.
# No untrusted user input flows into any command.
#
# Triggers: push to main touching bindings / codegen / conformance + nightly.

# PR-time removed 2026-08-18 (CI diet): at ~19 min this was the slowest PR
# gate, and any crates/lunaris/** touch fired it. The SDK parity truth for
# PRs is `scripts/ci/local-ci.sh full` (maturin+pytest / napi+vitest run
# locally); main-push + nightly cron keep the post-merge backstop.
#
# F31 RULING 2026-08-25 — option (b), a reduced PR variant.
#
# The diet decision was right about the cost and wrong about the consequence.
# Leaving this post-merge means main breaks first: F30 shipped through a green
# PR and turned main red for four runs, and the fix itself lived in a crate the
# `paths` filter did not list, so merging it would not have re-run the job that
# proved it.
#
# What is expensive here is NOT the Moon — `integration.yml` already builds one
# on every PR inside 25 minutes — it is the two RELEASE SDK builds
# (`maturin develop --release`, `napi build --release`) and the two full
# binding suites that follow them. The Rust per-driver parity step needs
# neither: it needs a live Moon and the stub embedder, and it is the step that
# exercises `lunaris-recipes` / `lunaris-retrieve` / `lunaris-storage-moon`,
# which is where F26 and F30 both lived.
#
# So the PR run keeps Moon + the stub + the Rust driver, and skips both SDK
# builds, both binding suites, and the whole `offline-smoke` job. The full
# matrix still runs on main-push and nightly, exactly as the diet intended.
# Guarded by `scripts/tests/test_pr_variant_still_gates_something.py`, because
# a reduced job that reduced to nothing would be a green tick meaning nothing.
on:
  schedule:
    - cron: "15 3 * * *"
  pull_request:
    # Same filter as the push trigger below, deliberately: a path worth
    # re-running the gate for after a merge is worth catching before one.
    paths:
      - "crates/lunaris-py/**"
      - "crates/lunaris-ts/**"
      - "crates/lunaris-codegen/**"
      - "crates/lunaris-conformance/**"
      - "crates/lunaris/**"
      - "crates/lunaris-core/**"
      - "crates/lunaris-recipes/**"
      - "crates/lunaris-retrieve/**"
      - "crates/lunaris-storage-moon/**"
      - ".github/workflows/conformance-bindings.yml"
  push:
    branches: [main]
    # The rule: every crate the parity suites EXECUTE, not just the ones that
    # define the bindings. This is the only job in the repo that starts a Moon
    # and runs the SDK binding suites, so a path missing here is a defect class
    # that reaches main before anything detects it.
    #
    # The `pull_request` trigger above closes most of that window (F31, option
    # (b)): PRs get Moon + the stub embedder + the Rust per-driver parity step,
    # and skip both RELEASE SDK builds and both binding suites, which are the
    # expensive part. The full matrix still runs only here and on the nightly —
    # so a defect that ONLY the SDK binding suites can see is still post-merge.
    # An earlier version of this comment said the job did not run on
    # `pull_request` at all; that was true until 2026-08-25 and is not now.
    #
    # F30 is exactly that: `TimelineReconstruction::between` ignored its
    # `source_prefix`, `documentary_parity` went red on main for four runs, and
    # the fix itself lives in `lunaris-recipes` — which was NOT listed, so the
    # job proving the fix would not have re-run on merge.
    paths:
      - "crates/lunaris-py/**"
      - "crates/lunaris-ts/**"
      - "crates/lunaris-codegen/**"
      - "crates/lunaris-conformance/**"
      - "crates/lunaris/**"
      - "crates/lunaris-core/**"
      # Executed by every parity suite: the recipes under test, the retrieval
      # stack every recall goes through, and the Moon adapter underneath it.
      - "crates/lunaris-recipes/**"
      - "crates/lunaris-retrieve/**"
      - "crates/lunaris-storage-moon/**"
      - ".github/workflows/conformance-bindings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  per-driver-parity:
    name: per-driver parity (moon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUNARIS_MOON_URL: moon://localhost:6391
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # maturin develop refuses to run outside a virtualenv — every run since
      # the workflow was created (2026-04-23) died at the maturin step for
      # this reason. Static strings only; no untrusted input.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon
      - name: Launch Moon service (port 6391, single shard)
        # `--shards 1` is REQUIRED: Lunaris ingest is a single MULTI/EXEC TXN
        # and Moon refuses cross-shard writes. Port 6391 keeps this workflow
        # off integration.yml's 6390 so concurrent runners on one machine (and
        # local reproduction) never collide.
        run: |
          mkdir -p "$RUNNER_TEMP"
          ./vendor/moon/target/release/moon --port 6391 --shards 1 \
            > "$RUNNER_TEMP/moon.log" 2>&1 &
          echo "MOON_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for Moon (60s max)
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/6391) >/dev/null 2>&1; then
              echo "moon reachable after $i attempts"
              exit 0
            fi
            echo "waiting for moon (6391) ($i/30)..."
            sleep 2
          done
          echo "ERROR: moon not reachable after 60s"
          cat "$RUNNER_TEMP/moon.log" || true
          exit 1
      - name: Install maturin + pytest
        if: github.event_name != 'pull_request'
        run: pip install maturin pytest pytest-asyncio python-ulid
      # A deterministic embedder for the WHOLE job.
      #
      # Without one, `resolve_embedder` falls through to NoopEmbedder: zero
      # vectors, so every document sits at the same distance from every query
      # and top-k is arbitrary. `source_prefix` is a post-filter on hydrated
      # rows (PR #85), so a recall with ten genuinely-matching turns returns
      # whatever unrelated rows the index handed back. On run 32522481370 that
      # made `multi_turn_conversation`, `slack_archive` and
      # `meeting_notes_memory` pass while `chat_agent_memory` and
      # `email_threading` failed — same cause, opposite outcomes, a coin flip.
      #
      # The stub is bag-of-tokens: overlapping vocabulary scores positive,
      # disjoint vocabulary scores exactly 0. That keeps ranking assertions
      # exact even as the shared `_dev_` scope fills with other suites'
      # episodes. 768 dims matches both DEFAULT_DIM and NOOP_DEFAULT_DIM, so
      # an index created by an earlier no-embedder run still fits.
      #
      # The two suites that stand up their OWN stub and spy on it
      # (`test_query_dsl.py`, `readme_quickstart.spec.mts`) set the variable in
      # the child environment and override this one — their point is proving
      # the engine called them, which needs a server they control.
      - name: Launch stub embedder (port 8399)
        run: |
          python3 scripts/ci/stub_embedder.py --port 8399 &
          echo "STUB_EMBEDDER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8399/ >/dev/null 2>&1; then
              echo "stub embedder ready"
              echo "LUNARIS_EMBEDDER_OPENAI_URL=http://127.0.0.1:8399" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: stub embedder did not come up on 8399"
          exit 1
      # `embed-remote` alongside `bindings-it`, in BOTH SDK builds.
      #
      # Two binding suites (`lunaris-py/tests/test_query_dsl.py` and
      # `lunaris-ts/__test__/readme_quickstart.spec.mts`) stand up a stub
      # OpenAI-compatible `/v1/embeddings` server and assert the engine
      # actually called it — that is how they prove the query text crossed
      # the FFI rather than silently embedding to zeros. `LUNARIS_EMBEDDER_
      # OPENAI_URL` is only read when `embed-remote` is compiled in, so
      # without this feature those suites could never pass; W4.14 widened
      # this job to run them and they failed on exactly that.
      #
      # This does NOT drop `llamacpp` (it stays on via `default`), so the
      # job still builds the shipped feature set. `resolve_embedder` only
      # prefers llama.cpp when a GGUF is actually reachable, and no runner
      # stages one — so the stub wins here and the local runtime wins on a
      # real install. Both paths stay honest.
      - name: Build + install lunaris-py WITH bindings-it + embed-remote
        if: github.event_name != 'pull_request'
        run: maturin develop --release --features bindings-it,embed-remote
        working-directory: crates/lunaris-py
      - name: npm install + napi build lunaris-ts WITH bindings-it + embed-remote
        if: github.event_name != 'pull_request'
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release --features bindings-it,embed-remote
        working-directory: crates/lunaris-ts
      # `embed-remote` here too, and for a reason the other two steps do not
      # share: this driver runs FIRST and seeds the 10 fixture episodes into
      # the shared `_dev_` scope. Seeded with NoopEmbedder zero vectors they
      # outrank every real match forever (F22), and every later suite recalls
      # them instead of its own data.
      - name: Rust - per-driver backend parity
        run: |
          cargo test -p lunaris-conformance --features bindings-it,embed-remote \
            --test run_bindings_backend_parity -- --nocapture
      # W4.10 — cross-SDK embedder parity. Runs BOTH bindings over 100 fixed
      # inputs and asserts the two 100x768 matrices are bit-identical: they
      # link the same Rust embedder, so any difference is a binding-layer
      # defect (codegen divergence, locale-dependent tokenisation, FFI float
      # corruption — the family that produced the silent-zero-vectors P0).
      #
      # It embeds through `embedderConfigFromEnv`, the production
      # GGUF -> remote -> Noop resolver, NOT through `llamacpp()`. No runner
      # stages a GGUF, so a llamacpp-only probe could only ever skip here —
      # and a permanent skip reads exactly like a passing check. Going
      # through the resolver means this job compares real stub-embedder
      # vectors while a developer's machine compares real llama.cpp vectors.
      #
      # STRICT so a missing prerequisite FAILS instead of quietly skipping;
      # that is the specific defect the predecessor of this test shipped with.
      # Same `pull_request` guard as the SDK build steps above and the two
      # binding suites below: this step needs a BUILT wheel and .node, and
      # those are push-only. Without the guard, strict mode correctly refused
      # to skip on a PR where nothing had built them — the guard belongs on
      # the consumer of a conditional fixture, not on the strictness.
      - name: Rust - cross-SDK embedder parity
        if: (success() || failure()) && github.event_name != 'pull_request'
        env:
          LUNARIS_CONFORMANCE_STRICT: "1"
        run: |
          cargo test -p lunaris-conformance --features bindings-it,embed-remote \
            --test run_sdk_embedder_parity -- --nocapture
      # W4.14 — the WHOLE suite, not just `backend_parity`.
      #
      # This is the only job in the repo that starts a Moon. Until now it ran
      # exactly one file per SDK, so the other ten live-Moon binding suites
      # ran only in the `bindings-it` job below, whose own step name says
      # "offline / skip path" — every one of them skipped, every time. That
      # included `documentary_parity` and `conversational_parity`, both of
      # which had just been rewritten to be satisfiable. A satisfiable gate
      # that no job satisfies is the same green as an unsatisfiable one.
      #
      # Pinned by `scripts/tests/test_live_moon_binding_tests_have_a_runner.py`,
      # which fails if a live-Moon binding suite is added and this job is not
      # widened to cover it.
      - name: Python - full binding suite (live Moon)
        if: (success() || failure()) && github.event_name != 'pull_request'
        run: pytest crates/lunaris-py/tests/ -v
      - name: TypeScript - full binding suite (live Moon)
        if: (success() || failure()) && github.event_name != 'pull_request'
        run: npx vitest run --config vitest.config.mts
        working-directory: crates/lunaris-ts
      - name: Dump Moon logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/moon.log" || true
      - name: Tear down stub embedder
        if: always()
        run: kill "$STUB_EMBEDDER_PID" 2>/dev/null || true
      - name: Tear down Moon process
        if: always()
        run: |
          if [ -n "${MOON_PID:-}" ]; then
            kill "$MOON_PID" 2>/dev/null || true
          fi

  # Offline smoke row: runs both drivers with backend env vars UNSET.
  # The Rust test + Python test + TS test all skip gracefully in that mode
  # so this row acts as a "feature-build compiles cleanly on stock ubuntu"
  # guard rather than a parity-against-live-backend check.
  offline-smoke:
    name: feature-build smoke (no backend)
    runs-on: ubuntu-latest
    # Every step past the Moon build is an SDK build or an SDK suite, which is
    # exactly the cost the F31 ruling keeps off the PR path.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same venv requirement as per-driver-parity above — maturin develop
      # needs VIRTUAL_ENV set. Static strings only; no untrusted input.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
      # The lunaris-conformance test binaries include harness-backed fixtures,
      # which since 0.7.0 PANIC rather than degrade when no moon binary is
      # reachable. Build it so `cargo test` below has one on the default search
      # path (vendor/moon/target/release/moon).
      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon
      - name: cargo test bindings-it feature
        run: cargo test -p lunaris-conformance --features bindings-it --all-targets
      - name: Install maturin + pytest
        run: pip install maturin pytest pytest-asyncio python-ulid
      - name: Build lunaris-py WITH bindings-it
        run: maturin develop --release --features bindings-it
        working-directory: crates/lunaris-py
      # Full suite (not just backend_parity): before 2026-06-11 no workflow
      # anywhere ran these files, so the v0.4 API cutover left them rotting
      # invisibly. Backend-gated tests skip without env URLs; the native
      # factories read local files only, so the suite is offline-safe.
      # Static strings only; no untrusted input.
      - name: Python full suite (offline / skip path)
        run: pytest crates/lunaris-py/tests/ -v
      - name: npm install + napi build lunaris-ts WITH bindings-it
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release --features bindings-it
        working-directory: crates/lunaris-ts
      # Full vitest suite for the same reason as the Python step above.
      # Static strings only; no untrusted input.
      - name: TypeScript full suite (offline / skip path)
        run: npm test
        working-directory: crates/lunaris-ts
