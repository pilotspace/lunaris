name: conformance-bindings

# Per-driver backend parity gate.
#
# Builds both bindings WITH the `bindings-it` feature, then runs TWO
# independent per-driver parity tests (Rust / Python / TypeScript) against a
# live Moon. Each driver asserts its own rows against the committed golden
# reference at
# `crates/lunaris-conformance/fixtures/golden/bindings_fixture.json`.
#
# No cross-language byte-identity assertion anywhere — that was explicitly out
# of scope. The "AND" in the original success criterion joined BACKENDS within
# a SINGLE driver run, not LANGUAGES.
#
# ## 0.7.0: one backend, actually live
#
# The matrix used to be `[postgres, moon]`. The `postgres` row pointed BOTH
# `LUNARIS_MOON_URL` and `LUNARIS_POSTGRES_URL` at a `postgres:16` service to
# exercise the pg code path on both slots; the `moon` row was gated on a
# `secrets.MOON_IMAGE` that was never configured, so it neutral-skipped on
# every run. Slice B deleted `lunaris-storage-postgres`, which removes the only
# row that ran — so rather than leave a workflow that passes by skipping, Moon
# is now built from the pinned `vendor/moon` submodule (same recipe as
# integration.yml) and the parity tests run against it for real.
#
# All `run:` steps use static strings / literal paths / CI-controlled values.
# No untrusted user input flows into any command.
#
# Triggers: push to main touching bindings / codegen / conformance + nightly.

# PR-time removed 2026-08-18 (CI diet): at ~19 min this was the slowest PR
# gate, and any crates/lunaris/** touch fired it. The SDK parity truth for
# PRs is `scripts/ci/local-ci.sh full` (maturin+pytest / napi+vitest run
# locally); main-push + nightly cron keep the post-merge backstop.
on:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches: [main]
    paths:
      - "crates/lunaris-py/**"
      - "crates/lunaris-ts/**"
      - "crates/lunaris-codegen/**"
      - "crates/lunaris-conformance/**"
      - "crates/lunaris/**"
      - "crates/lunaris-core/**"
      - ".github/workflows/conformance-bindings.yml"
  workflow_dispatch:

jobs:
  per-driver-parity:
    name: per-driver parity (moon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUNARIS_MOON_URL: moon://localhost:6391
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # maturin develop refuses to run outside a virtualenv — every run since
      # the workflow was created (2026-04-23) died at the maturin step for
      # this reason. Static strings only; no untrusted input.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon
      - name: Launch Moon service (port 6391, single shard)
        # `--shards 1` is REQUIRED: Lunaris ingest is a single MULTI/EXEC TXN
        # and Moon refuses cross-shard writes. Port 6391 keeps this workflow
        # off integration.yml's 6390 so concurrent runners on one machine (and
        # local reproduction) never collide.
        run: |
          mkdir -p "$RUNNER_TEMP"
          ./vendor/moon/target/release/moon --port 6391 --shards 1 \
            > "$RUNNER_TEMP/moon.log" 2>&1 &
          echo "MOON_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for Moon (60s max)
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/6391) >/dev/null 2>&1; then
              echo "moon reachable after $i attempts"
              exit 0
            fi
            echo "waiting for moon (6391) ($i/30)..."
            sleep 2
          done
          echo "ERROR: moon not reachable after 60s"
          cat "$RUNNER_TEMP/moon.log" || true
          exit 1
      - name: Install maturin + pytest
        run: pip install maturin pytest pytest-asyncio python-ulid
      - name: Build + install lunaris-py WITH bindings-it
        run: maturin develop --release --features bindings-it
        working-directory: crates/lunaris-py
      - name: npm install + napi build lunaris-ts WITH bindings-it
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release --features bindings-it
        working-directory: crates/lunaris-ts
      - name: Rust - per-driver backend parity
        run: |
          cargo test -p lunaris-conformance --features bindings-it \
            --test run_bindings_backend_parity -- --nocapture
      - name: Python - per-driver backend parity
        if: success() || failure()
        run: pytest crates/lunaris-py/tests/test_backend_parity.py -v
      - name: TypeScript - per-driver backend parity
        if: success() || failure()
        run: npx vitest run --config vitest.config.mts __test__/backend_parity.spec.mts
        working-directory: crates/lunaris-ts
      - name: Dump Moon logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/moon.log" || true
      - name: Tear down Moon process
        if: always()
        run: |
          if [ -n "${MOON_PID:-}" ]; then
            kill "$MOON_PID" 2>/dev/null || true
          fi

  # Offline smoke row: runs both drivers with backend env vars UNSET.
  # The Rust test + Python test + TS test all skip gracefully in that mode
  # so this row acts as a "feature-build compiles cleanly on stock ubuntu"
  # guard rather than a parity-against-live-backend check.
  offline-smoke:
    name: feature-build smoke (no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same venv requirement as per-driver-parity above — maturin develop
      # needs VIRTUAL_ENV set. Static strings only; no untrusted input.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
      # The lunaris-conformance test binaries include harness-backed fixtures,
      # which since 0.7.0 PANIC rather than degrade when no moon binary is
      # reachable. Build it so `cargo test` below has one on the default search
      # path (vendor/moon/target/release/moon).
      - name: Build Moon (release, from vendor/moon submodule)
        run: cargo build --release --manifest-path vendor/moon/Cargo.toml --bin moon
      - name: cargo test bindings-it feature
        run: cargo test -p lunaris-conformance --features bindings-it --all-targets
      - name: Install maturin + pytest
        run: pip install maturin pytest pytest-asyncio python-ulid
      - name: Build lunaris-py WITH bindings-it
        run: maturin develop --release --features bindings-it
        working-directory: crates/lunaris-py
      # Full suite (not just backend_parity): before 2026-06-11 no workflow
      # anywhere ran these files, so the v0.4 API cutover left them rotting
      # invisibly. Backend-gated tests skip without env URLs; the native
      # factories read local files only, so the suite is offline-safe.
      # Static strings only; no untrusted input.
      - name: Python full suite (offline / skip path)
        run: pytest crates/lunaris-py/tests/ -v
      - name: npm install + napi build lunaris-ts WITH bindings-it
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release --features bindings-it
        working-directory: crates/lunaris-ts
      # Full vitest suite for the same reason as the Python step above.
      # Static strings only; no untrusted input.
      - name: TypeScript full suite (offline / skip path)
        run: npm test
        working-directory: crates/lunaris-ts
