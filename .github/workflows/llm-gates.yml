# LLM quality gates -- ER-F1 agreement + extract parity.
# Tests live at:
#   crates/lunaris-verify/tests/quality_gate_4b_vs_27b.rs
#   crates/lunaris-extract/tests/parity_gate_legacy_vs_llm_extractor.rs
# SKIP-clean contract: both tests eprintln!+return when their env vars are
# unset, so these jobs are always safe to run; only a runner labelled
# `llm-weights-cached` (with safetensors on disk) produces real evidence.

name: LLM Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: llm-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-parity-gate:
    name: Extract parity gate (legacy vs LLM extractor)
    runs-on: [self-hosted, llm-weights-cached]
    timeout-minutes: 60

    env:
      LUNARIS_EXTRACT_GEMMA_PATH: ${{ secrets.LUNARIS_EXTRACT_GEMMA_PATH }}
      LUNARIS_EXTRACT_MIN_AGREEMENT_RATIO: 0.95

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Run extract parity gate
        run: >
          cargo test
          -p lunaris-extract
          --features candle,extractor-it
          --test parity_gate_legacy_vs_llm_extractor
          --
          --nocapture

  verify-er-f1-gate:
    name: Verify ER-F1 gate (Gemma-3 4B vs 27B agreement)
    runs-on: [self-hosted, llm-weights-cached]
    timeout-minutes: 90

    env:
      LUNARIS_VERIFY_GEMMA_4B_PATH: ${{ secrets.LUNARIS_VERIFY_GEMMA_4B_PATH }}
      LUNARIS_VERIFY_GEMMA_27B_PATH: ${{ secrets.LUNARIS_VERIFY_GEMMA_27B_PATH }}
      LUNARIS_VERIFY_MIN_AGREEMENT_RATIO: 0.80

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Run verify ER-F1 gate
        run: >
          cargo test
          -p lunaris-verify
          --features candle,verifier-it
          --test quality_gate_4b_vs_27b
          --
          --nocapture
