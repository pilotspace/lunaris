# Integration workflow — live Moon service.
#
# ## 0.7.0: Moon-only
#
# This file used to run a `pg-lunaris` service (pgvector + AGE + pgmq) beside
# Moon, with `pg-it` default-on and an AS_OF parity step comparing the two
# backends field-by-field in-process. Slice B deleted
# `lunaris-storage-postgres`, `lunaris-storage-embedded`, and `lunaris-migrate`,
# so:
#
#   - the pg-lunaris image build / start / wait / teardown steps are gone,
#     along with `PG_URL` / `LUNARIS_PG_URL` and the `pg-it` feature (which no
#     longer exists on any crate);
#   - the AS_OF parity step is gone with its test file. What survives is
#     `run_as_of_moon_gap.rs`, which pins STORE-07 (Moon has no KV version
#     chain, so a historical read is REFUSED, not faked) unconditionally as
#     part of the main conformance run — no live second backend needed, and
#     therefore no separate step;
#   - the EVAL-05 `regression` step and the whole
#     `integration-vanilla-pg-negative` job are gone: both asserted Postgres
#     substrate-gap error strings from tests deleted with the backend.
#
# Required-check names changed with them — see the slice-B PR description.
#
# ## Ownership
#
# Moon is built from source at the SHA pinned by the `vendor/moon` submodule
# (Option B — no registry, no token), cached via `Swatinem/rust-cache@v2` keyed
# on that SHA so warm runs stay under ~3 min.
#
# ## Security posture (mirrors eval-gauntlet.yml)
#
# - No `run:` step interpolates untrusted `github.event.*` payloads. All
#   expansions are limited to runner-provided, GitHub-controlled values
#   (github.run_id, github.sha, github.workspace) and reach the shell via
#   `env:` (RUN_ID / RUN_SHA) — never inlined into run: strings.
# - The Moon service is a background process on the runner — no egress to a
#   managed cluster.
# - actions/checkout@v4 with `submodules: false`, then a NON-RECURSIVE
#   `vendor/moon` init: vendor/moon has its own nested `.planning` submodule
#   (SSH-only) we neither need nor can authenticate for.

name: Integration

# PR-time removed 2026-08-18 (CI diet): this suite costs ~8 min on every PR
# and duplicates what `scripts/ci/local-ci.sh full` runs locally at M4 speed.
# main-push + nightly cron keep the post-merge backstop; dispatch covers
# on-demand runs. See docs/ci/local-ci.md for the contract.
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: integration (Moon + moon-it)
    runs-on: ubuntu-latest
    # Target p50 is 8 min; 25 min is the safety margin for a cold
    # Swatinem/rust-cache miss (Moon release build ~6 min from scratch).
    timeout-minutes: 25

    env:
      # Skip discipline: when MOON_URL is set, conformance tests attempt the
      # live connection; absent, they short-circuit to Ok(()). The wait-for-port
      # gate below guarantees it is up before any cargo test runs. The scheme is
      # `moon://` (not `redis://`) per the W-8 contract — Lunaris::open
      # dispatches on URL scheme, and since 0.7.0 `moon` is the only one it
      # accepts.
      MOON_URL: moon://localhost:6390
      # The `lunaris-test-harness` fixtures spawn their OWN disposable Moon per
      # test (never this one). Point them at the binary this job builds; without
      # it every harness-backed test panics with the no-moon diagnostic, because
      # 0.7.0 removed the in-process fallback that used to absorb a missing
      # binary.
      MOON_TEST_BINARY: ${{ github.workspace }}/vendor/moon/target/release/moon

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        # Non-recursive: vendor/moon has its own nested .planning submodule
        # (pilotspace/moon-docs, SSH-only) that we do NOT need for builds.
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        # Matches workspace rust-toolchain.toml + CLAUDE.md MSRV pin.
        # Shared by the Moon build step AND the cargo test step.
        uses: dtolnay/rust-toolchain@1.94

      - name: Capture pinned Moon SHA (for cache key)
        # Read the submodule's HEAD SHA into an env var so the rust-cache
        # shared-key below is deterministic on the pinned Moon commit.
        # The submodule pointer is the single source of truth for the
        # Moon CI pin (see scripts/moon-ci/README.md) — .gitmodules only
        # holds URL/branch config, not the SHA.
        id: moon-sha
        run: |
          SHA=$(git -C vendor/moon rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned Moon SHA: $SHA"

      - name: Cache cargo registry + target dirs (lunaris + vendor/moon)
        uses: Swatinem/rust-cache@v2
        with:
          # Cache BOTH the root lunaris workspace target/ AND the
          # vendor/moon target/ (Moon build lands there via --manifest-path).
          # Multiline `workspaces:` syntax is the rust-cache-idiomatic form.
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
          # Keyed on the pinned Moon SHA so the cache invalidates on SHA
          # bump only (not on every unrelated lunaris change), keeping warm
          # Moon builds < 3 min.
          shared-key: moon-ci-${{ steps.moon-sha.outputs.sha }}

      - name: Build Moon (release, from vendor/moon submodule)
        # `cargo build --release --manifest-path vendor/moon/Cargo.toml --bin
        # moon` produces vendor/moon/target/release/moon — which is BOTH the
        # long-lived service below AND the binary MOON_TEST_BINARY hands to the
        # harness. The submodule pointer determines the source SHA; no secret
        # and no token needed.
        run: |
          cargo build --release \
            --manifest-path vendor/moon/Cargo.toml \
            --bin moon

      - name: Launch Moon service (port 6390, single shard)
        # Background with stdout+stderr to a log file so the on-failure dump
        # has something to show. Port 6390 matches eval-gauntlet.yml's URL
        # contract (local dev uses 6380; CI uses 6390).
        #
        # `--shards 1` is REQUIRED, not cosmetic: Lunaris ingest is a single
        # MULTI/EXEC TXN and Moon refuses cross-shard writes. A sharded Moon
        # fails every ingest with "TXN does not support cross-shard writes"
        # (docs/operations/external-moon.md).
        run: |
          mkdir -p "$RUNNER_TEMP"
          ./vendor/moon/target/release/moon --port 6390 --shards 1 \
            > "$RUNNER_TEMP/moon.log" 2>&1 &
          MOON_PID=$!
          echo "MOON_PID=$MOON_PID" >> "$GITHUB_ENV"
          echo "Moon launched with PID $MOON_PID, logging to $RUNNER_TEMP/moon.log"

      - name: Wait for Moon (60s max, two retries tolerated)
        # TCP probe, 30 attempts at 2s. Bash /dev/tcp is sufficient; no netcat
        # dep. Two retries absorb the first-second-of-boot loopback flake.
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/6390) >/dev/null 2>&1; then
              echo "moon reachable after $i attempts"
              exit 0
            fi
            echo "waiting for moon (6390) ($i/30)..."
            sleep 2
          done
          echo "ERROR: moon not reachable after 60s"
          cat "$RUNNER_TEMP/moon.log" || true
          exit 1

      - name: Run conformance tests with moon-it
        # Scope is strictly -p lunaris-conformance (NOT --workspace) to keep the
        # 8-min budget tight; --workspace is owned by ci.yml.
        run: |
          cargo test -p lunaris-conformance \
            --features moon-it \
            --no-fail-fast

      - name: Run lunaris-storage-moon tests with moon-it
        # The backend's own live-Moon suite. Before 0.7.0 this ran only from a
        # developer's shell; with Postgres gone it is the deepest live coverage
        # the storage layer has, so CI owns it.
        if: success() || failure()
        run: |
          cargo test -p lunaris-storage-moon \
            --features moon-it \
            --no-fail-fast

      - name: Run lunaris-recipes tests with moon-it
        # Recipe integration tests use probe_backend skip discipline (SKIP when
        # MOON_URL is unset); it is set in the job env, so they run live.
        # Separate step from lunaris-conformance so failures are independently
        # visible in the Actions UI.
        if: success() || failure()
        run: |
          cargo test -p lunaris-recipes \
            --features moon-it \
            --no-fail-fast

      - name: Timing summary (budget evidence)
        # Runs unconditionally so budget data is captured even on test failure.
        # SECONDS is the bash shell-init wall-clock counter; per-step SECONDS
        # resets on each new shell, so this captures step-wall-clock. The
        # authoritative p50 comes from the GHA API job-level wall-clock.
        if: always()
        env:
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          MOON_SHA: ${{ steps.moon-sha.outputs.sha }}
        run: |
          WALL_CLOCK="${SECONDS}"
          {
            echo "## integration timing"
            echo ""
            echo "- wall_clock_seconds: ${WALL_CLOCK}"
            echo "- sha: ${RUN_SHA}"
            echo "- run_id: ${RUN_ID}"
            echo "- moon_sha: ${MOON_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"job":"integration","wall_clock_seconds":%d,"sha":"%s","run_id":"%s","moon_sha":"%s"}\n' \
            "${WALL_CLOCK}" "${RUN_SHA}" "${RUN_ID}" "${MOON_SHA}" > timing.json
          cat timing.json

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-timing-${{ github.run_id }}
          path: timing.json

      - name: Budget gate (soft-fail)
        # Reads wall_clock_seconds from the timing.json the previous step wrote
        # and classifies against the 480s (8-min) target. SOFT-FAIL: a blown
        # budget triggers a runbook, not a red PR. The step always exits 0 —
        # classification lives in the job summary + a single structured JSON
        # line on stdout for future log aggregation.
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f timing.json ]; then
            echo '{"budget_gate":"UNKNOWN","wall_clock_seconds":0,"target_seconds":480,"reason":"timing.json missing"}'
            echo "## Budget gate: UNKNOWN (timing.json missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          WALL=$(jq -r '.wall_clock_seconds // 0' timing.json)
          if [ "$WALL" -le 480 ]; then
            STATUS="PASS"
          elif [ "$WALL" -le 600 ]; then
            STATUS="WARN"
          else
            STATUS="BREACH"
          fi
          printf '{"budget_gate":"%s","wall_clock_seconds":%s,"target_seconds":480}\n' "$STATUS" "$WALL"
          {
            echo "## Budget gate: ${STATUS}"
            echo ""
            echo "- wall_clock_seconds: ${WALL}"
            echo "- target_seconds: 480 (8 min)"
            echo "- classification: PASS <= 480, WARN 481-600, BREACH > 600"
            echo "- soft-fail: this gate never blocks the PR"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dump Moon logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/moon.log" ]; then
            echo "--- moon.log ---"
            cat "$RUNNER_TEMP/moon.log"
          else
            echo "moon logs unavailable (no $RUNNER_TEMP/moon.log)"
          fi

      - name: Tear down Moon process
        if: always()
        run: |
          if [ -n "${MOON_PID:-}" ]; then
            kill "$MOON_PID" 2>/dev/null || true
            echo "Killed Moon PID $MOON_PID"
          fi
