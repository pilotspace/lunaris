# Integration workflow — live Moon service.
#
# ## 0.7.0: Moon-only
#
# This file used to run a `pg-lunaris` service (pgvector + AGE + pgmq) beside
# Moon, with `pg-it` default-on and an AS_OF parity step comparing the two
# backends field-by-field in-process. Slice B deleted
# `lunaris-storage-postgres`, `lunaris-storage-embedded`, and `lunaris-migrate`,
# so:
#
#   - the pg-lunaris image build / start / wait / teardown steps are gone,
#     along with `PG_URL` / `LUNARIS_PG_URL` and the `pg-it` feature (which no
#     longer exists on any crate);
#   - the AS_OF parity step is gone with its test file. What survives is
#     `run_as_of_moon_gap.rs`, which pins STORE-07 (Moon has no KV version
#     chain, so a historical read is REFUSED, not faked) unconditionally as
#     part of the main conformance run — no live second backend needed, and
#     therefore no separate step;
#   - the EVAL-05 `regression` step and the whole
#     `integration-vanilla-pg-negative` job are gone: both asserted Postgres
#     substrate-gap error strings from tests deleted with the backend.
#
# Required-check names changed with them — see the slice-B PR description.
#
# ## Ownership
#
# Moon is built from source at the SHA pinned by the `vendor/moon` submodule
# (Option B — no registry, no token), cached via `Swatinem/rust-cache@v2` keyed
# on that SHA so warm runs stay under ~3 min.
#
# ## Security posture (mirrors eval-gauntlet.yml)
#
# - No `run:` step interpolates untrusted `github.event.*` payloads. All
#   expansions are limited to runner-provided, GitHub-controlled values
#   (github.run_id, github.sha, github.workspace) and reach the shell via
#   `env:` (RUN_ID / RUN_SHA) — never inlined into run: strings.
# - The Moon service is a background process on the runner — no egress to a
#   managed cluster.
# - actions/checkout@v4 with `submodules: false`, then a NON-RECURSIVE
#   `vendor/moon` init: vendor/moon has its own nested `.planning` submodule
#   (SSH-only) we neither need nor can authenticate for.

name: Integration

# W1.6 (2026-08-21) — `pull_request` RESTORED.
#
# It was removed 2026-08-18 as a CI diet, on the reasoning that
# `scripts/ci/local-ci.sh full` covers it locally. The audit result: 71
# live-Moon test functions across 23 files — every one gated
# `#![cfg(feature = "moon-it")]`, and ci.yml passes no `--features` — stopped
# running on PRs entirely. Moon is the only substrate since 0.7.0, so that is
# the deepest coverage the storage layer has, and it was landing unverified.
# A local script is a backstop somebody may run; it is not a gate.
#
# Cost, measured rather than assumed: the storage-moon suite is ~15 s of test
# time (52 functions, verified locally against a fresh Moon on 2026-08-21).
# The job's wall clock is dominated by the Moon RELEASE BUILD, which
# `Swatinem/rust-cache` keys on the pinned submodule SHA — and ci.yml's
# `check` job already pays that same build on every PR. Integration runs in
# PARALLEL with `check`, and `check` (clippy + full workspace test + doc +
# semver-checks + deny) is the longer job, so restoring this trigger does not
# extend the critical path.
#
# Deliberately NOT split into a PR subset and a nightly remainder: a split
# leaves some arm running only after merge, which is the exact hole this task
# exists to close. Revisit only with a measured p50 that breaks the budget
# gate below.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (Moon + moon-it)
    runs-on: ubuntu-latest
    # Target p50 is 8 min; 25 min is the safety margin for a cold
    # Swatinem/rust-cache miss (Moon release build ~6 min from scratch).
    timeout-minutes: 25

    env:
      # Skip discipline: when MOON_URL is set, conformance tests attempt the
      # live connection; absent, they short-circuit to Ok(()). The wait-for-port
      # gate below guarantees it is up before any cargo test runs. The scheme is
      # `moon://` (not `redis://`) per the W-8 contract — Lunaris::open
      # dispatches on URL scheme, and since 0.7.0 `moon` is the only one it
      # accepts.
      MOON_URL: moon://localhost:6390
      # A skip in THIS job is a defect, not a courtesy. Every conformance
      # precondition above is satisfied by construction here — the Moon is up
      # and port-checked, the server binary is built — so a runner that
      # short-circuits to Ok(()) has stopped testing while still reporting
      # success. That is not hypothetical: the `/v1/forget` P0 (200 OK, nothing
      # deleted, every real tenant) is guarded by a single assertion that lives
      # inside `run_protocol_lunaris_server.rs`, and that runner has three
      # separate paths that skip to green.
      #
      # Despite the name this is the JOB's no-silent-skip switch, honoured by
      # lunaris-conformance, lunaris-storage-moon and lunaris-ingest alike. One
      # variable on purpose: two names would let an operator turn half the job
      # strict. F10 was the storage half — 20 skip decisions across 18 files, all
      # green with Moon down, in the same job that guarantees Moon is up, while
      # `episode_roundtrip` and `moon_client_smoke` failed loudly on the same
      # missing dependency. Four of those files (keyword_bm25, scope_isolation,
      # list_scopes, multishard_live) did not even use the `connect_or_skip`
      # name, and two of them hold the very `#[ignore]`d tests the
      # `--include-ignored` below exists to run.
      LUNARIS_CONFORMANCE_STRICT: "1"
      # W1.1 — `lunaris-storage-moon`'s live suite reads LUNARIS_MOON_URL, not
      # MOON_URL (see tests/list_scopes.rs::moon_url), and defaults to :6380.
      # Unset, its `maybe_connect()` printed a SKIP and returned Ok — six
      # `#[ignore = "requires live Moon"]` tests that could never run even with
      # `--include-ignored`. Same value, both names.
      LUNARIS_MOON_URL: moon://localhost:6390
      # The `lunaris-test-harness` fixtures spawn their OWN disposable Moon per
      # test (never this one). Point them at the binary this job builds; without
      # it every harness-backed test panics with the no-moon diagnostic, because
      # 0.7.0 removed the in-process fallback that used to absorb a missing
      # binary.
      MOON_TEST_BINARY: ${{ github.workspace }}/vendor/moon/target/release/moon
      # Inputs to scripts/ci/reset_moon.sh, which restarts Moon on an EMPTY
      # data dir before every test step (F28). MOON_DATA_DIR is explicit
      # because Moon's `--dir` otherwise auto-resolves to the platform
      # user-data directory — a restart without it reopens the same store and
      # resets nothing.
      #
      # MOON_DATA_DIR / MOON_LOG are NOT set here: the `runner` context is not
      # available in a job-level `env:` block (only github, needs, strategy,
      # matrix, vars, inputs), and referencing it makes the whole workflow file
      # invalid — GitHub reports "this run likely failed because of a workflow
      # file issue" with no job-level annotation and NOTHING in the pull
      # request's check rollup. They are exported from $RUNNER_TEMP below.
      MOON_PORT: "6390"
      MOON_BINARY: ${{ github.workspace }}/vendor/moon/target/release/moon

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        # Non-recursive: vendor/moon has its own nested .planning submodule
        # (pilotspace/moon-docs, SSH-only) that we do NOT need for builds.
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        # Matches workspace rust-toolchain.toml + CLAUDE.md MSRV pin.
        # Shared by the Moon build step AND the cargo test step.
        uses: dtolnay/rust-toolchain@1.94

      - name: Capture pinned Moon SHA (for cache key)
        # Read the submodule's HEAD SHA into an env var so the rust-cache
        # shared-key below is deterministic on the pinned Moon commit.
        # The submodule pointer is the single source of truth for the
        # Moon CI pin (see scripts/moon-ci/README.md) — .gitmodules only
        # holds URL/branch config, not the SHA.
        id: moon-sha
        run: |
          SHA=$(git -C vendor/moon rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned Moon SHA: $SHA"

      - name: Cache cargo registry + target dirs (lunaris + vendor/moon)
        uses: Swatinem/rust-cache@v2
        with:
          # Cache BOTH the root lunaris workspace target/ AND the
          # vendor/moon target/ (Moon build lands there via --manifest-path).
          # Multiline `workspaces:` syntax is the rust-cache-idiomatic form.
          workspaces: |
            . -> target
            vendor/moon -> vendor/moon/target
          # Keyed on the pinned Moon SHA so the cache invalidates on SHA
          # bump only (not on every unrelated lunaris change), keeping warm
          # Moon builds < 3 min.
          shared-key: moon-ci-${{ steps.moon-sha.outputs.sha }}

      - name: Build Moon (release, from vendor/moon submodule)
        # `cargo build --release --manifest-path vendor/moon/Cargo.toml --bin
        # moon` produces vendor/moon/target/release/moon — which is BOTH the
        # long-lived service below AND the binary MOON_TEST_BINARY hands to the
        # harness. The submodule pointer determines the source SHA; no secret
        # and no token needed.
        run: |
          cargo build --release \
            --manifest-path vendor/moon/Cargo.toml \
            --bin moon

      - name: Build lunaris-server (the protocol suite spawns it)
        # W1.5 — `tests/run_protocol_lunaris_server.rs` SKIPS cleanly when
        # `target/<profile>/lunaris-server` is absent, and no CI job ever built
        # it. The entire HTTP protocol conformance suite — every MemoryProtocol
        # verb, the D-21 hard-delete rail, auth, rate limiting — had therefore
        # been reporting success without spawning a server. It was hiding a
        # real bug: `snapshot::ndjson_stream` asked for a far-future LSN, which
        # `routes/snapshot.rs::is_future_hlc` answers `404` by design, so the
        # assertion had been unsatisfiable since that rule landed. Fixed in the
        # same commit; this step is what keeps it honest.
        #
        # `--no-default-features` deliberately: W1.2 put `llamacpp` in the
        # server's default set, and compiling llama.cpp here would add a cold
        # C++ build to this job's budget for no signal — the protocol suite
        # asserts HTTP status and body shape, never embedding quality. The
        # default-on build is exercised by ci.yml's workspace compile.
        run: cargo build -p lunaris-server --no-default-features


      - name: Pin Moon runtime paths
        # $RUNNER_TEMP is a plain shell variable here, which `run:` can read
        # even though the `runner` CONTEXT is off-limits in job-level `env:`.
        run: |
          {
            echo "MOON_DATA_DIR=$RUNNER_TEMP/moon-data"
            echo "MOON_LOG=$RUNNER_TEMP/moon.log"
          } >> "$GITHUB_ENV"

      - name: Launch Moon (port 6390, single shard, fresh data dir)
        # Same script every later step uses, so "first launch" and "reset
        # between steps" cannot drift apart. It restarts on an empty --dir,
        # waits for the port, and then ASSERTS the store is empty — a reset
        # whose emptiness is never checked is a setup step pretending to be
        # evidence.
        #
        # `--shards 1` is REQUIRED, not cosmetic: Lunaris ingest is a single
        # MULTI/EXEC TXN and Moon refuses cross-shard writes. A sharded Moon
        # fails every ingest with "TXN does not support cross-shard writes"
        # (docs/operations/external-moon.md).
        run: bash scripts/ci/reset_moon.sh

      - name: Build the chaos driver binary
        # BOTH crash suites spawn `chaos` as a subprocess, and NOTHING built
        # it. `chaos` lives in `lunaris-bench`, a DIFFERENT package from either
        # test, so Cargo never sets `CARGO_BIN_EXE_chaos` (that variable covers
        # same-package bins only) and both fall back to
        # `<target>/<profile>/chaos`, which did not exist on a runner.
        #
        # This is why `chaos_helios_sigkill`'s park reason was not just wrong
        # but incomplete: it blamed wall-clock, and the actual blocker was a
        # missing binary. Nobody knew, because the test had never run — a
        # never-run test's documented requirements are themselves unverified.
        #
        # Debug profile: both resolvers pick the directory from
        # `cfg!(debug_assertions)`, and `cargo test` without `--release` is
        # debug.
        run: cargo build -p lunaris-bench --bin chaos

      - name: Run conformance tests with moon-it
        # `chaos-it` added 2026-08-24. Without it `crash_recovery.rs` compiles
        # to a SINGLE test — `chaos_it_feature_disabled_placeholder` — and
        # reports green. The feature gates the whole
        # `moon_atomic_write_is_all_or_nothing_under_kill_minus_9` proptest
        # (spawn, SIGKILL, assert the primitive count is unchanged), and NO
        # workflow enabled it, so the crash-recovery suite had never run. For a
        # product that leads with provable atomicity, neither of its two crash
        # suites executing anywhere is the gap worth closing.
        #
        # Cost measured 2026-08-24 on a live Moon: 24.6 / 30.1 / 28.8 s.
        #
        # Note this is a THIRD parking mechanism, invisible to both the
        # `#[ignore]` ratchet and the routing sweep: a whole file behind
        # `#[cfg(feature = ...)]` with a placeholder test standing in for it.
        # See ship-plan.
        # Scope is strictly -p lunaris-conformance (NOT --workspace) to keep the
        # 8-min budget tight; --workspace is owned by ci.yml.
        run: |
          cargo test -p lunaris-conformance \
            --features "moon-it chaos-it" \
            --no-fail-fast

      - name: Reset Moon (fresh data dir)
        # F28: without this the next suite runs against whatever the previous
        # one left behind, and can report success for something it never
        # established. FLUSHALL is NOT sufficient — it leaves FT indices
        # standing, which is exactly what `keyword_bm25` was passing on.
        run: bash scripts/ci/reset_moon.sh

      - name: Run lunaris-storage-moon tests with moon-it (including --ignored)
        # The backend's own live-Moon suite. Before 0.7.0 this ran only from a
        # developer's shell; with Postgres gone it is the deepest live coverage
        # the storage layer has, so CI owns it.
        #
        # W1.1 — `--include-ignored` is the half that makes
        # `grep -rn 'ignored' .github/workflows/` return something. Six tests
        # in `tests/list_scopes.rs` + `tests/scope_isolation.rs` carry
        # `#[ignore = "requires live Moon"]`; this job HAS a live Moon, so the
        # ignore was gating them out of the one place they can run. All six
        # verified green against a fresh Moon locally on 2026-08-21.
        #
        # The remaining workspace ignores stay ignored and are triaged in
        # ci.yml's `ignored_test_ratchet`: they need a GGUF, a tokenizer, a
        # release binary, or they pin a known Moon gap.
        if: success() || failure()
        run: |
          cargo test -p lunaris-storage-moon \
            --features moon-it \
            --no-fail-fast \
            -- --include-ignored

      - name: Reset Moon (fresh data dir)
        # F28: without this the next suite runs against whatever the previous
        # one left behind, and can report success for something it never
        # established. FLUSHALL is NOT sufficient — it leaves FT indices
        # standing, which is exactly what `keyword_bm25` was passing on.
        run: bash scripts/ci/reset_moon.sh

      - name: Run lunaris-recipes tests with moon-it
        # MOON_URL is set in the job env, so these run live. (This crate has no
        # skip sites of its own — checked 2026-08-21 while routing F10; the
        # earlier "probe_backend skip discipline" note here was stale.)
        # Separate step from lunaris-conformance so failures are independently
        # visible in the Actions UI.
        if: success() || failure()
        run: |
          cargo test -p lunaris-recipes \
            --features moon-it \
            --no-fail-fast

      - name: Reset Moon (fresh data dir)
        # F28: without this the next suite runs against whatever the previous
        # one left behind, and can report success for something it never
        # established. FLUSHALL is NOT sufficient — it leaves FT indices
        # standing, which is exactly what `keyword_bm25` was passing on.
        run: bash scripts/ci/reset_moon.sh

      - name: Run lunaris-ingest tests with moon-it
        # W4.8 — found by `gated_tests_have_a_runner`, not by eye. This crate's
        # `c_live_moon_embedding_kv_size.rs` is gated on `moon-it` exactly like
        # the three steps above, but no job ever passed the feature to
        # `-p lunaris-ingest`, so the file compiled to nothing and
        # `cargo test --workspace` reported green without it.
        #
        # What it proves is not incidental: the chunk bytes actually written to
        # Moon's HSET carry no `"embedding"` key — the byte-level proof that the
        # double-store fix survives the real ingest -> storage -> recall path,
        # as opposed to the in-process serde round-trip `lunaris-core` already
        # covers. The file even documents its own run command; nothing ran it.
        #
        # It reads bare `MOON_URL`, which this job's env sets alongside
        # `LUNARIS_MOON_URL`.
        if: success() || failure()
        run: |
          cargo test -p lunaris-ingest \
            --features moon-it \
            --no-fail-fast

      - name: Reset Moon (fresh data dir)
        # F28: without this the next suite runs against whatever the previous
        # one left behind, and can report success for something it never
        # established. FLUSHALL is NOT sufficient — it leaves FT indices
        # standing, which is exactly what `keyword_bm25` was passing on.
        run: bash scripts/ci/reset_moon.sh

      - name: Run lunaris-server live graph-mode test
        # F16 — this job is the only one with a Moon, and `-p lunaris-server`
        # was never in its scope. `recall_graph_mode_live.rs` needs a real
        # backend (its `live_engine` helper prints SKIP and returns when
        # `MOON_TEST_BINARY` is unset), so under `ci.yml`'s Moon-less
        # `--workspace` it would report green while asserting nothing — the
        # exact shape W4.8 and W4.14 were filed for.
        #
        # What it proves: a `mode=graph` recall over a corpus the test itself
        # seeds returns hits. All four tests in the sibling
        # `recall_graph_mode.rs` drive a mock and pin composition, so they
        # stayed green through three defects that together made the feature
        # incapable of returning a hit.
        #
        # `MOON_TEST_BINARY` is set in this job's env, which is what the
        # ephemeral-Moon harness this file uses reads.
        if: success() || failure()
        run: |
          cargo test -p lunaris-server \
            --test recall_graph_mode_live \
            --no-fail-fast

      - name: Reset Moon (fresh data dir)
        # F28: without this the next suite runs against whatever the previous
        # one left behind, and can report success for something it never
        # established. FLUSHALL is NOT sufficient — it leaves FT indices
        # standing, which is exactly what `keyword_bm25` was passing on.
        run: bash scripts/ci/reset_moon.sh

      - name: Run lunaris-memory umbrella live-Moon tests
        # W4.14 — `crates/lunaris/tests/moon_parity.rs` gates on
        # `LUNARIS_MOON_URL`, which this job's env sets, but `-p lunaris-memory`
        # (the umbrella crate's real package name — the directory is
        # `crates/lunaris`, the package is `lunaris-memory`) was
        # never in this job's scope. `ci.yml` runs it as part of `--workspace`
        # with no Moon anywhere, so the file's five tests printed
        # "skipping: LUNARIS_MOON_URL not set" on every run in every workflow.
        #
        # It carries the regression pins for the two defects that motivated it:
        # a fresh scope's FIRST recall (which used to error `unknown index`)
        # and memory-update convergence on the extraction path.
        #
        # Deliberately NOT `--all-targets`: this crate's unit tests are
        # `ci.yml`'s job. The `--test` filter keeps this step to the live
        # integration files and keeps the 8-minute budget intact.
        #
        # `phase_14_1_reflect_invalidate` added 2026-08-24 (F39). It had never
        # executed anywhere — its probe gave up on the first resolved address
        # (F37) — and the first time it ran it caught a real product bug:
        # Moon's `read_as_of` hydrated `Row.bt` from a hash field nothing
        # writes, which silently disabled `apply_reflect_invalidate`'s
        # idempotency guard. Fixing the probe without wiring the test in here
        # would put it straight back to never running.
        #
        # `chaos_helios_sigkill` runs in its OWN step below rather than in this
        # `--test` list — it SIGKILLs child processes, so it is isolated from
        # the suites here.
        if: success() || failure()
        run: |
          cargo test -p lunaris-memory \
            --test moon_parity \
            --test coding_session_memory_smoke \
            --test consolidator_scope_isolation \
            --test phase_14_1_reflect_invalidate \
            --no-fail-fast \
            -- --include-ignored

      - name: Reset Moon (fresh data dir)
        run: bash scripts/ci/reset_moon.sh

      - name: Run the SIGKILL chaos gate (zero orphans)
        # Parked since it was written, on a reason that is both wrong AND
        # incomplete. The `#[ignore]` read "50x2 SIGKILL live run — real
        # wall-clock cost is the blocker, not the environment ... deliberately
        # outside the 8-minute integration budget", and this workflow repeated
        # the claim.
        #
        # "not the environment" is the part that was flatly false: the FIRST CI
        # run of this step died in 0.01s with
        # `spawn chaos --profile helios child: NotFound` — the `chaos` driver
        # binary lives in `lunaris-bench` and nothing built it. So the real
        # blocker was an unbuilt fixture, and the reason blamed wall-clock. A
        # never-run test's documented requirements are themselves unverified;
        # the "Build the chaos driver binary" step above is the actual fix.
        #
        # The "8-minute budget" was never a cap — it is this job's OBSERVED
        # duration (7.8-8.7 min). The job carries `timeout-minutes: 25`, so
        # there is ~16 min of headroom. The "50x2" also predates the 0.7.0
        # Postgres deletion that removed the second backend, so the run is half
        # what the text assumed.
        #
        # Measured 2026-08-24, live Moon, debug profile:
        #
        #   50 iters (the default): 83 / 184 / 128 / 114 / 126 s  -> mean ~127s
        #   20 iters (wired here):   56 /  46 /  45 s             -> mean  ~49s
        #
        # Quote the spread, not the best sample: the first 50-iter run was 83s
        # and the next was 184s, so a single measurement would have understated
        # this by 2x. 20 iters is chosen because it is both cheaper AND far
        # tighter (45-56s), which matters more than the mean for a step sharing
        # a job budget. At a conservative 3x runner slowdown that is ~2.5 min,
        # putting the job around 11 min against the 25 min timeout.
        #
        # It earns that: this is the only test exercising the atomicity claim
        # under real process death — SIGKILL mid-flow, then assert zero orphaned
        # records. Everything else asserts the happy path. Halving iterations
        # halves the interleavings sampled PER RUN, but it now runs on every
        # integration build instead of never, so cumulative coverage goes from
        # zero to substantial.
        #
        # If a runner proves slower still, lower `LUNARIS_CHAOS_HELIOS_ITERS`
        # rather than re-parking: a reduced-iteration chaos run still detects a
        # non-atomic write, it just samples fewer interleavings.
        if: success() || failure()
        env:
          LUNARIS_CHAOS_HELIOS_ITERS: 20
        run: |
          cargo test -p lunaris-memory \
            --test chaos_helios_sigkill \
            --no-fail-fast \
            -- --include-ignored

      - name: Assert strict mode actually fires (F36)
        # Every existing strict guard is necessary and together they are
        # insufficient. F32's guard proves the flag is PARSED the same way
        # everywhere; the routing sweep proves each suite SENDS its skip
        # through the helper. Neither runs the one arm that discriminates a
        # working strict mode from a decorative one: **strict ON with the
        # fixture ABSENT**.
        #
        # This job structurally cannot run that arm inline — it sets
        # LUNARIS_CONFORMANCE_STRICT=1 *and* builds a Moon, so strict never
        # fires in the steps above. A suite whose helper call is unreachable is
        # green here, green in the sweep, and green in the flag guard, all at
        # once. That is exactly how F27's three half-routed files hid.
        #
        # So the script re-runs the same targets with MOON_URL unset and
        # MOON_TEST_BINARY pointed at nothing, and asserts each one FAILS.
        # Placed at the END of this job on purpose: every test binary is
        # already compiled by the steps above, so the marginal cost is a few
        # seconds of re-running them, not a rebuild.
        #
        # Verified locally 2026-08-24: all 10 targets fail as required, and the
        # guard was mutation-tested by adding a target known to pass — it goes
        # red with "strict mode is DECORATIVE for this target".
        if: success() || failure()
        run: bash scripts/ci/assert-strict-fires.sh

      - name: Timing summary (budget evidence)
        # Runs unconditionally so budget data is captured even on test failure.
        # SECONDS is the bash shell-init wall-clock counter; per-step SECONDS
        # resets on each new shell, so this captures step-wall-clock. The
        # authoritative p50 comes from the GHA API job-level wall-clock.
        if: always()
        env:
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          MOON_SHA: ${{ steps.moon-sha.outputs.sha }}
        run: |
          WALL_CLOCK="${SECONDS}"
          {
            echo "## integration timing"
            echo ""
            echo "- wall_clock_seconds: ${WALL_CLOCK}"
            echo "- sha: ${RUN_SHA}"
            echo "- run_id: ${RUN_ID}"
            echo "- moon_sha: ${MOON_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"job":"integration","wall_clock_seconds":%d,"sha":"%s","run_id":"%s","moon_sha":"%s"}\n' \
            "${WALL_CLOCK}" "${RUN_SHA}" "${RUN_ID}" "${MOON_SHA}" > timing.json
          cat timing.json

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-timing-${{ github.run_id }}
          path: timing.json

      - name: Budget gate (soft-fail)
        # Reads wall_clock_seconds from the timing.json the previous step wrote
        # and classifies against the 480s (8-min) target. SOFT-FAIL: a blown
        # budget triggers a runbook, not a red PR. The step always exits 0 —
        # classification lives in the job summary + a single structured JSON
        # line on stdout for future log aggregation.
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f timing.json ]; then
            echo '{"budget_gate":"UNKNOWN","wall_clock_seconds":0,"target_seconds":480,"reason":"timing.json missing"}'
            echo "## Budget gate: UNKNOWN (timing.json missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          WALL=$(jq -r '.wall_clock_seconds // 0' timing.json)
          if [ "$WALL" -le 480 ]; then
            STATUS="PASS"
          elif [ "$WALL" -le 600 ]; then
            STATUS="WARN"
          else
            STATUS="BREACH"
          fi
          printf '{"budget_gate":"%s","wall_clock_seconds":%s,"target_seconds":480}\n' "$STATUS" "$WALL"
          {
            echo "## Budget gate: ${STATUS}"
            echo ""
            echo "- wall_clock_seconds: ${WALL}"
            echo "- target_seconds: 480 (8 min)"
            echo "- classification: PASS <= 480, WARN 481-600, BREACH > 600"
            echo "- soft-fail: this gate never blocks the PR"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dump Moon logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/moon.log" ]; then
            echo "--- moon.log ---"
            cat "$RUNNER_TEMP/moon.log"
          else
            echo "moon logs unavailable (no $RUNNER_TEMP/moon.log)"
          fi

      - name: Tear down Moon process
        if: always()
        run: |
          if [ -n "${MOON_PID:-}" ]; then
            kill "$MOON_PID" 2>/dev/null || true
            echo "Killed Moon PID $MOON_PID"
          fi
