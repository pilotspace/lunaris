name: mcp-prebuild

# Builds the lunaris-mcp native binary for all 5 target triples.
# Produces lunaris-mcp-<target>.tar.gz artifacts per platform.
# Tag-gated job: populates manifest.json sha256 hashes, uploads tarballs to GitHub Release,
# then publishes @pilotspace/lunaris-mcp to npm (Strategy B — no commit-back, no force-push).
# A separate build-wheel job (added by Phase 26 Plan 26-02) wraps the
# prebuilt binary in platform-tagged Python wheels.
#
# Triggers mirror ts-prebuild.yml / python-prebuild.yml:
#   - pull_request touching crates/lunaris-mcp/** or workflow file
#   - push to main on the same paths
#   - push with v* tag (triggers upload-binary-release)
#   - workflow_dispatch for preview builds
#
# fail-fast: false — per Phase 8 risk-register row 2. A failing arch
# demotes to "source install supported" rather than blocking the release.
#
# All run: steps use static strings / CI-controlled matrix values only.
# No untrusted user input (PR body / commit message) flows into commands.

# PR-time removed 2026-08-18 (CI diet) — see ts-prebuild.yml; local-ci.sh
# `full` covers PR-time MCP build/tests, main-push/tag runs keep release truth.
on:
  push:
    branches: [main]
    paths:
      - "crates/lunaris-mcp/**"
      - "crates/lunaris-mcp-npm/**"
      - "crates/lunaris-mcp-py/**"
      - ".github/workflows/mcp-prebuild.yml"
      - "Cargo.toml"
      - "Cargo.lock"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required for softprops/action-gh-release on tag push

jobs:
  build-binary:
    name: binary ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # vendor/moon only — the moondb path dep (vendor/moon/sdk/rust) is
      # required for cargo to resolve the workspace graph. .planning is
      # private (cross-repo auth) and must NOT be pulled here.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon
      - uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-${{ matrix.target }}
      - name: Install cross-compilation toolchain (aarch64 Linux)
        if: matrix.cross == true && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # g++ cross REQUIRED since the llama.cpp-only cutover: the default
          # `llamacpp` feature compiles llama.cpp (C++ via cmake) — a
          # C-only cross toolchain dies at the first .cpp file.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # rust-toolchain.toml (channel "1.94") overrides the toolchain the
          # dtolnay action installed targets into (exact "1.94.1" — a
          # DIFFERENT rustup toolchain dir), so the cross std landed in the
          # wrong toolchain and cargo failed with E0463 "can't find crate
          # for `core`". Add the target to the ACTIVE (override-resolved)
          # toolchain.
          rustup target add aarch64-unknown-linux-gnu
          # No .cargo/config.toml in-repo: point cargo, cc-rs, and cmake-rs
          # at the cross linker / compilers / archiver for C and C++ deps
          # (aws-lc-sys, llama-cpp-sys-2). cmake-rs reads the same
          # CC_/CXX_<target> vars and forwards them as
          # -DCMAKE_{C,CXX}_COMPILER to the llama.cpp configure step.
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - name: Build lunaris-mcp release binary
        run: cargo build --release -p lunaris-mcp --target ${{ matrix.target }}
      - name: Check binary size
        # `lunaris-mcp` is one of the two binaries users actually download
        # (npx / uvx), and until now NOTHING gated its size. The repo's only
        # size gate (`crates/lunaris-bench/tests/binary_size_gate.rs`) guards
        # `lunaris-server`, which no workflow builds in release and which is
        # not a shipped artifact — and that gate had itself never run, because
        # its `ci-perf-gates` feature is enabled by no workflow.
        #
        # The ceiling is deliberately generous. Binary size is
        # platform-dependent and the only measurement available when this
        # landed was macOS arm64 from one machine (14.73 MiB). Setting a tight
        # ceiling from one host on one OS is the same single-sample error this
        # repo has been burned by twice. The script ALWAYS reports the measured
        # size into the job summary, so a real cross-platform baseline
        # accumulates from these runs — tighten from that data, not a laptop.
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IS_WINDOWS: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          OUTDIR="target/${MATRIX_TARGET}/release"
          if [[ "${IS_WINDOWS}" == "true" ]]; then
            BINARY="${OUTDIR}/lunaris-mcp.exe"
          else
            BINARY="${OUTDIR}/lunaris-mcp"
          fi
          python3 scripts/check-binary-size.py "${BINARY}" 40 "lunaris-mcp (${MATRIX_TARGET})"

      - name: Package binary into tarball
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IS_WINDOWS: ${{ runner.os == 'Windows' }}
        run: |
          OUTDIR="target/${MATRIX_TARGET}/release"
          if [[ "${IS_WINDOWS}" == "true" ]]; then
            BINARY="${OUTDIR}/lunaris-mcp.exe"
          else
            BINARY="${OUTDIR}/lunaris-mcp"
          fi
          TARBALL="lunaris-mcp-${MATRIX_TARGET}.tar.gz"
          tar czf "${TARBALL}" -C "${OUTDIR}" "$(basename "${BINARY}")"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-mcp-${{ matrix.target }}
          path: lunaris-mcp-${{ matrix.target }}.tar.gz
          retention-days: 30

  upload-binary-release:
    name: attach binary tarballs to GitHub Release
    runs-on: ubuntu-latest
    needs: build-binary
    # `!cancelled()` is what makes `fail-fast: false` above mean anything.
    #
    # Default `needs:` semantics skip a dependent job unless EVERY matrix leg
    # of the needed job succeeded. `fail-fast: false` therefore bought nothing
    # on a tag: it let the other four legs finish, then the aggregate
    # build-binary result went "failure" and this job — plus build-wheel —
    # was SKIPPED wholesale. That is not a hypothetical: the v0.6.0-rc.1 tag
    # run (29399540377) built 4/5 targets fine and lost the entire MCP
    # distribution because x86_64-pc-windows-msvc failed to compile
    # (E0432, unresolved import tokio::net::UnixStream). v0.6.0-rc.1 has
    # Python wheels and .node binaries attached but ZERO
    # lunaris-mcp-*.tar.gz, and @pilotspace/lunaris-mcp is still stuck at
    # 0.3.0 on npm.
    #
    # With `!cancelled()` this job runs on partial builds, ships what exists
    # (the risk-register "source install supported" demotion), and the final
    # completeness gate below still marks the run RED so the gap is loud.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunaris-mcp-*
          path: release-assets
          merge-multiple: true

      # Records which of the five targets actually produced a tarball. This
      # step never fails — the release assets and the npm package should still
      # ship for the platforms that DID build. The hard failure is the last
      # step of the job, so an incomplete distribution is both published and
      # unmistakably red.
      - name: Determine target completeness
        id: completeness
        run: |
          set -euo pipefail
          missing=""
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-apple-darwin aarch64-apple-darwin \
                   x86_64-pc-windows-msvc; do
            if [ -f "release-assets/lunaris-mcp-${t}.tar.gz" ]; then
              echo "ok:      lunaris-mcp-${t}.tar.gz"
            else
              echo "MISSING: lunaris-mcp-${t}.tar.gz"
              missing="${missing} ${t}"
            fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - name: Populate manifest.json with real sha256 hashes
        run: |
          cd release-assets
          {
            echo "{"
            first=true
            for f in *.tar.gz; do
              if [ "$first" = "true" ]; then first=false; else echo ","; fi
              hash=$(sha256sum "$f" | awk '{print $1}')
              printf '  "%s": "%s"' "$f" "$hash"
            done
            echo
            echo "}"
          } > "${GITHUB_WORKSPACE}/crates/lunaris-mcp-npm/manifest.json"
          cat "${GITHUB_WORKSPACE}/crates/lunaris-mcp-npm/manifest.json"

      - name: Upload binary tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          fail_on_unmatched_files: true

      - name: Publish @pilotspace/lunaris-mcp to npm
        # Strategy B (default, safer): publish from CI with populated manifest.json.
        # No commit-back, no force-push to the release tag.
        # The manifest.json that ships in the published npm tarball contains the real
        # sha256 hashes; the repo's committed manifest.json stays as placeholders
        # (the source of truth for the tag is the npm registry artifact, not the repo tree).
        #
        # Strategy A (NOT recommended): commit manifest.json back to main then force-push
        # the release tag to include the hash commit. This breaks downstream consumers that
        # pin to v<version> because the tag moves to a new commit. Only consider Strategy A
        # if your npm-publish path is unavailable AND your org has a release-tag governance
        # policy that explicitly permits force-pushes. To switch, remove this step and add
        # a "Commit manifest.json back to main and re-tag" step instead.
        working-directory: crates/lunaris-mcp-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # The version field in package.json is already correct per the release commit.
          # The manifest.json on disk now has real hashes (previous step).
          npm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          # Pre-release versions (e.g. 0.6.0-rc.1) route to the 'next' dist-tag
          # so `npx @pilotspace/lunaris-mcp` / `npm i` never default to an RC.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *)   DIST_TAG="latest" ;;
          esac
          # Re-runnable WITHOUT a `|| true` fallback: skip only on proof the
          # exact version is already on the registry. Any other failure (E404
          # = token cannot write the @pilotspace scope, E403, auth, network)
          # fails the job. Mirrors the ts-prebuild.yml contract.
          if npm view "@pilotspace/lunaris-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "skip: @pilotspace/lunaris-mcp@${VERSION} is already on the registry"
            exit 0
          fi
          echo "publishing @pilotspace/lunaris-mcp@$VERSION under dist-tag '$DIST_TAG'"
          npm publish --access public --tag "$DIST_TAG"

      # LAST step on purpose: the assets are attached and the npm package is
      # published for every target that built, and only then does an
      # incomplete target set turn the run red. Skipping the dependent jobs
      # (the pre-0.6.1 behaviour) delivered nothing AND buried the reason.
      #
      # `!cancelled()` (not the default success-gate) because being last means
      # every earlier step can suppress this one: on the v0.7.0 tag the npm
      # publish failed on the #135 token block and this guard was SKIPPED, so
      # the run said nothing about whether all five targets reached the
      # release. Publishing first must not cost us the completeness signal —
      # a failed publish is exactly when you want to know what shipped.
      - name: Fail the run if any target is missing from the release
        if: ${{ !cancelled() && steps.completeness.outputs.missing != '' }}
        env:
          MISSING_TARGETS: ${{ steps.completeness.outputs.missing }}
        run: |
          set -euo pipefail
          echo "::error::lunaris-mcp release is incomplete — no binary for: ${MISSING_TARGETS}"
          echo "Assets and the npm package were published for the targets that built."
          echo "Users on the missing targets fall back to a source build."
          exit 1

  build-wheel:
    name: wheel ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-binary
    # Same `needs:`-skip trap as upload-binary-release: one failing
    # build-binary leg used to skip ALL FIVE wheels. Per-target artifacts
    # mean each wheel leg stands or falls on its own — the leg whose binary
    # is missing fails at "Download binary artifact for this target" (loudly,
    # in its own matrix cell) and the other four still ship.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat_tag: manylinux_2_28_x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            plat_tag: manylinux_2_28_aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            plat_tag: macosx_12_0_x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            plat_tag: macosx_12_0_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat_tag: win_amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wheel tooling
        # pytest: the "Run wheel structure test" step below invokes
        # `python -m pytest` on the installed wheel.
        run: pip install hatchling build wheel maturin pytest
      - name: Download binary artifact for this target
        uses: actions/download-artifact@v4
        with:
          name: lunaris-mcp-${{ matrix.target }}
          path: binary-artifact
      - name: Stage binary into wheel source tree
        shell: bash
        env:
          IS_WINDOWS: ${{ runner.os == 'Windows' }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p crates/lunaris-mcp-py/python/lunaris_mcp/bin
          tar xzf "binary-artifact/lunaris-mcp-${MATRIX_TARGET}.tar.gz" \
            -C crates/lunaris-mcp-py/python/lunaris_mcp/bin
          if [[ "${IS_WINDOWS}" != "true" ]]; then
            chmod +x crates/lunaris-mcp-py/python/lunaris_mcp/bin/lunaris-mcp
          fi
      - name: Build platform-tagged wheel
        shell: bash
        env:
          PLAT_TAG: ${{ matrix.plat_tag }}
        working-directory: crates/lunaris-mcp-py
        run: |
          python -m build --wheel --outdir dist
          # Apply the correct platform tag (hatchling produces a generic tag;
          # retagging makes pip / uv resolve the right wheel per platform).
          python -m wheel tags \
            --platform-tag "${PLAT_TAG}" \
            --remove \
            dist/*.whl
      - name: Run wheel structure test
        # Skipped for the cross-built aarch64 wheel: pip on the x86_64
        # runner refuses to install a manylinux_*_aarch64 wheel ("not a
        # supported wheel on this platform"), by design. The four native
        # legs cover the structure test; the aarch64 wheel shares the same
        # build path and differs only in the staged binary + platform tag.
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        working-directory: crates/lunaris-mcp-py
        run: |
          pip install dist/*.whl --force-reinstall --quiet
          python -m pytest tests/test_wheel_structure.py -v
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-mcp-wheel-${{ matrix.target }}
          path: crates/lunaris-mcp-py/dist/*.whl
          retention-days: 30
      - name: Upload wheel to PyPI (tag-gated)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        # --skip-existing: lunaris-mcp 0.3.0 wheels are already live on PyPI
        # from the first tag run; a retag / re-run must not 400 on the
        # duplicate upload.
        run: maturin upload --non-interactive --skip-existing crates/lunaris-mcp-py/dist/*.whl
