name: perf-gates
# O-03-B — per-hardware perf-contract gates from
# .planning/milestones/v0.4-NATIVE-SINGLE-BACKEND/HARDWARE-OPTIMIZATION-ROADMAP.md
#
# Runs `cargo bench --features <device> --bench per_device -- --baseline v0.4-O01`
# on the matrix of hardware targets, then invokes `perf-gate-check` to fail
# the matrix cell if any bench regressed >5% vs the saved baseline.
#
# Self-hosted runner labels (`self-hosted, macos, arm64, metal` etc.) are
# operator-provisioned — see `docs/runbooks/v0.4-self-hosted-runners.md`.
# Until the operator sets the `PERF_SELFHOSTED_READY` repo variable to
# 'true', the self-hosted cells are EXCLUDED from the matrix: a queued
# self-hosted job with no registered runner never hits `timeout-minutes`
# (that clock only starts once a runner picks it up), so leaving the cells
# in would wedge the whole run in `queued` and `perf-gates-summary` would
# never report. The GitHub-managed cells always run and gate.
#
# Security note: every `run:` block in this workflow consumes only static
# matrix values + repo-owned secrets. No PR-supplied strings
# (issue/PR title/body, head_ref, commit messages) are interpolated into
# shell — see GH workflow-injection guidance. Matrix labels are fixed in
# this file, not from event payload.
#
# This workflow is NOT marked `required` in branch protection until the
# operator has confirmed all four runners are healthy. See the runbook
# §6 for the flip procedure.

on:
  pull_request:
    # Initial-landing gate: only run when explicitly labelled, so we don't
    # red-box every PR while self-hosted runners are still being provisioned.
    # Remove the `types` + label gate once the runner fleet is healthy and
    # the operator promotes this workflow to `required`.
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:
  push:
    branches: [main]

# Cancel superseded runs on the same PR — perf jobs are minutes-long; no
# point burning runner time on a stale commit.
concurrency:
  group: perf-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Assemble the perf matrix. The two GitHub-managed cells (x86_64+MKL,
  # aarch64+NEON) always run and gate. The two self-hosted cells
  # (apple-metal, cuda-sm80) are appended ONLY when the operator has set the
  # `PERF_SELFHOSTED_READY` repo variable to 'true' (runbook §6) — otherwise
  # they would queue forever and wedge the run (see the header note).
  prepare:
    name: prepare-matrix
    # Skip on PR unless the `perf-bench` label is present. Always run on
    # push to main and on manual dispatch.
    if: >
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'perf-bench')
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set.outputs.hosts }}
    steps:
      - name: Assemble host matrix
        id: set
        env:
          # Repo variable, operator-controlled — not event-derived input.
          SELFHOSTED_READY: ${{ vars.PERF_SELFHOSTED_READY }}
        run: |
          set -euo pipefail
          gh_cells='[
            {"label":"cpu-x86_64-mkl","runs-on":"ubuntu-latest","feature":"cpu-mkl","gate-row":"x86_64 + MKL — embed p50 ≤ 40 ms / p99 ≤ 90 ms / rerank p50 ≤ 300 ms"},
            {"label":"cpu-aarch64-neon","runs-on":"ubuntu-22.04-arm","feature":"per-device-bench","gate-row":"aarch64 + NEON — embed p50 ≤ 80 ms / p99 ≤ 200 ms / rerank p50 ≤ 600 ms"}
          ]'
          self_cells='[
            {"label":"apple-metal","runs-on":["self-hosted","macos","arm64","metal"],"feature":"metal","gate-row":"Apple Silicon (Metal) — embed p50 ≤ 5 ms / p99 ≤ 15 ms / rerank p50 ≤ 40 ms"},
            {"label":"cuda-sm80","runs-on":["self-hosted","linux","x86_64","cuda"],"feature":"cuda","gate-row":"NVIDIA sm_80+ (CUDA) — embed p50 ≤ 3 ms / p99 ≤ 10 ms / rerank p50 ≤ 25 ms"}
          ]'
          if [ "${SELFHOSTED_READY:-}" = "true" ]; then
            hosts=$(jq -cn --argjson a "$gh_cells" --argjson b "$self_cells" '$a + $b')
          else
            echo "::notice::PERF_SELFHOSTED_READY != 'true' — self-hosted perf cells excluded (runbook §6); GitHub-managed cells still gate."
            hosts=$(jq -cn --argjson a "$gh_cells" '$a')
          fi
          echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"

  perf:
    needs: prepare
    name: ${{ matrix.host.label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    runs-on: ${{ matrix.host.runs-on }}
    env:
      MATRIX_LABEL: ${{ matrix.host.label }}
      MATRIX_FEATURE: ${{ matrix.host.feature }}
      MATRIX_GATE_ROW: ${{ matrix.host.gate-row }}
    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        # The `moondb` path dep (vendor/moon/sdk/rust) is required for cargo
        # to resolve lunaris-storage-moon; without it the build fails before
        # any bench runs (RUSTSEC-free, real build-break). Non-recursive:
        # vendor/moon has its own nested .planning submodule the
        # GITHUB_TOKEN cannot clone.
        run: git submodule update --init vendor/moon

      - name: Print gate row
        run: |
          echo "::notice::Perf gate for matrix cell '${MATRIX_LABEL}': ${MATRIX_GATE_ROW}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: perf-gates-${{ matrix.host.label }}

      # Models stager — skipped with annotation if the operator hasn't
      # provisioned the HF cache key yet. We do NOT fail the matrix cell
      # on missing weights; that's an infra issue, not a perf regression.
      - name: Stage model weights
        id: stage-models
        env:
          LUNARIS_STAGE_MODELS_KEY: ${{ secrets.LUNARIS_STAGE_MODELS_KEY }}
        run: |
          set -e
          if [ -z "${LUNARIS_STAGE_MODELS_KEY:-}" ]; then
            echo "::warning::LUNARIS_STAGE_MODELS_KEY not set — skipping stage-models; per_device bench will skip with 'weights env vars unset' notice."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/lunaris-models"
          HF_TOKEN="$LUNARIS_STAGE_MODELS_KEY" \
          cargo run --release -p lunaris-bench --bin stage-models -- \
              --cache-dir "$RUNNER_TEMP/lunaris-models"
          {
            echo "GRANITE_R2_WEIGHTS_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/model.safetensors"
            echo "GRANITE_R2_TOKENIZER_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/tokenizer.json"
            echo "GRANITE_R2_CONFIG_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/config.json"
            echo "BGE_RERANKER_WEIGHTS_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/model.safetensors"
            echo "BGE_RERANKER_TOKENIZER_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/tokenizer.json"
            echo "BGE_RERANKER_CONFIG_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/config.json"
          } >> "$GITHUB_ENV"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # Fetch the blessed baseline produced by `perf-baseline-save.yml`.
      # The baseline artifact name encodes the matrix cell so each host
      # gets its own saved baseline (Criterion's `--baseline` lookup is
      # per-bench-group on-disk).
      - name: Restore saved baseline
        id: restore-baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: perf-baseline-v0.4-O01-${{ matrix.host.label }}
          path: target/criterion/

      - name: Run per-device bench
        env:
          CRITERION_HOME: target/criterion
        run: |
          set -e
          BASELINE_NAME="v0.4-O01-${MATRIX_LABEL}"
          if [ -d target/criterion ] && [ -n "$(find target/criterion -name 'estimates.json' -path "*/${BASELINE_NAME}/*" -print -quit 2>/dev/null)" ]; then
            echo "::notice::Found saved baseline '${BASELINE_NAME}' — running comparison."
            cargo bench --features "${MATRIX_FEATURE}" \
                -p lunaris-bench --bench per_device -- \
                --baseline "${BASELINE_NAME}"
          else
            echo "::warning::No saved baseline for ${MATRIX_LABEL} — capturing current run as baseline (no regression check this run)."
            cargo bench --features "${MATRIX_FEATURE}" \
                -p lunaris-bench --bench per_device -- \
                --save-baseline "${BASELINE_NAME}"
          fi

      - name: Enforce 5% regression cliff
        # Only fails when we actually compared against a baseline. On a
        # first-run-on-new-host (no `change/` files), the gate is vacuously
        # green by design.
        run: |
          cargo run --release -p lunaris-bench --bin perf-gate-check -- \
              --criterion-dir target/criterion \
              --threshold 0.05

      # Always upload the Criterion output for forensics — even on
      # regression. The artifact retention is short (14 days) since the
      # baseline-save workflow is the durable record of blessed numbers.
      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ matrix.host.label }}-${{ github.run_id }}
          path: target/criterion/
          retention-days: 14
          if-no-files-found: warn

  # Synthetic check that gathers the matrix result into a single status —
  # this is the name the operator should set as the branch-protection
  # required-check (once all four runners are healthy). Until then, leave
  # it advisory.
  perf-gates-summary:
    name: perf-gates-summary
    needs: perf
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compute matrix result
        env:
          PERF_RESULT: ${{ needs.perf.result }}
        run: |
          # success → every dispatched cell passed (or captured a fresh
          #           baseline, no regression check this run).
          # skipped → the matrix was gated off (unlabelled PR, or no
          #           eligible cells) — nothing to gate, not a regression.
          # else    → a cell regressed >5% or failed to build/run; gate.
          case "${PERF_RESULT}" in
            success)
              echo "All perf-gates matrix cells green." ;;
            skipped)
              echo "::notice::perf-gates matrix skipped — nothing to gate." ;;
            *)
              echo "::error::perf-gates matrix result='${PERF_RESULT}' — a cell regressed or failed; see job logs."
              exit 1 ;;
          esac
