# Plan 05-06 EVAL-08 — eval gauntlet CI workflow.
#
# Triggered on `push` to `main` AND `pull_request`. Provisions Moon +
# Postgres via Docker service containers, builds the release lunaris-evals
# binary, runs `lunaris-evals all`, uploads the eval-results.json artifact,
# and gates merge on `"status":"FAIL"` per CONTEXT.md D-22.
#
# Soft-fail discipline (CONTEXT.md D-21): `"status":"SKIPPED"` does NOT
# block merge — only `"status":"FAIL"` triggers the gate command. Datasets
# that fail to download (HF rate limit, network outage) emit SKIPPED rows
# so a transient hiccup doesn't false-fail PRs.
#
# ## Security posture
#
# - No `run:` step interpolates untrusted user input (no github.event.*
#   issue/PR/commit-message refs). All `${{ ... }}` expansions are limited
#   to runner-provided paths (runner.temp) and Cargo.lock hashFiles.
# - Backends run in service containers on the runner — no remote network
#   access to a managed Lunaris cluster.
#
# ## Docker image notes (PATTERNS.md B-NOTE)
#
# `moondb/moon:latest` MAY not be published on Docker Hub. If the workflow
# fails at the service-startup step, fall back to building from a sibling
# `moon` repo checkout step (operator runbook). This workflow assumes the
# image is published; verify at first-run and adjust per the B-NOTE comment.

name: Eval Gauntlet
on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval-gauntlet:
    runs-on: ubuntu-latest
    # Per CONTEXT.md latency budget: eval-all <= 30 min target + safety margin.
    timeout-minutes: 60

    services:
      # Moon container exposes the Redis-compatible RESP protocol on port
      # 6390. Lunaris::open dispatches on URL scheme — `moon://` routes to
      # MoonStorage (W-8 fix: NOT `redis://`).
      moon:
        image: moondb/moon:latest
        ports:
          - '6390:6390'
      postgres:
        image: postgres:16
        ports:
          - '5432:5432'
        env:
          POSTGRES_PASSWORD: lunaris
          POSTGRES_DB: lunaris
          POSTGRES_USER: lunaris

    env:
      # W-8 fix verbatim: canonical URL scheme per Plan 05-01 D-01 +
      # Lunaris::open URL routing is `moon://` (NOT `redis://`). The Moon
      # container exposes the RESP protocol on port 6390, but Lunaris::open
      # dispatches on the URL scheme — `moon://` is the prefix that routes
      # to MoonStorage. probe_backend (Plan 05-02) strips both `moon://`
      # and `redis://` for raw TCP probe purposes; that's a separate code
      # path from URL routing.
      MOON_URL: moon://localhost:6390
      PG_URL: postgres://lunaris:lunaris@localhost/lunaris
      LUNARIS_EVAL_CACHE_DIR: ${{ runner.temp }}/lunaris-eval-cache

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Cache eval datasets (HF download cache)
        uses: actions/cache@v4
        with:
          path: ${{ env.LUNARIS_EVAL_CACHE_DIR }}
          # Cargo.lock as the cache key proxy — when deps change, dataset
          # paths inside hf-hub MAY shift between revisions; keying off
          # Cargo.lock is conservative + cheap.
          key: lunaris-eval-cache-${{ hashFiles('Cargo.lock') }}

      - name: Wait for Moon + Postgres backends
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/6390) >/dev/null 2>&1 && \
               (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "moon + postgres reachable after $i attempts"
              exit 0
            fi
            echo "waiting for moon (6390) + postgres (5432) ($i/30)..."
            sleep 2
          done
          echo "ERROR: backends not reachable after 60s"
          exit 1

      - name: Build lunaris-evals (release)
        run: cargo build --release --bin lunaris-evals

      - name: Run eval gauntlet (cargo run --release lunaris-evals all)
        run: cargo run --release --bin lunaris-evals -- all --output eval-results.json

      - name: Upload eval-results.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json

      - name: Gate merge on status FAIL
        # CI greps for FAIL rows. Soft-fail (SKIPPED) does NOT block merge
        # per CONTEXT.md D-21. The single-line shell test is the exact gate
        # command from the plan body Step 3.5.
        run: '! grep -q ''"status":"FAIL"'' eval-results.json'
