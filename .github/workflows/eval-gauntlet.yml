# Plan 05-06 EVAL-08 — eval gauntlet CI workflow.
#
# Runs on the self-hosted `llm-weights-cached` runner (same pool as
# llm-gates.yml) because real LongMemEval / LoCoMo / ER-F1 numbers need cached
# model weights + a live Moon backend — neither exists on a stock GitHub runner.
# Moon is built from the `vendor/moon` submodule and launched manually (the
# integration.yml pattern), NOT pulled as a container image: `moondb/moon` is
# not published, so a container-image dependency would make this job a phantom
# that can never produce numbers.
#
# Soft-fail discipline (CONTEXT.md D-21): `"status":"SKIPPED"` does NOT block
# merge — only `"status":"FAIL"` triggers the gate. On a runner without cached
# weights (e.g. the Gemma secret is empty), the extractor/recall harnesses emit
# SKIPPED rows and the gate stays green; real numbers populate at HUMAN-UAT on
# a fully-provisioned weights-cached runner.
#
# ## Security posture
#
# - No `run:` step interpolates untrusted user input (no github.event.* refs).
#   `${{ ... }}` expansions are limited to $RUNNER_TEMP (exported from a step,
#   see STARTUP-01 below), Cargo.lock hashFiles, repository secrets/variables,
#   and the boolean `inputs.force` dispatch input. Values that do reach a
#   shell are passed via `env:` and dereferenced as quoted "$VAR", never
#   interpolated into the script body.
# - Moon runs locally on the runner (port 6390) — no remote network access to a
#   managed Lunaris cluster.
#
# ## STARTUP-01 — why this file produced 200 consecutive startup failures
#
# From its first commit (4638a5c) until 2026-08-15 this workflow NEVER ran a
# single step: 200/200 recorded runs were `conclusion=failure` with an empty
# `jobs` array, and `gh api /actions/workflows` listed its name as
# `.github/workflows/eval-gauntlet.yml` — GitHub never even read the `name:`
# key. The cause was one line in the JOB-LEVEL `env:` map:
#
#     LUNARIS_EVAL_CACHE_DIR: ${{ runner.temp }}/lunaris-eval-cache
#
# `jobs.<job_id>.env` is expanded by the Actions service BEFORE a runner is
# assigned, so only github / inputs / matrix / needs / secrets / strategy /
# vars resolve there. `runner.*` is a hard validation error and GitHub rejects
# the ENTIRE file — which is also why push events kept minting failed runs
# after the workflow went dispatch-only: the triggers were never parsed either.
#
# Do not reintroduce a runner-side context (runner/env/steps/job) in a
# job-level `env:` block. Pinned by
# crates/lunaris-bench/tests/eval_workflow_guard.rs
# (gauntlet_workflow_job_env_uses_no_runner_side_context), which runs on every
# push via ci.yml's `cargo test --workspace --all-targets`.
#
# Lint locally with:  actionlint .github/workflows/eval-gauntlet.yml

name: Eval Gauntlet
# DISPATCH-ONLY since 2026-07-17: the repo has zero registered self-hosted
# runners — the `llm-weights-cached` pool's only other consumer
# (llm-gates.yml) was deleted in the candle cutover (3856bbb). (b8601cc
# blamed the empty pool for the red-on-every-push noise; that diagnosis was
# wrong — see STARTUP-01 above — but dispatch-only is still the right posture
# while the pool is empty.) Restore the
#   push: {branches: [main]} / pull_request:
# triggers when a weights-cached runner is registered again, and flip the
# pinned assertions in crates/lunaris-bench/tests/eval_workflow_guard.rs
# (gauntlet_workflow_is_dispatch_only_while_runner_pool_is_empty).
on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Dispatch the heavy gauntlet even when the preflight cannot confirm a
          weights-cached runner. The job will sit queued until one picks it up.
        type: boolean
        default: false

concurrency:
  group: eval-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, ALWAYS-schedulable preflight on a stock GitHub runner.
  #
  # The gauntlet proper can only run on a weights-cached self-hosted host, and
  # this repo currently has zero registered runners
  # (`gh api /repos/{owner}/{repo}/actions/runners` -> total_count: 0). A
  # workflow whose only job targets an empty pool dies INVISIBLY — it sits
  # queued with no annotation and no artifact until GitHub reaps it. This job
  # exists so a dispatch always produces a visible verdict: either the gauntlet
  # is dispatched, or the skip is announced with its reason.
  #
  # It deliberately installs no toolchain and builds nothing — it must stay
  # fast enough that it is never the thing anyone waits on.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (cheap wiring checks + explicit skip decision)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}

    steps:
      - name: Checkout (no submodules — nothing here needs vendor/moon)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate the gauntlet's own wiring
        # Catches the rot that would otherwise only surface ~80 minutes into
        # the heavy job, on a runner nobody is watching.
        run: |
          set -uo pipefail
          fail=0

          # The gate shells out to `--bin lunaris-evals`.
          if ! grep -q 'name *= *"lunaris-evals"' crates/lunaris-bench/Cargo.toml; then
            echo "::error::crates/lunaris-bench/Cargo.toml no longer declares the [[bin]] lunaris-evals target that this gate runs"
            fail=1
          fi

          # Moon is built from the submodule, not pulled as an image.
          if ! grep -q 'path *= *vendor/moon' .gitmodules; then
            echo "::error::.gitmodules no longer registers vendor/moon — the Moon build step cannot work"
            fail=1
          fi

          # 3af5a4d lesson: this gate once silently measured the easy
          # `longmemeval_oracle` haystack with vector-only retrieval. Keep the
          # real dataset + production retrieval shape pinned.
          #
          # The patterns are anchored to the 6-space job-level `env:` indent on
          # purpose — an unanchored grep would match this very script and make
          # the check vacuous.
          for pin in 'LUNARIS_EVAL_LME_DATASET: longmemeval_s' \
                     'LUNARIS_EVAL_LME_HYBRID: "1"' \
                     'LUNARIS_EVAL_LME_ADAPTIVE: "1"' \
                     'LUNARIS_EVAL_LME_RERANK: "1"'; do
            if ! grep -qxF "      $pin" .github/workflows/eval-gauntlet.yml; then
              echo "::error::eval-gauntlet.yml lost its job-level pin '$pin' — the gate would measure a weaker config than docs/benchmarks/ claims"
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "::notice::eval gauntlet preflight: wiring OK (lunaris-evals bin, vendor/moon submodule, LongMemEval config pins all present)"
          fi
          exit "$fail"

      - name: Decide whether the weights-cached pool can serve this run
        id: decide
        env:
          # Repository variable, flipped by an operator once a
          # [self-hosted, llm-weights-cached] runner is registered:
          #   Settings -> Secrets and variables -> Actions -> Variables
          # GITHUB_TOKEN cannot list self-hosted runners (needs admin scope),
          # so an explicit operator-owned switch is the honest signal here.
          RUNNER_POOL_READY: ${{ vars.EVAL_GAUNTLET_RUNNER_READY }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "::notice::eval gauntlet dispatched: force=true. The job will stay queued until a [self-hosted, llm-weights-cached] runner picks it up."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Gauntlet dispatched (force=true)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RUNNER_POOL_READY" = "true" ]; then
            echo "::notice::eval gauntlet dispatched: repository variable EVAL_GAUNTLET_RUNNER_READY=true."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Gauntlet dispatched (EVAL_GAUNTLET_RUNNER_READY=true)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::notice::eval gauntlet skipped: no weights-cached self-hosted runner is available (repository variable EVAL_GAUNTLET_RUNNER_READY is not 'true'). Real LongMemEval/LoCoMo/ER-F1 numbers need cached GGUF weights plus a live Moon, which a stock GitHub runner cannot provide. To enable: register a [self-hosted, llm-weights-cached] runner, then set EVAL_GAUNTLET_RUNNER_READY=true under Settings -> Secrets and variables -> Actions -> Variables. To dispatch anyway, re-run this workflow with force=true."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Eval gauntlet SKIPPED"
            echo
            echo "No \`[self-hosted, llm-weights-cached]\` runner is available."
            echo "Wiring checks above still ran and passed."
            echo
            echo "**To enable:** register a weights-cached runner, then set repository"
            echo "variable \`EVAL_GAUNTLET_RUNNER_READY=true\`. Or re-dispatch with \`force=true\`."
          } >> "$GITHUB_STEP_SUMMARY"

  eval-gauntlet:
    needs: preflight
    # Explicit, visible skip instead of an unschedulable job queued against an
    # empty runner pool. The full gauntlet below is preserved verbatim.
    if: needs.preflight.outputs.should_run == 'true'
    # Runner prerequisites since the llama.cpp-only cutover (Phase D):
    # cmake + a C++ toolchain must be installed on the self-hosted host —
    # the default `llamacpp` feature compiles llama.cpp. The old candle
    # safetensors cache is no longer read; GGUFs live in ~/.lunaris/models/.
    runs-on: [self-hosted, llm-weights-cached]
    # Per CONTEXT.md latency budget: eval-all <= 30 min target + safety margin.
    timeout-minutes: 90

    env:
      # Canonical URL scheme per Plan 05-01 D-01: Lunaris::open routes on the
      # `moon://` scheme (NOT `redis://`). Moon exposes RESP on port 6390.
      MOON_URL: moon://localhost:6390
      # Cached Gemma weights for the ER-F1 extractor; empty on bare runners →
      # the er-f1 harness SKIPs (never a 0.0->FAIL).
      LUNARIS_EXTRACT_GEMMA_PATH: ${{ secrets.LUNARIS_EXTRACT_GEMMA_PATH }}
      # NOTE: LUNARIS_EVAL_CACHE_DIR is intentionally NOT set here. It needs
      # $RUNNER_TEMP, and `runner.*` does not exist in a job-level `env:` map —
      # putting it here is what made this whole file un-loadable for 7 weeks
      # (STARTUP-01 at the top). It is exported from a step below instead.
      # v0.7 N=500 validation (2026-07) found this gate silently defaulted to
      # `longmemeval_oracle` (the easy, evidence-only haystack) with pure
      # vector-only retrieval — nothing like the real `longmemeval_s`
      # adversarial config every published number in docs/benchmarks/ is
      # measured against. Pin the real dataset + Lunaris's actual production
      # retrieval shape (hybrid vector+BM25 fusion, intent-adaptive routing,
      # rerank) so this gate protects the real recall contract. Plain literal
      # values only — no untrusted github.event.* interpolation here.
      LUNARIS_EVAL_LME_DATASET: longmemeval_s
      LUNARIS_EVAL_LME_HYBRID: "1"
      LUNARIS_EVAL_LME_ADAPTIVE: "1"
      LUNARIS_EVAL_LME_RERANK: "1"
      # JUDGE mode (LLM gen+judge, ~2-5 min/question with an LLM in the loop)
      # deliberately stays OFF here: it needs a reader-model secret this gate
      # doesn't have, and even a small N would blow the eval-all 30-min
      # target. Evidence-recall@k is the honest metric for a fast per-push
      # gate anyway — it's Lunaris's own contract (sub-25ms *recall*
      # correctness, not e2e QA accuracy per CLAUDE.md) and needs no external
      # API. LIMIT is intentionally small: the real `_s` haystacks (~500
      # turns each) cost real ingest+embed time per question even without a
      # judge call; re-tune once real runner timing is observed.
      LUNARIS_EVAL_LME_LIMIT: "15"

    steps:
      - name: Checkout (vendor/moon only — .planning skipped, cross-repo auth)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init vendor/moon submodule
        # Non-recursive: vendor/moon has its own nested .planning submodule
        # (pilotspace/moon-docs, SSH-only) that we do NOT need for builds.
        run: git submodule update --init vendor/moon

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Resolve eval dataset cache dir (STARTUP-01)
        # $RUNNER_TEMP only exists once a runner is executing steps, so the
        # value has to be produced HERE and handed to later steps through
        # $GITHUB_ENV. The `env` context — unlike `runner` — IS available in a
        # step's `with:`, so the cache step below can read it back.
        run: echo "LUNARIS_EVAL_CACHE_DIR=$RUNNER_TEMP/lunaris-eval-cache" >> "$GITHUB_ENV"

      - name: Cache eval datasets (HF download cache)
        uses: actions/cache@v4
        with:
          path: ${{ env.LUNARIS_EVAL_CACHE_DIR }}
          # Cargo.lock as the cache key proxy — when deps change, dataset paths
          # inside hf-hub MAY shift between revisions; keying off Cargo.lock is
          # conservative + cheap.
          key: lunaris-eval-cache-${{ hashFiles('Cargo.lock') }}

      - name: Build Moon (release, from vendor/moon submodule)
        run: >
          cargo build --release
          --manifest-path vendor/moon/Cargo.toml
          --bin moon

      - name: Launch Moon (manual docker-run-equivalent; port 6390)
        # Manual launch (not a container image) per the integration.yml pattern.
        # Logs to RUNNER_TEMP so an on-failure dump has something to show.
        run: |
          mkdir -p "$RUNNER_TEMP"
          ./vendor/moon/target/release/moon --port 6390 \
            > "$RUNNER_TEMP/moon.log" 2>&1 &
          echo "MOON_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/6390) >/dev/null 2>&1; then
              echo "moon reachable after $i attempts"
              exit 0
            fi
            echo "waiting for moon (6390) ($i/30)..."
            sleep 2
          done
          echo "ERROR: moon not reachable after 60s"
          cat "$RUNNER_TEMP/moon.log" || true
          exit 1

      - name: Build lunaris-evals (release)
        run: cargo build --release --bin lunaris-evals

      - name: Run eval gauntlet (cargo run --release lunaris-evals all)
        run: cargo run --release --bin lunaris-evals -- all --output eval-results.json

      - name: Upload eval-results.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json

      - name: Gate merge on status FAIL
        # CI greps for FAIL rows. Soft-fail (SKIPPED) does NOT block merge per
        # CONTEXT.md D-21. Single-line shell test is the exact gate command.
        run: '! grep -qE ''"status": ?"FAIL"'' eval-results.json'

      - name: Stop Moon
        if: always()
        run: kill "$MOON_PID" 2>/dev/null || true
