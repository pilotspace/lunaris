name: perf-baseline-save
# O-03-C — capture a blessed perf baseline per hardware target.
#
# Manual `workflow_dispatch` only. Operators invoke this when an
# intentional perf change lands (new model, candle bump, etc.) to refresh
# the baseline that `perf-gates.yml` compares against. The run captures
# `--save-baseline v0.4-O01-<label>` for each matrix cell and uploads the
# resulting `target/criterion/` tree as an artifact named
# `perf-baseline-v0.4-O01-<label>`. `perf-gates.yml` `download-artifact`
# step restores from this name.
#
# Why a separate workflow: blessing a baseline is a deliberate operator
# action — running on every PR would let any merged regression silently
# become the new ceiling. By gating on workflow_dispatch + a manual
# input the operator (a) confirms the absolute hardware-target gates
# are still met before saving, and (b) leaves an audit trail in the
# Actions log tied to a specific commit SHA.
#
# Security: every `run:` block consumes only static matrix values + the
# operator-supplied `reason` input, which is passed via env var (never
# interpolated into shell strings) per GH workflow-injection guidance.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you blessing a new baseline? (free text, audit log only)"
        required: true
        type: string
      targets:
        description: "Comma-separated subset of: apple-metal,cuda-sm80,cpu-x86_64-mkl,cpu-aarch64-neon (default: all)"
        required: false
        default: "apple-metal,cuda-sm80,cpu-x86_64-mkl,cpu-aarch64-neon"
        type: string

permissions:
  contents: read

jobs:
  save:
    name: ${{ matrix.host.label }}
    if: contains(inputs.targets, matrix.host.label)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host:
          - label: apple-metal
            runs-on: [self-hosted, macos, arm64, metal]
            feature: metal
          - label: cuda-sm80
            runs-on: [self-hosted, linux, x86_64, cuda]
            feature: cuda
          - label: cpu-x86_64-mkl
            runs-on: ubuntu-latest
            feature: cpu-mkl
          - label: cpu-aarch64-neon
            runs-on: ubuntu-22.04-arm
            feature: per-device-bench
    runs-on: ${{ matrix.host.runs-on }}
    env:
      MATRIX_LABEL: ${{ matrix.host.label }}
      MATRIX_FEATURE: ${{ matrix.host.feature }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Log baseline-save intent
        run: |
          echo "::notice::Saving baseline 'v0.4-O01-${MATRIX_LABEL}' on commit ${GITHUB_SHA}."
          # REASON is operator-supplied; printed via env var, not shell-interpolated.
          printf '::notice::Operator reason: %s\n' "${REASON}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: perf-baseline-${{ matrix.host.label }}

      - name: Stage model weights
        env:
          LUNARIS_STAGE_MODELS_KEY: ${{ secrets.LUNARIS_STAGE_MODELS_KEY }}
        run: |
          set -e
          if [ -z "${LUNARIS_STAGE_MODELS_KEY:-}" ]; then
            echo "::error::Cannot save a baseline without staged model weights — LUNARIS_STAGE_MODELS_KEY is unset. Set the secret and rerun."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/lunaris-models"
          HF_TOKEN="$LUNARIS_STAGE_MODELS_KEY" \
          cargo run --release -p lunaris-bench --bin stage-models -- \
              --cache-dir "$RUNNER_TEMP/lunaris-models"
          {
            echo "GRANITE_R2_WEIGHTS_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/model.safetensors"
            echo "GRANITE_R2_TOKENIZER_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/tokenizer.json"
            echo "GRANITE_R2_CONFIG_PATH=$RUNNER_TEMP/lunaris-models/granite-r2/config.json"
            echo "BGE_RERANKER_WEIGHTS_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/model.safetensors"
            echo "BGE_RERANKER_TOKENIZER_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/tokenizer.json"
            echo "BGE_RERANKER_CONFIG_PATH=$RUNNER_TEMP/lunaris-models/bge-reranker-v2-m3/config.json"
          } >> "$GITHUB_ENV"

      - name: Capture baseline
        run: |
          set -e
          BASELINE_NAME="v0.4-O01-${MATRIX_LABEL}"
          cargo bench --features "${MATRIX_FEATURE}" \
              -p lunaris-bench --bench per_device -- \
              --save-baseline "${BASELINE_NAME}"

      - name: Verify baseline files exist
        run: |
          set -e
          BASELINE_NAME="v0.4-O01-${MATRIX_LABEL}"
          COUNT=$(find target/criterion -path "*/${BASELINE_NAME}/estimates.json" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No baseline files written under target/criterion/**/${BASELINE_NAME}/ — bench likely skipped (weights env vars unset?)."
            exit 1
          fi
          echo "::notice::Captured ${COUNT} baseline file(s) under '${BASELINE_NAME}'."

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          # Name MUST match the `download-artifact` step in perf-gates.yml.
          name: perf-baseline-v0.4-O01-${{ matrix.host.label }}
          path: target/criterion/
          # Long retention — the baseline IS the durable record until the
          # next intentional refresh.
          retention-days: 365
          if-no-files-found: error
