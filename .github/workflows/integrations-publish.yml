# integrations-publish — build and publish the `lunaris-integrations` sdist +
# wheel (W4.7).
#
# `integrations/` is a pure-Python package: the framework adapters (LangGraph,
# CrewAI, Letta) over one transport-agnostic client. It has no compiled
# component, so unlike the `lunaris` SDK there is no per-arch matrix — one
# sdist and one universal wheel cover every platform.
#
# Why it needed a workflow at all: through v0.7.1 `integrations/README.md`
# opened with `pip install "lunaris-integrations[langgraph]"`, and the name has
# never existed on PyPI. Nothing in this repo built the package, let alone
# uploaded it. `scripts/tests/test_install_claims_are_publishable.py` now fails
# if any doc names a distribution no workflow publishes, so the README and this
# file cannot drift apart again.
#
# FIRST RUN IS OWNER-GATED. `secrets.MATURIN_PYPI_TOKEN` is the token
# python-prebuild.yml already uses for the `lunaris` project. If that token is
# project-scoped to `lunaris` it CANNOT upload a different distribution, and
# the publish step will 403. Whoever cuts the first release either widens the
# token or adds a `lunaris-integrations` PyPI project and a scoped token under
# the same secret name. The build job below runs on every PR that touches
# `integrations/`, so a broken package is caught long before that step.

name: integrations-publish

on:
  push:
    branches: [main]
    paths:
      - "integrations/**"
      - ".github/workflows/integrations-publish.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "integrations/**"
      - ".github/workflows/integrations-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          # The floor `integrations/pyproject.toml` declares.
          python-version: "3.11"

      - name: Build
        working-directory: integrations
        run: |
          python -m pip install --quiet --upgrade build
          python -m build

      - name: Install the built wheel and check what is in it
        run: |
          python -m pip install --quiet integrations/dist/*.whl
          python - <<'PY'
          import importlib.util

          # The client layer must import with NO framework installed — that is
          # the whole point of the optional extras, and it is the only thing a
          # bare `pip install lunaris-integrations` gets you.
          from lunaris_integrations import client  # noqa: F401

          # Each adapter module must be PRESENT in the wheel. `find_spec`
          # locates without executing, which is the distinction that matters:
          # every adapter does `from langgraph.store.base import ...` at module
          # top level, so `import_module` here would fail on the missing
          # framework and report a packaging bug that is not there. Hatch's
          # `packages = ["lunaris_integrations"]` silently produces a wheel
          # missing files if the layout moves, and `python -m build` is
          # perfectly happy about it — that is what this catches.
          missing = [
              m for m in ("langgraph", "crewai", "letta")
              if importlib.util.find_spec(f"lunaris_integrations.{m}") is None
          ]
          assert not missing, f"adapter modules absent from the wheel: {missing}"
          print("ok: client imports bare, and all 3 adapter modules are in the wheel")
          PY

      - name: Check metadata
        run: |
          python -m pip install --quiet twine
          twine check integrations/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: lunaris-integrations-dist
          path: integrations/dist/*
          retention-days: 30

  # `integrations/tests/` had NO runner. 18 tests — the entire suite for the
  # package this workflow is about to upload to PyPI — never ran in CI:
  # `grep -rn "integrations/tests" .github/workflows/` returned nothing before
  # W4.7, and `examples.yml` installs the extras only to run mypy. Publishing a
  # distribution whose tests nobody runs is the thing this workflow exists to
  # stop, so the upload waits on this job.
  test:
    name: pytest (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [langgraph, crewai, letta]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One extra per leg, mirroring examples.yml: the three frameworks are
      # installed separately there, and nothing has ever proved they co-resolve.
      # The union of the three legs covers every adapter.
      - name: Install
        run: pip install -e "integrations[${{ matrix.extra }},test]"

      - name: Full suite
        run: python -m pytest integrations/tests -q -rs

      # The adapter tests `pytest.importorskip` their framework, so a leg whose
      # install silently produced no importable framework would SKIP its own
      # adapter test and still report green — proving nothing while looking
      # identical to proof. Require this leg's test to actually run.
      - name: This leg's adapter test must RUN, not skip
        run: |
          set -o pipefail
          out=$(python -m pytest "integrations/tests/test_${{ matrix.extra }}.py" -q -rs 2>&1) || {
            echo "$out"; exit 1;
          }
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::the ${{ matrix.extra }} adapter test SKIPPED — the \
          framework did not import, so this leg asserted nothing about the adapter"
            exit 1
          fi

  publish:
    name: publish lunaris-integrations to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    # Tag-gated. `!cancelled()` mirrors python-prebuild.yml: a cancelled build
    # must not silently skip the publish and read as a successful release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lunaris-integrations-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `--skip-existing` makes a release re-run or a retag idempotent rather
      # than a 400 on an already-uploaded file.
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.MATURIN_PYPI_TOKEN }}
        run: |
          python -m pip install --quiet twine
          twine upload --non-interactive --skip-existing dist/*
