[workspace]
resolver = "3"
members = [
  "crates/lunaris-core",
  "crates/lunaris-storage-moon",
  "crates/lunaris-storage-postgres",
  "crates/lunaris-verify",
  "crates/lunaris",
  "crates/lunaris-bench",
  "crates/lunaris-conformance",
  # Plan 08-01: lunaris-codegen sits next to lunaris-conformance per the plan's
  # explicit workspace-grouping rule — both are metadata/plumbing crates; placing
  # them adjacent (rather than alphabetising) keeps the mental model coherent.
  "crates/lunaris-codegen",
  # Phase 8 Plan 08-02: lunaris-py is the PyO3 0.26 host crate — placed next to
  # lunaris (the umbrella it wraps) rather than alphabetised; mirrors the
  # grouping rule used for lunaris-codegen next to lunaris-conformance.
  "crates/lunaris-py",
  # Phase 8 Plan 08-03: lunaris-ts is the napi-rs 3.x TypeScript host crate —
  # placed next to lunaris-py (both are binding crates for the same Rust
  # umbrella) per the grouping-by-concern rule (NOT alphabetical).
  "crates/lunaris-ts",
  # Phase 9 Plan 09-01: lunaris-recipes hosts the 4 composable primitives
  # (MessageStream / DocumentCorpus / TemporalQuery / WorkingMemory) +
  # Moon + Postgres parity harness. Placed after lunaris-ts per the
  # grouping-by-concern rule (all downstream-consumer crates clustered).
  "crates/lunaris-recipes",
  "crates/lunaris-consolidate",
  "crates/lunaris-embed",
  "crates/lunaris-extract",
  "crates/lunaris-ingest",
  "crates/lunaris-rerank",
  "crates/lunaris-retrieve",
  "crates/lunaris-server",
  "xtask",
]

[workspace.package]
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
authors      = ["Lunaris Authors"]
repository   = "https://github.com/lunaris-dev/lunaris"
publish      = false

[workspace.dependencies]
# async runtime
tokio          = { version = "1", features = ["full"] }
async-trait    = "0.1"
futures        = "0.3"
bytes          = "1"
# error / result
thiserror      = "2"
anyhow         = "1"
# serde
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# time / id
chrono         = { version = "0.4", features = ["serde"] }
ulid           = { version = "1", features = ["serde"] }
# observability
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# concurrency
parking_lot    = "0.12"
# storage backends (used by Plan 03 / 04 — declared here so versions stay aligned)
redis          = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
# moon — typed Rust SDK for Moon (path dep — user owns the Moon repo).
# Brings `redis 1.1` transitively via its own [dependencies] block. Phase 1.5 retrofit
# (STORE-09) replaces `lunaris-storage-moon`'s direct `redis 0.32` dep with this.
# Upstream rename: this crate was previously published as `moon-client`; renamed to
# `moondb` in moon repo. Lunaris keeps the local alias `moon` so internal use sites
# keep their stable `use moon::` form (one place to update if Moon renames again).
moon           = { path = "../moon/sdk/rust", package = "moondb" }
sqlx           = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"] }
url            = "2"
# Phase 2 ingest hot path (INGEST-01..04) — chunker + real EmbeddingGemma + Ollama alt
pulldown-cmark = { version = "0.13", default-features = false }
candle-core    = "0.10"
candle-nn      = "0.10"
candle-transformers = "0.10"
tokenizers     = { version = "0.22", default-features = false, features = ["onig"] }
dirs           = "6"
reqwest        = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Phase 2 retrieve hot path (RETRIEVE-01..13) — tower service composition + cached
# query embedding via async OnceCell
tower          = { version = "0.5", features = ["util", "limit", "timeout", "retry"] }
# test only
rand           = "0.9"
proptest       = "1"
# Phase 2 Plan 02-04 — bench harness (Criterion + deterministic 1M-fact corpus)
criterion      = { version = "0.8", features = ["html_reports", "async_tokio"] }
rand_chacha    = "0.9"
sha2           = "0.10"
hex            = "0.4"
# Phase 3 Plan 03-01 — content-hash EntityId derivation (D-06).
# 16-byte truncation of blake3(canonical_name_normalized || "::" || entity_type).
blake3         = "1"
clap           = { version = "4", features = ["derive", "env"] }
# Phase 4 Plan 04-03 — safe wrapper around POSIX `kill(2)` for the SIGKILL chaos
# test (D-23). `default-features = false` + `features = ["signal"]` keeps the dep
# surface to just the signal API (no aio/process/etc). CLAUDE.md
# `#![forbid(unsafe_code)]` is satisfied because `nix` wraps the unsafe FFI
# internally and exposes a safe Rust API to callers.
nix            = { version = "0.29", default-features = false, features = ["signal"] }
# Phase 5 Plan 05-01 — MemoryProtocol HTTP+SSE server stack (PROTO-01..05 + DEPLOY-01/02/04).
# CLAUDE.md "Latest libraries policy" — pin to latest stable per CONTEXT.md D-02 / D-08 / D-09.
# Note: tower_governor crate uses underscore in name (the workspace alias `tower-governor` here
# is the *user-facing* dep name; the actual published crate is `tower_governor 0.8`).
axum               = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "macros", "tokio", "tracing"] }
tower-http         = { version = "0.6", features = ["cors", "trace"] }
tower-governor     = { package = "tower_governor", version = "0.8", default-features = false, features = ["axum"] }
# governor 0.10 — pulled transitively by tower_governor; exposed as a workspace
# dep so lunaris-server can name `governor::middleware::NoOpMiddleware` /
# `governor::clock::QuantaInstant` in the GovernorLayer return type signature.
governor           = "0.10"
is-terminal        = "0.4"
# Phase 5 Plan 05-05 OPS-06 — Prometheus text-format metrics exporter mounted
# at GET /metrics on lunaris-server. Pinned to the latest stable per CLAUDE.md
# "Latest libraries policy"; default-features=false drops the procfs/protobuf
# Linux-only collectors we don't need (we only emit our own 9 metrics).
prometheus         = { version = "0.14", default-features = false }
# Phase 5 Plan 05-06 EVAL-01/02 — HuggingFace Hub dataset download + caching for
# LongMemEval (xiaowu0162/long-mem-eval), LoCoMo (snap-research/locomo10), and
# WNUT-2017 (tner/wnut2017). Cache directory is caller-controlled via
# `ApiBuilder::with_cache_dir(PathBuf)` per CLAUDE.md `#![forbid(unsafe_code)]`
# mandate (the prior `unsafe { std::env::set_var("HF_HOME", ...) }` plan-body
# pattern was rejected by B-4 fix — `with_cache_dir` is the safe-Rust path).
hf-hub             = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
# Phase 5 Plan 05-06 EVAL-04 — Linux RSS sampling via /proc/self/status. macOS
# uses `ps -o rss= -p <pid>` shell-out (no extra dep — std::process::Command);
# Windows path returns None and the harness emits status:SKIPPED. mach2 is NOT
# in workspace deps because CLAUDE.md `#![forbid(unsafe_code)]` would require
# an unsafe wrapper crate (Plan 04-03 set the precedent: nix wraps unsafe;
# mach2 has no equivalent safe wrapper as of 0.4).
procfs             = { version = "0.18", default-features = false }
# Phase 8 Plan 08-01 — lunaris-codegen single-source surface pipeline.
# `syn` parses the optional annotated-Rust surface (kept for future extraction
# modes); `toml` parses the primary `annotations/surface.toml` declarative file;
# `prettyplease` pretty-prints emitter-side Rust token streams; `similar`
# renders unified diffs for `--check` drift output; `insta` drives the
# snapshot-based tests in `tests/emitter_shape.rs`.
syn            = { version = "2", features = ["full", "extra-traits", "visit"] }
quote          = "1"
proc-macro2    = "1"
prettyplease   = "0.2"
toml           = "0.8"
insta          = { version = "1", features = ["json"] }
similar        = "2"
# Phase 8 Plan 08-02 — PyO3 0.26 Python bindings (lunaris-py crate).
# `extension-module` suppresses libpython linkage on Linux/macOS so the cdylib
# is loadable from any Python 3.11+ interpreter; `abi3-py311` emits stable-ABI
# symbols so a single wheel works across Python 3.11 / 3.12 / 3.13 per
# PEP 384. `pyo3-async-runtimes` hosts the tokio integration —
# `future_into_py` is the CLAUDE.md-mandated GIL-release surface for every
# async method wrapper emitted by Plan 08-01 codegen. `pythonize` converts
# between `serde`-capable Rust types and Python dicts/lists so Episode +
# ForgetTarget + Hit cross the FFI boundary as native Python objects without
# a hand-rolled per-field dispatcher.
pyo3                = { version = "0.26", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.26", features = ["tokio-runtime"] }
pythonize           = "0.26"
# Phase 8 Plan 08-03 — napi-rs 3.x TypeScript bindings (lunaris-ts crate).
# NAPI-8 feature pin is the ROADMAP Phase 8 risk-register stable ABI guard:
# Node 20 LTS exposes NAPI v8 — pinning here ensures the `.node` binary
# doesn't drift against a newer symbol set on a Node minor-update.
# `tokio_rt` hooks up napi-rs's async runtime adapter to our shared tokio
# worker so `#[napi] pub async fn` lowers into a `Promise<T>` whose work
# actually runs on the same executor the Rust umbrella crate uses; `async`
# toggles the attribute-level async support in napi-derive; `serde-json`
# enables the `serde_json::Value <-> JsValue` bridges that the codegen
# emitter (Plan 08-01) already leans on for Episode / ForgetRequest / Hit;
# `error_anyhow` lets us map `anyhow::Error` straight into a napi::Error.
napi                = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "async", "serde-json", "error_anyhow"] }
napi-derive         = "3"
napi-build          = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = "thin"
debug     = 1
