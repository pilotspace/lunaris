[workspace]
resolver = "3"
members = [
  "crates/lunaris-core",
  # 0.7.0 is Moon-only. `lunaris-storage-postgres` and
  # `lunaris-storage-embedded` were deleted here; operators exit via the
  # `lunaris-migrate` binary shipped in the v0.6.2 release (see
  # docs/migration/0.6-to-0.7.md).
  "crates/lunaris-storage-moon",
  "crates/lunaris-verify",
  "crates/lunaris",
  "crates/lunaris-bench",
  "crates/lunaris-conformance",
  # Plan 08-01: lunaris-codegen sits next to lunaris-conformance per the plan's
  # explicit workspace-grouping rule — both are metadata/plumbing crates; placing
  # them adjacent (rather than alphabetising) keeps the mental model coherent.
  "crates/lunaris-codegen",
  # Phase 8 Plan 08-02: lunaris-py is the PyO3 0.26 host crate — placed next to
  # lunaris (the umbrella it wraps) rather than alphabetised; mirrors the
  # grouping rule used for lunaris-codegen next to lunaris-conformance.
  "crates/lunaris-py",
  # Phase 8 Plan 08-03: lunaris-ts is the napi-rs 3.x TypeScript host crate —
  # placed next to lunaris-py (both are binding crates for the same Rust
  # umbrella) per the grouping-by-concern rule (NOT alphabetical).
  "crates/lunaris-ts",
  # Phase 9 Plan 09-01: lunaris-recipes hosts the 4 composable primitives
  # (MessageStream / DocumentCorpus / TemporalQuery / WorkingMemory) +
  # Moon + Postgres parity harness. Placed after lunaris-ts per the
  # grouping-by-concern rule (all downstream-consumer crates clustered).
  "crates/lunaris-recipes",
  "crates/lunaris-consolidate",
  # llama.cpp-only cutover (Phase C) — Ollama/OpenAI-compatible HTTP escape
  # hatch crate (feature-gated, off by default; operator-only). See
  # crates/lunaris-embed-remote/src/lib.rs for rationale.
  "crates/lunaris-embed-remote",
  # llama.cpp-only cutover (ADR 2026-07-10, Phase C) — THE Lunaris inference
  # runtime (embedder + reranker). The umbrella enables `llamacpp` by
  # default; with the feature off this is an empty shell (no C++ build),
  # which is the Tier-0 no-inference path.
  "crates/lunaris-llamacpp",
  "crates/lunaris-extract",
  # Phase 11 (LLM unification) — shared LlmBackend trait + LlmConfig consumed by
  # lunaris-extract, lunaris-verify, and the turn-end reflect supervisor. Placed
  # adjacent to its consumers (extract / verify) per the grouping-by-concern rule.
  "crates/lunaris-llm",
  "crates/lunaris-ingest",
  "crates/lunaris-rerank",
  "crates/lunaris-retrieve",
  "crates/lunaris-server",
  # Wave A — MCP server binary exposing Lunaris memory to Claude Code / Codex
  # via the official rmcp 1.7 stdio transport. Zero tools at Wave 0; tool
  # handlers (memory.ingest, .recall, .forget, .list_scopes) land in Wave 2.
  "crates/lunaris-mcp",
  "crates/lunaris-memory-service",
  # v0.5 Wave B — hook adapter binary that captures Claude Code lifecycle events
  # into Lunaris memory. Reads a single hook envelope from stdin, derives scope
  # from cwd+git remote (same algorithm as lunaris-mcp), writes one Episode via
  # ScopedLunaris::ingest, exits 0 on success or non-zero with structured stderr.
  "crates/lunaris-hook",
  # 0.7.0 prerequisite — ephemeral child-process Moon fixtures so the ~60 test
  # files that open `memory://` can be ported off the embedded SQLite backend
  # before it is deleted. Dev-dependency only; never linked into a shipped
  # binary, and deliberately does NOT use the `embedded-moon` feature (that one
  # compiles the Moon *server* into the calling target).
  "crates/lunaris-test-harness",
  # `lunaris-migrate` (the operator exit ramp OFF SQLite / Postgres and INTO
  # Moon) lived here through 0.6.x and was deleted with its two source
  # backends in 0.7.0, exactly as its manifest comment promised. Operators run
  # it from the **v0.6.2 release binary** — it cannot be built from main.
  "xtask",
]
exclude = [
  # Vendored server package built independently by setup/dev flows; Lunaris
  # depends only on its Rust SDK via `vendor/moon/sdk/rust`.
  "vendor/moon",
  # O-02 spike: throwaway Apple-Silicon-only crate evaluating `mlx-rs` as an
  # alternate embedder kernel backend. `publish = false`; deleted after the
  # GO/NO-GO decision regardless of outcome. See
  # `docs/spike/O-02-mlx/DECISION.md` for the verdict.
  #
  # EXCLUDED from the workspace (not a member): it hard-enables candle's
  # `metal` feature, and workspace feature-unification would force `metal`
  # (and the Apple-only objc2 chain) onto every Linux `--workspace` build —
  # CI clippy dies with objc2's compile_error. Its manifest uses no
  # workspace inheritance and nothing depends on it; build standalone on an
  # Apple machine via:
  #   cargo build --manifest-path crates/lunaris-embed-mlx-spike/Cargo.toml
  "crates/lunaris-embed-mlx-spike",
]

[workspace.package]
version      = "0.6.2"
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
authors      = ["Lunaris Authors"]
repository   = "https://github.com/lunaris-dev/lunaris"
publish      = false

[workspace.dependencies]
# Internal lunaris-* crates. Declared with BOTH `path` and `version`
# so a downstream `lunaris-X = { workspace = true }` resolves to the
# local path for in-workspace builds AND carries the correct
# crates.io version for `cargo publish`. Version stays in lockstep
# with `[workspace.package].version` above; bump them together.
# `default-features = false` here so downstream callers can opt back
# in via `features = ["llamacpp", ...]` without colliding with cargo's
# rule that disallows downstream `default-features = false` when the
# workspace entry leaves defaults enabled.
lunaris                   = { path = "crates/lunaris", version = "0.6.2", default-features = false, package = "lunaris-memory" }
lunaris-core              = { path = "crates/lunaris-core", version = "0.6.2" }
lunaris-storage-moon      = { path = "crates/lunaris-storage-moon", version = "0.6.2", default-features = false }
lunaris-embed-remote      = { path = "crates/lunaris-embed-remote", version = "0.6.2", default-features = false }
lunaris-llamacpp          = { path = "crates/lunaris-llamacpp", version = "0.6.2", default-features = false }
lunaris-rerank            = { path = "crates/lunaris-rerank", version = "0.6.2", default-features = false }
lunaris-extract           = { path = "crates/lunaris-extract", version = "0.6.2", default-features = false }
lunaris-llm               = { path = "crates/lunaris-llm", version = "0.6.2", default-features = false }
lunaris-verify            = { path = "crates/lunaris-verify", version = "0.6.2", default-features = false }
lunaris-consolidate       = { path = "crates/lunaris-consolidate", version = "0.6.2", default-features = false }
lunaris-ingest            = { path = "crates/lunaris-ingest", version = "0.6.2", default-features = false }
lunaris-retrieve          = { path = "crates/lunaris-retrieve", version = "0.6.2", default-features = false }
lunaris-recipes           = { path = "crates/lunaris-recipes", version = "0.6.2", default-features = false }
lunaris-server            = { path = "crates/lunaris-server", version = "0.6.2", default-features = false }
lunaris-memory-service    = { path = "crates/lunaris-memory-service", version = "0.6.2" }
lunaris-bench             = { path = "crates/lunaris-bench", version = "0.6.2", default-features = false }
lunaris-conformance       = { path = "crates/lunaris-conformance", version = "0.6.2", default-features = false }
lunaris-codegen           = { path = "crates/lunaris-codegen", version = "0.6.2", default-features = false }
lunaris-py                = { path = "crates/lunaris-py", version = "0.6.2", default-features = false }
lunaris-ts                = { path = "crates/lunaris-ts", version = "0.6.2", default-features = false }
# Dev-only. No `version` key: this crate is `publish = false` and is consumed
# exclusively as a path dev-dependency, so a version req would only serve to
# leak it into published manifests.
lunaris-test-harness      = { path = "crates/lunaris-test-harness" }

# async runtime
tokio          = { version = "1", features = ["full"] }
async-trait    = "0.1"
futures        = "0.3"
bytes          = "1"
# error / result
thiserror      = "2"
anyhow         = "1"
# serde
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# time / id
chrono         = { version = "0.4", features = ["serde"] }
ulid           = { version = "1", features = ["serde"] }
# observability
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# concurrency
parking_lot    = "0.12"
# storage backends (used by Plan 03 / 04 — declared here so versions stay aligned)
redis          = { version = "0.32", features = ["aio", "tokio-comp", "connection-manager"] }
# moon — typed Rust SDK for Moon, vendored with the Moon submodule so Lunaris
# stays wire-compatible with the rebuilt local Moon binary (MQ + HYBRID RRF).
# Upstream package name is `moondb`; Lunaris keeps the local alias `moon` so
# internal use sites keep their stable `use moon::` form.
# `version` is REQUIRED for `cargo publish` of the moondb-dependent crates —
# cargo strips the path at publish and pins the crates.io `moondb` release.
# This version MUST equal what vendor/moon/sdk/rust/Cargo.toml declares
# (crates-publish.yml fails fast otherwise): local builds always use the
# `path`, so a drifted pin compiles fine here but ships crates that cannot
# build against the moondb users actually resolve. v0.3.0 hit exactly this —
# the vendored SDK had the 3-way hybrid_search, crates.io moondb 0.1.1 only
# the 2-way; moondb 0.2.0 closed the gap. When the vendored SDK API changes,
# cut a new moondb release in the moon repo and bump submodule + pin together.
moon           = { path = "vendor/moon/sdk/rust", version = "0.3.0", package = "moondb" }
# NOTE — `sqlx` was a workspace dependency through 0.6.x for
# `lunaris-storage-postgres` (postgres) and `lunaris-storage-embedded`
# (sqlite). Both crates were deleted in 0.7.0 (Moon-only), and with them the
# workspace's only SQL driver. Do not re-add one: Moon is the storage
# substrate, and a second driver would re-open the portability surface 0.7.0
# closed on purpose.
url            = "2"
# Phase 2 ingest hot path (INGEST-01..04) — chunker + real EmbeddingGemma + Ollama alt
pulldown-cmark = { version = "0.13", default-features = false }
# llama.cpp-only cutover (Phase C) — the candle 0.10 workspace deps were
# retired with `lunaris-embed-native` / `lunaris-rerank-native`; inference
# now runs on `lunaris-llamacpp` (llama-cpp-2). `tokenizers` is KEPT: the
# ingest token counter (`lunaris-ingest`) still loads granite-r2's
# tokenizer.json for chunk budgeting. `hf-hub` is also KEPT —
# `lunaris-bench` uses it for eval-dataset download (LongMemEval / LoCoMo /
# WNUT-2017) per `crates/lunaris-bench/src/eval/longmemeval.rs:165`.
tokenizers     = { version = "0.22", default-features = false, features = ["onig"] }
dirs           = "6"
# `reqwest` is shared by `lunaris-embed-remote` (Ollama HTTP escape hatch)
# and (transitively) by the cloud-API extractor backend in lunaris-extract.
reqwest        = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Phase 2 retrieve hot path (RETRIEVE-01..13) — tower service composition + cached
# query embedding via async OnceCell
tower          = { version = "0.5", features = ["util", "limit", "timeout", "retry"] }
# test only
rand           = "0.9"
proptest       = "1"
# Phase 2 Plan 02-04 — bench harness (Criterion + deterministic 1M-fact corpus)
criterion      = { version = "0.8", features = ["html_reports", "async_tokio"] }
rand_chacha    = "0.9"
sha2           = "0.10"
hex            = "0.4"
# Phase 3 Plan 03-01 — content-hash EntityId derivation (D-06).
# 16-byte truncation of blake3(canonical_name_normalized || "::" || entity_type).
blake3         = "1"
clap           = { version = "4", features = ["derive", "env"] }
# Phase 4 Plan 04-03 — safe wrapper around POSIX `kill(2)` for the SIGKILL chaos
# test (D-23). `default-features = false` + `features = ["signal"]` keeps the dep
# surface to just the signal API (no aio/process/etc). CLAUDE.md
# `#![forbid(unsafe_code)]` is satisfied because `nix` wraps the unsafe FFI
# internally and exposes a safe Rust API to callers.
nix            = { version = "0.29", default-features = false, features = ["signal"] }
# Phase 5 Plan 05-01 — MemoryProtocol HTTP+SSE server stack (PROTO-01..05 + DEPLOY-01/02/04).
# CLAUDE.md "Latest libraries policy" — pin to latest stable per CONTEXT.md D-02 / D-08 / D-09.
# Note: tower_governor crate uses underscore in name (the workspace alias `tower-governor` here
# is the *user-facing* dep name; the actual published crate is `tower_governor 0.8`).
axum               = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "macros", "tokio", "tracing"] }
tower-http         = { version = "0.6", features = ["cors", "trace"] }
tower-governor     = { package = "tower_governor", version = "0.8", default-features = false, features = ["axum"] }
# governor 0.10 — pulled transitively by tower_governor; exposed as a workspace
# dep so lunaris-server can name `governor::middleware::NoOpMiddleware` /
# `governor::clock::QuantaInstant` in the GovernorLayer return type signature.
governor           = "0.10"
is-terminal        = "0.4"
# Phase 14.2 — ephemeral per-handle LRU boost cache (ReflectOutput.boost rescoring).
# `lru 0.12` is the standard LRU cache crate (hashbrown-backed, no_std-compatible).
# Wrapped in `parking_lot::RwLock` for lock discipline.
# 0.18: RUSTSEC-2026-0002 (IterMut unsoundness in <=0.16.2) — cargo-deny
# advisories gate. Lunaris never calls IterMut, but stay on patched releases.
lru                = "0.18"
# Phase 5 Plan 05-05 OPS-06 — Prometheus text-format metrics exporter mounted
# at GET /metrics on lunaris-server. Pinned to the latest stable per CLAUDE.md
# "Latest libraries policy"; default-features=false drops the procfs/protobuf
# Linux-only collectors we don't need (we only emit our own 9 metrics).
prometheus         = { version = "0.14", default-features = false }
# Phase 5 Plan 05-06 EVAL-01/02 — HuggingFace Hub dataset download + caching for
# LongMemEval (xiaowu0162/long-mem-eval), LoCoMo (snap-research/locomo10), and
# WNUT-2017 (tner/wnut2017). Cache directory is caller-controlled via
# `ApiBuilder::with_cache_dir(PathBuf)` per CLAUDE.md `#![forbid(unsafe_code)]`
# mandate (the prior `unsafe { std::env::set_var("HF_HOME", ...) }` plan-body
# pattern was rejected by B-4 fix — `with_cache_dir` is the safe-Rust path).
hf-hub             = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
# Phase 5 Plan 05-06 EVAL-04 — Linux RSS sampling via /proc/self/status. macOS
# uses `ps -o rss= -p <pid>` shell-out (no extra dep — std::process::Command);
# Windows path returns None and the harness emits status:SKIPPED. mach2 is NOT
# in workspace deps because CLAUDE.md `#![forbid(unsafe_code)]` would require
# an unsafe wrapper crate (Plan 04-03 set the precedent: nix wraps unsafe;
# mach2 has no equivalent safe wrapper as of 0.4).
procfs             = { version = "0.18", default-features = false }
# Phase 8 Plan 08-01 — lunaris-codegen single-source surface pipeline.
# `syn` parses the optional annotated-Rust surface (kept for future extraction
# modes); `toml` parses the primary `annotations/surface.toml` declarative file;
# `prettyplease` pretty-prints emitter-side Rust token streams; `similar`
# renders unified diffs for `--check` drift output; `insta` drives the
# snapshot-based tests in `tests/emitter_shape.rs`.
syn            = { version = "2", features = ["full", "extra-traits", "visit"] }
quote          = "1"
proc-macro2    = "1"
prettyplease   = "0.2"
toml           = "0.8"
# Phase 24 Plan 24-02 — secret scrubber (HOOK-04). Linear-time built-in patterns
# (ENV_KEY, AWS_KEY, GH_TOKEN, SSH_KEY, JWT) + optional TOML overlay. No ReDoS risk
# from built-ins; user-supplied patterns gated by 256-char length limit.
regex          = "1"
insta          = { version = "1", features = ["json"] }
similar        = "2"
# Phase 8 Plan 08-02 — PyO3 0.26 Python bindings (lunaris-py crate).
# `extension-module` suppresses libpython linkage on Linux/macOS so the cdylib
# is loadable from any Python 3.11+ interpreter; `abi3-py311` emits stable-ABI
# symbols so a single wheel works across Python 3.11 / 3.12 / 3.13 per
# PEP 384. `pyo3-async-runtimes` hosts the tokio integration —
# `future_into_py` is the CLAUDE.md-mandated GIL-release surface for every
# async method wrapper emitted by Plan 08-01 codegen. `pythonize` converts
# between `serde`-capable Rust types and Python dicts/lists so Episode +
# ForgetTarget + Hit cross the FFI boundary as native Python objects without
# a hand-rolled per-field dispatcher.
pyo3                = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize           = "0.29"
# Phase 8 Plan 08-03 — napi-rs 3.x TypeScript bindings (lunaris-ts crate).
# NAPI-8 feature pin is the ROADMAP Phase 8 risk-register stable ABI guard:
# Node 20 LTS exposes NAPI v8 — pinning here ensures the `.node` binary
# doesn't drift against a newer symbol set on a Node minor-update.
# `tokio_rt` hooks up napi-rs's async runtime adapter to our shared tokio
# worker so `#[napi] pub async fn` lowers into a `Promise<T>` whose work
# actually runs on the same executor the Rust umbrella crate uses; `async`
# toggles the attribute-level async support in napi-derive; `serde-json`
# enables the `serde_json::Value <-> JsValue` bridges that the codegen
# emitter (Plan 08-01) already leans on for Episode / ForgetRequest / Hit;
# `error_anyhow` lets us map `anyhow::Error` straight into a napi::Error.
napi                = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "async", "serde-json", "error_anyhow"] }
napi-derive         = "3"
napi-build          = "2"
# RFC 0001 — Scope newtype. SmolStr keeps short scope identifiers (≤23 bytes)
# inline with no heap alloc; Clone is O(1). Used in lunaris-core::scope and
# propagated to every primitive + StoragePort method.
smol_str            = { version = "0.3", features = ["serde"] }
# Phase 24 Plan 24-01 — HOOK-03 layered event-filter policy (path glob deny list).
# `globset` provides compiled GlobSet matching used by FilterPolicy in lunaris-hook.
globset             = "0.4"
# Phase 27 STRUCT-01 — pure-Rust unit segmenter (paragraph + sentence).
# unicode-segmentation provides UAX#29 word boundaries for abbreviation
# guard logic in the sentence splitter.
unicode-segmentation = "1"

[profile.dev]
opt-level = 0

# Max-performance release (mirrors ../moon's proven profile so cross-repo perf
# stays comparable). Fat LTO + a single codegen unit trade compile time for
# whole-program inlining across crate boundaries — the hot recall/embed/rerank
# paths are the win. `strip` drops symbols for a smaller text section (better
# icache); for backtraces or a profiler, build `--profile profiling` instead.
# LTO/codegen-units do NOT bake in CPU features, so the artifacts stay portable
# for the published pip/npm/crates.io builds (target-cpu=native is deliberately
# NOT set here for that reason).
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "unwind" # keep unwinding: #[should_panic] tests + catch_unwind

# Fast-iteration release: ~3-5x faster to link than the fat-LTO default, for
# local perf smoke / benchmark builds where the last few % don't matter.
[profile.release-fast]
inherits      = "release"
lto           = "thin"
codegen-units = 16
strip         = false

# Profiling/instruments build: full optimization but keep debug symbols so
# perf/Instruments/flamegraphs resolve frames.
[profile.profiling]
inherits = "release"
strip    = false
debug    = 1
