[book]
title = "Lunaris"
description = "Production-grade agent-memory engine in Rust, with Python and TypeScript SDKs. Sub-25 ms recall over millions of bi-temporal facts, with provable atomicity and a graph that's opt-in."
authors = ["The Lunaris contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/lunaris-dev/lunaris"
edit-url-template = "https://github.com/lunaris-dev/lunaris/edit/main/docs/book/{path}"
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
