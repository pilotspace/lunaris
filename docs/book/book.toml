[book]
title = "Lunaris"
description = "Production-grade agent-memory engine in Rust, with Python and TypeScript SDKs. Sub-25 ms recall over millions of bi-temporal facts, with provable atomicity and a graph that's opt-in."
authors = ["The Lunaris contributors"]
language = "en"
src = "src"

[output.html]
# Light-only site ("Lunaris Day"). Both the first-paint default and the
# OS-dark fallback resolve to "light"; the theme switcher is hidden in
# theme/custom.css so the dark ("Lunaris Night") palette is never reachable.
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/pilotspace/lunaris"
edit-url-template = "https://github.com/pilotspace/lunaris/edit/main/docs/book/{path}"
additional-css = ["theme/custom.css"]
additional-js = ["theme/force-light.js"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
