# Lunaris Quickstart — Moon on localhost:6380.
#
# 0.7.0 is Moon-only. The image this file used to build, and the relational
# backend it served, were both deleted in 0.7.0 — see
# `docs/migration/0.6-to-0.7.md`.
#
# HEADS UP: `ghcr.io/pilotspace/moon:0.8.5` is not pullable yet. The v0.8.5
# release shipped zero assets and the ghcr package answers `401` to an
# anonymous pull, so `docker compose up -d` fails today. This file is correct
# and starts working the moment those assets are re-cut (ship-plan task W0.1).
# Until then, build Moon from `vendor/moon` — see README.md, "Path B".
#
# Two flags are load-bearing and are therefore spelled out instead of left to
# the image's CMD (`vendor/moon/Dockerfile`, which ships `--shards 0`):
#
#   --shards 1          REQUIRED. Lunaris ingest is a single MULTI/EXEC TXN and
#                       Moon refuses cross-shard writes; `0` means auto-detect
#                       from CPU count, i.e. sharded, i.e. every ingest fails
#                       with "TXN does not support cross-shard writes".
#   --protected-mode no Docker networking is non-loopback, and protected mode
#                       rejects every connection arriving through a forwarded
#                       port.
#
# `--appendonly yes` keeps the quickstart's data across `docker compose
# restart`. `docker compose down -v` still wipes it.
#
# The healthcheck is INHERITED from the image (`moon --check-config`): the
# runtime is distroless — no shell, no redis-cli — so a `CMD-SHELL` probe
# cannot run. It is a liveness probe only; it does not prove the listener
# accepts writes. See `docs/operations/external-moon.md` for the production
# recipe (real probes, durability, resource limits).

services:
  moon:
    container_name: lunaris-quickstart-moon
    image: ghcr.io/pilotspace/moon:0.8.5
    command:
      [
        "moon",
        "--bind",
        "0.0.0.0",
        "--port",
        "6379",
        "--shards",
        "1",
        "--dir",
        "/data",
        "--appendonly",
        "yes",
        "--protected-mode",
        "no",
      ]
    ports:
      # host 6380 -> container 6379. 6380 keeps the quickstart off a
      # developer's default-port Redis/Moon.
      - "6380:6379"
    volumes:
      - moon-quickstart-data:/data

volumes:
  moon-quickstart-data:
