# Empty [workspace] keeps this example OUT of the parent workspace so
# the dependency surface stays minimal — a fresh-clone user can run
# `cd examples/quickstart-rs && cargo run` without inheriting all 18
# workspace crates' dev-deps.
[workspace]

[package]
name        = "lunaris-quickstart-rs"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.94"
publish     = false

# Phase 23 scaffold: standalone example for the 10-minute Postgres
# quickstart. NOT a workspace member — keeps the example flow honest
# (a fresh-clone user can `cd examples/quickstart-rs && cargo run`
# without inheriting workspace dev-deps or features).

[dependencies]
# `ollama` gives the smallest-external-dep path for the Ollama EXTRACTOR
# + VERIFIER (OllamaExtractor + Ollama verify tier). The embedder and
# reranker are always in-process (llama.cpp GGUF) — no Ollama needed for
# embedding. Extraction/verification are remote-only since the llama.cpp
# cutover; `cloud-api` selects the hosted-provider mux instead.
# Published on crates.io as `lunaris-memory` (the bare `lunaris` name is
# owned by an unrelated project); the import path is still `use lunaris::…`.
lunaris = { package = "lunaris-memory", path = "../../crates/lunaris", default-features = false, features = ["ollama"] }
tokio   = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow  = "1"
tracing-subscriber = "0.3"
